<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ecfdf5"/>
  <text x="120" y="110" font-size="54" font-family="'Segoe UI', Arial, sans-serif" fill="#166534" font-weight="700">光合作用流程图</text>
  <text x="120" y="160" font-size="25" font-family="'Segoe UI', Arial, sans-serif" fill="#166534">适合直接串联“原料 + 条件 + 场所 + 产物”</text>
  <g font-family="'Segoe UI', Arial, sans-serif">
    <rect x="120" y="280" width="250" height="160" rx="28" fill="#ffffff" stroke="#4ade80" stroke-width="5"/>
    <text x="200" y="340" font-size="32" fill="#166534" font-weight="700">水</text>
    <text x="160" y="388" font-size="23" fill="#166534">由根吸收进入植物</text>

    <rect x="450" y="280" width="250" height="160" rx="28" fill="#ffffff" stroke="#4ade80" stroke-width="5"/>
    <text x="500" y="340" font-size="32" fill="#166534" font-weight="700">二氧化碳</text>
    <text x="490" y="388" font-size="23" fill="#166534">由叶片气孔进入</text>

    <rect x="780" y="240" width="320" height="240" rx="32" fill="#dcfce7" stroke="#22c55e" stroke-width="6"/>
    <text x="860" y="320" font-size="36" fill="#166534" font-weight="700">叶绿体</text>
    <text x="840" y="372" font-size="25" fill="#166534">在光照条件下进行</text>
    <text x="830" y="414" font-size="25" fill="#166534">把无机物转成有机物</text>

    <rect x="1180" y="250" width="280" height="150" rx="28" fill="#ffffff" stroke="#86efac" stroke-width="5"/>
    <text x="1248" y="316" font-size="32" fill="#166534" font-weight="700">有机物</text>
    <text x="1222" y="360" font-size="23" fill="#166534">储存能量，供植物生长</text>

    <rect x="1180" y="470" width="280" height="150" rx="28" fill="#ffffff" stroke="#86efac" stroke-width="5"/>
    <text x="1268" y="536" font-size="32" fill="#166534" font-weight="700">氧气</text>
    <text x="1228" y="580" font-size="23" fill="#166534">释放到环境中</text>

    <path d="M370 360H450M700 360H780M1100 330H1180M1100 520H1180" stroke="#16a34a" stroke-width="10" fill="none"/>
  </g>
</svg>
