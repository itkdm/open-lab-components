<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bioBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bioBg)" />
  <text x="120" y="118" font-size="54" font-family="'Segoe UI', Arial, sans-serif" fill="#14532d" font-weight="700">有丝分裂阶段总览</text>
  <text x="120" y="170" font-size="26" font-family="'Segoe UI', Arial, sans-serif" fill="#166534">帮助学生建立“染色体变化”和“细胞形态变化”的整体认知</text>
  <g font-family="'Segoe UI', Arial, sans-serif">
    <circle cx="250" cy="380" r="120" fill="#ffffff" stroke="#4ade80" stroke-width="6" />
    <text x="196" y="372" font-size="34" fill="#166534" font-weight="700">前期</text>
    <text x="168" y="418" font-size="22" fill="#166534">染色质螺旋化</text>
    <text x="170" y="448" font-size="22" fill="#166534">核膜逐渐消失</text>

    <circle cx="560" cy="380" r="120" fill="#ffffff" stroke="#4ade80" stroke-width="6" />
    <text x="506" y="372" font-size="34" fill="#166534" font-weight="700">中期</text>
    <text x="470" y="418" font-size="22" fill="#166534">染色体排列在赤道板</text>
    <text x="492" y="448" font-size="22" fill="#166534">便于观察计数</text>

    <circle cx="870" cy="380" r="120" fill="#ffffff" stroke="#4ade80" stroke-width="6" />
    <text x="816" y="372" font-size="34" fill="#166534" font-weight="700">后期</text>
    <text x="784" y="418" font-size="22" fill="#166534">姐妹染色单体分离</text>
    <text x="800" y="448" font-size="22" fill="#166534">移向两极</text>

    <circle cx="1180" cy="380" r="120" fill="#ffffff" stroke="#4ade80" stroke-width="6" />
    <text x="1126" y="372" font-size="34" fill="#166534" font-weight="700">末期</text>
    <text x="1092" y="418" font-size="22" fill="#166534">核膜重新形成</text>
    <text x="1094" y="448" font-size="22" fill="#166534">染色体重新展开</text>

    <path d="M370 380H440M680 380H750M990 380H1060" stroke="#16a34a" stroke-width="8" />
    <polygon points="440,380 422,368 422,392" fill="#16a34a" />
    <polygon points="750,380 732,368 732,392" fill="#16a34a" />
    <polygon points="1060,380 1042,368 1042,392" fill="#16a34a" />
  </g>
  <g font-family="'Segoe UI', Arial, sans-serif">
    <rect x="120" y="560" width="640" height="220" rx="30" fill="#14532d" opacity="0.93" />
    <text x="170" y="628" font-size="34" fill="#f0fdf4" font-weight="700">教师讲解主线</text>
    <text x="170" y="682" font-size="25" fill="#dcfce7">• 染色体先变清楚，再排列，再分开</text>
    <text x="170" y="724" font-size="25" fill="#dcfce7">• 细胞核先消失，最后重新出现</text>
    <rect x="840" y="560" width="640" height="220" rx="30" fill="#ffffff" stroke="#4ade80" stroke-width="4" />
    <text x="890" y="628" font-size="34" fill="#166534" font-weight="700">结果</text>
    <text x="890" y="682" font-size="25" fill="#166534">形成两个遗传物质基本相同的子细胞</text>
    <text x="890" y="724" font-size="25" fill="#166534">适合衔接“生长、修复、繁殖”功能</text>
  </g>
</svg>
