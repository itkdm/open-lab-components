<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#fff7ed"/>
  <text x="120" y="110" font-size="54" font-family="'Segoe UI', Arial, sans-serif" fill="#9a3412" font-weight="700">物质三态粒子模型图</text>
  <text x="120" y="160" font-size="25" font-family="'Segoe UI', Arial, sans-serif" fill="#9a3412">用同一版式比较“排列是否紧密”和“粒子运动是否自由”</text>
  <g font-family="'Segoe UI', Arial, sans-serif">
    <rect x="120" y="240" width="380" height="500" rx="30" fill="#ffffff" stroke="#fdba74" stroke-width="5"/>
    <text x="270" y="300" font-size="34" fill="#9a3412" font-weight="700">固态</text>
    <g fill="#f97316">
      <circle cx="220" cy="390" r="22"/><circle cx="280" cy="390" r="22"/><circle cx="340" cy="390" r="22"/>
      <circle cx="220" cy="450" r="22"/><circle cx="280" cy="450" r="22"/><circle cx="340" cy="450" r="22"/>
      <circle cx="220" cy="510" r="22"/><circle cx="280" cy="510" r="22"/><circle cx="340" cy="510" r="22"/>
    </g>
    <text x="170" y="620" font-size="24" fill="#7c2d12">粒子排列紧密、规则</text>
    <text x="170" y="660" font-size="24" fill="#7c2d12">主要做振动，不易流动</text>

    <rect x="610" y="240" width="380" height="500" rx="30" fill="#ffffff" stroke="#fdba74" stroke-width="5"/>
    <text x="760" y="300" font-size="34" fill="#9a3412" font-weight="700">液态</text>
    <g fill="#fb923c">
      <circle cx="700" cy="390" r="22"/><circle cx="780" cy="370" r="22"/><circle cx="840" cy="410" r="22"/>
      <circle cx="740" cy="460" r="22"/><circle cx="820" cy="470" r="22"/><circle cx="880" cy="440" r="22"/>
      <circle cx="700" cy="530" r="22"/><circle cx="780" cy="545" r="22"/><circle cx="860" cy="520" r="22"/>
    </g>
    <text x="660" y="620" font-size="24" fill="#7c2d12">粒子较紧密，但可相互滑动</text>
    <text x="660" y="660" font-size="24" fill="#7c2d12">能流动，没有固定形状</text>

    <rect x="1100" y="240" width="380" height="500" rx="30" fill="#ffffff" stroke="#fdba74" stroke-width="5"/>
    <text x="1250" y="300" font-size="34" fill="#9a3412" font-weight="700">气态</text>
    <g fill="#fdba74">
      <circle cx="1180" cy="370" r="20"/><circle cx="1320" cy="420" r="20"/><circle cx="1220" cy="520" r="20"/>
      <circle cx="1380" cy="600" r="20"/><circle cx="1270" cy="470" r="20"/><circle cx="1420" cy="340" r="20"/>
    </g>
    <text x="1150" y="620" font-size="24" fill="#7c2d12">粒子间距大，运动更自由</text>
    <text x="1150" y="660" font-size="24" fill="#7c2d12">容易扩散，充满整个容器</text>
  </g>
</svg>
