<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="120" y="110" font-size="54" font-family="'Segoe UI', Arial, sans-serif" fill="#0f172a" font-weight="700">平面镜反射光路图</text>
  <text x="120" y="160" font-size="25" font-family="'Segoe UI', Arial, sans-serif" fill="#475569">适合直接讲“入射角 = 反射角”的课堂核心结论</text>
  <g font-family="'Segoe UI', Arial, sans-serif">
    <rect x="1040" y="210" width="28" height="470" fill="#94a3b8"/>
    <text x="1000" y="720" font-size="28" fill="#334155" font-weight="700">平面镜</text>
    <line x1="840" y1="450" x2="1040" y2="450" stroke="#f59e0b" stroke-width="10"/>
    <polygon points="1040,450 1008,434 1008,466" fill="#f59e0b"/>
    <line x1="1040" y1="450" x2="740" y2="260" stroke="#2563eb" stroke-width="10"/>
    <polygon points="724,250 752,250 742,278" fill="#2563eb"/>
    <line x1="1040" y1="450" x2="740" y2="640" stroke="#16a34a" stroke-width="10"/>
    <polygon points="724,650 742,622 752,650" fill="#16a34a"/>
    <line x1="1040" y1="240" x2="1040" y2="660" stroke="#ef4444" stroke-width="6" stroke-dasharray="14 10"/>
    <text x="1072" y="350" font-size="28" fill="#b91c1c" font-weight="700">法线</text>
    <text x="660" y="250" font-size="28" fill="#1d4ed8" font-weight="700">入射光线</text>
    <text x="650" y="680" font-size="28" fill="#166534" font-weight="700">反射光线</text>
    <text x="780" y="420" font-size="26" fill="#92400e">入射角</text>
    <text x="790" y="505" font-size="26" fill="#166534">反射角</text>
  </g>
</svg>
