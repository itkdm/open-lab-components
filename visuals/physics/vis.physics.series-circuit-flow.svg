<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">串联电路工作流程图</title>
  <desc id="desc">电池、开关、电阻和灯泡构成的串联电路教学流程图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12z" fill="#1d4ed8" />
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)" />
  <text x="120" y="120" font-size="54" font-family="'Segoe UI', Arial, sans-serif" fill="#0f172a" font-weight="700">串联电路工作流程</text>
  <text x="120" y="172" font-size="26" font-family="'Segoe UI', Arial, sans-serif" fill="#334155">从闭合开关到灯泡发光，帮助老师快速讲清基本电流路径</text>
  <g font-family="'Segoe UI', Arial, sans-serif">
    <rect x="120" y="250" width="280" height="180" rx="28" fill="#ffffff" stroke="#93c5fd" stroke-width="4" />
    <text x="160" y="315" font-size="34" fill="#1e3a8a" font-weight="700">1. 电源提供电势差</text>
    <text x="160" y="368" font-size="24" fill="#334155">电池推动电荷定向移动</text>
    <text x="160" y="404" font-size="24" fill="#334155">形成电流驱动力</text>

    <rect x="500" y="250" width="280" height="180" rx="28" fill="#ffffff" stroke="#93c5fd" stroke-width="4" />
    <text x="540" y="315" font-size="34" fill="#1e3a8a" font-weight="700">2. 开关闭合</text>
    <text x="540" y="368" font-size="24" fill="#334155">导线连成完整回路</text>
    <text x="540" y="404" font-size="24" fill="#334155">电流可以持续通过</text>

    <rect x="880" y="250" width="280" height="180" rx="28" fill="#ffffff" stroke="#93c5fd" stroke-width="4" />
    <text x="920" y="315" font-size="34" fill="#1e3a8a" font-weight="700">3. 电阻消耗能量</text>
    <text x="920" y="368" font-size="24" fill="#334155">限制电流大小</text>
    <text x="920" y="404" font-size="24" fill="#334155">帮助比较不同阻值</text>

    <rect x="1260" y="250" width="220" height="180" rx="28" fill="#fff7ed" stroke="#fb923c" stroke-width="4" />
    <text x="1304" y="315" font-size="34" fill="#9a3412" font-weight="700">4. 灯泡发光</text>
    <text x="1304" y="368" font-size="24" fill="#7c2d12">把电能转成光和热</text>

    <path d="M400 340H500" stroke="#1d4ed8" stroke-width="8" fill="none" marker-end="url(#arrow)" />
    <path d="M780 340H880" stroke="#1d4ed8" stroke-width="8" fill="none" marker-end="url(#arrow)" />
    <path d="M1160 340H1260" stroke="#1d4ed8" stroke-width="8" fill="none" marker-end="url(#arrow)" />
  </g>
  <g>
    <rect x="120" y="540" width="1360" height="220" rx="32" fill="#0f172a" opacity="0.92" />
    <text x="170" y="612" font-size="34" fill="#f8fafc" font-family="'Segoe UI', Arial, sans-serif" font-weight="700">教师可直接用于的讲解重点</text>
    <text x="170" y="666" font-size="26" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif">• 串联电路只有一条电流路径</text>
    <text x="170" y="708" font-size="26" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif">• 开关控制整个回路是否闭合</text>
    <text x="720" y="666" font-size="26" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif">• 电阻越大，灯泡通常越暗</text>
    <text x="720" y="708" font-size="26" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif">• 可以结合电流表、电压表继续扩展实验</text>
  </g>
</svg>
