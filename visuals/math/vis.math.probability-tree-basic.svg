<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f5f3ff"/>
  <text x="120" y="110" font-size="54" font-family="'Segoe UI', Arial, sans-serif" fill="#6d28d9" font-weight="700">基础概率树状图</text>
  <text x="120" y="160" font-size="25" font-family="'Segoe UI', Arial, sans-serif" fill="#6d28d9">适合讲“两步随机事件”的分类讨论思路</text>
  <g font-family="'Segoe UI', Arial, sans-serif" stroke="#7c3aed" stroke-width="6" fill="none">
    <circle cx="260" cy="450" r="18" fill="#7c3aed"/>
    <line x1="278" y1="450" x2="560" y2="280"/>
    <line x1="278" y1="450" x2="560" y2="620"/>
    <line x1="578" y1="280" x2="900" y2="190"/>
    <line x1="578" y1="280" x2="900" y2="370"/>
    <line x1="578" y1="620" x2="900" y2="530"/>
    <line x1="578" y1="620" x2="900" y2="710"/>
    <circle cx="560" cy="280" r="16" fill="#7c3aed"/>
    <circle cx="560" cy="620" r="16" fill="#7c3aed"/>
  </g>
  <g font-family="'Segoe UI', Arial, sans-serif">
    <text x="180" y="430" font-size="30" fill="#5b21b6" font-weight="700">开始</text>
    <text x="430" y="250" font-size="28" fill="#5b21b6">第一步 A</text>
    <text x="430" y="650" font-size="28" fill="#5b21b6">第一步 B</text>
    <text x="720" y="180" font-size="26" fill="#5b21b6">第二步 A1</text>
    <text x="720" y="400" font-size="26" fill="#5b21b6">第二步 A2</text>
    <text x="720" y="520" font-size="26" fill="#5b21b6">第二步 B1</text>
    <text x="720" y="740" font-size="26" fill="#5b21b6">第二步 B2</text>
    <text x="1020" y="194" font-size="24" fill="#6d28d9">路径 A → A1</text>
    <text x="1020" y="374" font-size="24" fill="#6d28d9">路径 A → A2</text>
    <text x="1020" y="534" font-size="24" fill="#6d28d9">路径 B → B1</text>
    <text x="1020" y="714" font-size="24" fill="#6d28d9">路径 B → B2</text>
    <rect x="1120" y="280" width="320" height="240" rx="30" fill="#ffffff" stroke="#c4b5fd" stroke-width="4"/>
    <text x="1170" y="350" font-size="30" fill="#5b21b6" font-weight="700">课堂讲解重点</text>
    <text x="1170" y="405" font-size="23" fill="#6d28d9">1. 每一步都要分清分支</text>
    <text x="1170" y="445" font-size="23" fill="#6d28d9">2. 路径概率通常用乘法</text>
    <text x="1170" y="485" font-size="23" fill="#6d28d9">3. 同类结果再做加法汇总</text>
  </g>
</svg>
