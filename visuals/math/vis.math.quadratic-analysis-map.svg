<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f5f3ff" />
  <text x="120" y="118" font-size="54" font-family="'Segoe UI', Arial, sans-serif" fill="#4c1d95" font-weight="700">二次函数分析导图</text>
  <text x="120" y="170" font-size="26" font-family="'Segoe UI', Arial, sans-serif" fill="#6d28d9">围绕 y = ax² + bx + c 的核心判读路径，适合复习总结</text>
  <g font-family="'Segoe UI', Arial, sans-serif">
    <rect x="620" y="300" width="360" height="180" rx="30" fill="#ffffff" stroke="#a78bfa" stroke-width="5" />
    <text x="700" y="372" font-size="42" fill="#5b21b6" font-weight="700">y = ax² + bx + c</text>
    <text x="704" y="422" font-size="26" fill="#6d28d9">从系数到图像特征</text>

    <rect x="140" y="260" width="300" height="150" rx="26" fill="#ede9fe" stroke="#a78bfa" stroke-width="4" />
    <text x="190" y="322" font-size="32" fill="#5b21b6" font-weight="700">a 决定开口</text>
    <text x="184" y="366" font-size="23" fill="#5b21b6">a&gt;0 开口向上</text>
    <text x="184" y="398" font-size="23" fill="#5b21b6">a&lt;0 开口向下</text>

    <rect x="1160" y="260" width="300" height="150" rx="26" fill="#ede9fe" stroke="#a78bfa" stroke-width="4" />
    <text x="1206" y="322" font-size="32" fill="#5b21b6" font-weight="700">顶点与最值</text>
    <text x="1200" y="366" font-size="23" fill="#5b21b6">顶点给出最大值或最小值</text>
    <text x="1200" y="398" font-size="23" fill="#5b21b6">适合解决最优化问题</text>

    <rect x="220" y="560" width="340" height="160" rx="26" fill="#ffffff" stroke="#c4b5fd" stroke-width="4" />
    <text x="270" y="622" font-size="32" fill="#5b21b6" font-weight="700">对称轴</text>
    <text x="270" y="668" font-size="23" fill="#5b21b6">x = -b / 2a</text>

    <rect x="1040" y="560" width="340" height="160" rx="26" fill="#ffffff" stroke="#c4b5fd" stroke-width="4" />
    <text x="1090" y="622" font-size="32" fill="#5b21b6" font-weight="700">增减性</text>
    <text x="1090" y="668" font-size="23" fill="#5b21b6">对称轴左、右两侧规律相反</text>

    <path d="M440 336H620M980 336H1160M560 640L700 480M1040 640L900 480" stroke="#7c3aed" stroke-width="8" fill="none" />
  </g>
</svg>
