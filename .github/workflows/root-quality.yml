name: Root Quality

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:
    branches:
      - main
      - master

jobs:
  root-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/runtime-harness/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install runtime harness dependencies
        run: npm --prefix tools/runtime-harness ci

      - name: Run root quality checks
        run: node tools/check-root/index.js
