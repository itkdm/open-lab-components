<div class="cmp" data-cmp-id="chem.labware.separating-funnel.basic" role="img" aria-label="分液漏斗">
  <svg class="sf__svg" viewBox="0 0 80 200" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <defs>
      <clipPath id="sf__clip__default">
        <!-- 梨形瓶身内部 -->
        <path d="M36,10 L36,30 C20,40 12,65 12,90 Q12,130 40,140 Q68,130 68,90 C68,65 60,40 44,30 L44,10 Z"/>
      </clipPath>
    </defs>

    <!-- 瓶口（开口） -->
    <path d="M33,6 L33,10 L36,10 L36,30 M44,30 L44,10 L47,10 L47,6"
          fill="none" stroke="var(--cmp-stroke,#546e7a)"
          stroke-width="var(--cmp-stroke-width,1.8)" stroke-linecap="round"/>
    <!-- 瓶口填充 -->
    <rect x="34" y="7" width="12" height="24" fill="rgba(220,240,255,0.25)" stroke="none"/>

    <!-- 瓶塞 -->
    <path d="M32,6 L32,2 Q32,0 40,0 Q48,0 48,2 L48,6"
          fill="#8d6e63" stroke="var(--cmp-stroke,#546e7a)" stroke-width="1" stroke-linejoin="round"/>

    <!-- 梨形瓶身 -->
    <path d="M36,30 C20,40 12,65 12,90 Q12,130 40,140 Q68,130 68,90 C68,65 60,40 44,30"
          fill="rgba(220,240,255,0.25)"
          stroke="var(--cmp-stroke,#546e7a)"
          stroke-width="var(--cmp-stroke-width,1.8)"
          stroke-linejoin="round"/>

    <!-- 下层液体 -->
    <rect class="sf__lower" x="10" y="100" width="60" height="42"
          fill="var(--cmp-lower,#81d4fa)" opacity="0.5"
          clip-path="url(#sf__clip__default)"/>

    <!-- 上层液体 -->
    <rect class="sf__upper" x="10" y="60" width="60" height="40"
          fill="var(--cmp-upper,#fff9c4)" opacity="0.5"
          clip-path="url(#sf__clip__default)"/>

    <!-- 分界线 -->
    <line class="sf__boundary" x1="14" y1="100" x2="66" y2="100"
          stroke="#90a4ae" stroke-width="0.6" stroke-dasharray="2,2" opacity="0.4"/>

    <!-- 活塞座 -->
    <rect x="34" y="140" width="12" height="10" rx="2"
          fill="rgba(220,240,255,0.3)"
          stroke="var(--cmp-stroke,#546e7a)" stroke-width="1"/>

    <g class="sf__stopcock">

<script>
(() => {
  const root = document.currentScript?.previousElementSibling;
  if (!root || root.getAttribute("data-cmp-id") !== "chem.labware.separating-funnel.basic") return;

  const uid = "sf_" + Math.random().toString(36).slice(2, 8);
  const clip = root.querySelector("#sf__clip__default");
  if (clip) clip.id = uid + "_clip";
  root.querySelectorAll("[clip-path]").forEach(el =>
    el.setAttribute("clip-path", `url(#${uid}_clip)`));

  const upperEl = root.querySelector(".sf__upper");
  const lowerEl = root.querySelector(".sf__lower");
  const boundary = root.querySelector(".sf__boundary");
  const drip = root.querySelector(".sf__drip");
  const handle = root.querySelector(".sf__handle");

  /* 瓶身内部: y=30(颈底) → y=140(活塞座顶) */
  const Y_TOP = 30, Y_BOT = 142;

  function parseProps() {
    try { const r = root.getAttribute("data-props"); return r ? JSON.parse(r) || {} : {}; } catch (e) { return {}; }
  }

  function render() {
    const props = parseProps();
    const uLevel = Math.max(0, Math.min(0.95, Number(props.upperLevel) || 0.7));
    const lLevel = Math.max(0, Math.min(0.95, Number(props.lowerLevel) || 0.35));
    const open = props.stopcock === "open";

    const range = Y_BOT - Y_TOP;
    /* 下层从底部向上 */
    const lowerH = lLevel * range;
    const lowerY = Y_BOT - lowerH;
    /* 上层从下层顶部继续向上 */
    const upperH = uLevel * range;
    const upperY = lowerY - upperH;

    if (lowerEl) {
      lowerEl.setAttribute("y", String(lowerY));
      lowerEl.setAttribute("height", String(Math.max(0, Y_BOT - lowerY + 2)));
    }
    if (upperEl) {
      upperEl.setAttribute("y", String(Math.max(Y_TOP, upperY)));
      upperEl.setAttribute("height", String(Math.max(0, lowerY - Math.max(Y_TOP, upperY))));
    }
    if (boundary) {
      boundary.setAttribute("y1", String(lowerY));
      boundary.setAttribute("y2", String(lowerY));
      boundary.style.display = (uLevel > 0.01 && lLevel > 0.01) ? "" : "none";
    }

    if (drip) drip.style.display = open ? "" : "none";
    if (handle) handle.setAttribute("fill", open ? "#a5d6a7" : "#78909c");
  }

  render();
  const obs = new MutationObserver(render);
  obs.observe(root, { attributes: true, attributeFilter: ["style", "data-props"] });
  window.addEventListener("beforeunload", () => obs.disconnect(), { once: true });
})();
</script>
