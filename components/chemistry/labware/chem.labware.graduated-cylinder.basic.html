<!-- @cmp-manifest
{
  "schema": "cmp-manifest/v1",
  "id": "chem.labware.graduated-cylinder.basic",
  "name": "量筒",
  "nameEn": "Graduated Cylinder",
  "category": "chemistry/labware",
  "version": "1.0.0",
  "viewport": { "w": 70, "h": 200 },
  "tags": ["chemistry", "labware", "cylinder", "graduated", "volume", "measurement"],
  "props": [
    { "key": "size",        "type": "number(px)", "default": 200, "min": 120, "max": 400, "desc": "组件高度" },
    { "key": "liquidLevel", "type": "number(0-1)", "default": 0.5, "min": 0, "max": 1, "desc": "液面高度占比" },
    { "key": "scaleMin",    "type": "number", "default": 0,   "desc": "刻度最小值(mL)" },
    { "key": "scaleMax",    "type": "number", "default": 100, "desc": "刻度最大值(mL)" },
    { "key": "majorStep",   "type": "number", "default": 10,  "min": 1, "desc": "主刻度间隔" },
    { "key": "minorStep",   "type": "number", "default": 2,   "min": 1, "desc": "次刻度间隔" },
    { "key": "liquidColor", "type": "color",  "default": "#4db6ac", "desc": "液体颜色" },
    { "key": "glassTint",   "type": "color",  "default": "rgba(226,242,255,0.45)", "desc": "玻璃底色" },
    { "key": "stroke",      "type": "color",  "default": "#2f4f5f", "desc": "描边颜色" },
    { "key": "strokeWidth", "type": "number", "default": 1.5, "min": 0.5, "max": 4, "desc": "描边粗细" },
    { "key": "markColor",   "type": "color",  "default": "rgba(47,79,95,0.5)", "desc": "刻度线颜色" }
  ],
  "cssVars": {
    "size":        "--cmp-size",
    "liquidLevel": "--cmp-liquid-level",
    "scaleMin":    "--cmp-scale-min",
    "scaleMax":    "--cmp-scale-max",
    "majorStep":   "--cmp-scale-major-step",
    "minorStep":   "--cmp-scale-minor-step",
    "liquidColor": "--cmp-liquid-color",
    "glassTint":   "--cmp-glass-tint",
    "stroke":      "--cmp-stroke",
    "strokeWidth": "--cmp-stroke-width",
    "markColor":   "--cmp-mark-color"
  }
}
-->
<div class="cmp" data-cmp-id="chem.labware.graduated-cylinder.basic" role="img" aria-label="量筒">
  <svg class="gc__svg" viewBox="0 0 70 200" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <!-- ===== 底座 ===== -->
    <rect x="12" y="188" width="46" height="8" rx="3"
          fill="var(--cmp-glass-tint,rgba(226,242,255,0.45))"
          stroke="var(--cmp-stroke,#2f4f5f)"
          stroke-width="var(--cmp-stroke-width,1.5)"/>
    <!-- 底座高光 -->
    <rect x="15" y="189" width="40" height="3" rx="1.5" fill="#ffffff" opacity="0.2"/>

    <!-- ===== 筒身（窄长圆柱） ===== -->
    <rect class="gc__body" x="18" y="18" width="34" height="172" rx="2"
          fill="var(--cmp-glass-tint,rgba(226,242,255,0.45))"
          stroke="var(--cmp-stroke,#2f4f5f)"
          stroke-width="var(--cmp-stroke-width,1.5)"/>

    <!-- ===== 液体 ===== -->
    <rect class="gc__liquid" x="19.5" y="100" width="31" height="88.5" rx="1"
          fill="var(--cmp-liquid-color,#4db6ac)" opacity="0.7"/>
    <!-- 液面弯月面 -->
    <ellipse class="gc__meniscus" cx="35" cy="100" rx="15" ry="3"
             fill="var(--cmp-liquid-color,#4db6ac)" opacity="0.35"/>

    <!-- ===== 刻度 ===== -->
    <g class="gc__scale-layer"></g>

    <!-- ===== 读数标签 ===== -->
    <text class="gc__readout" x="35" y="14" font-size="8" font-weight="600"
          font-family="'DIN Alternate','Arial Narrow','Segoe UI',sans-serif"
          fill="var(--cmp-stroke,#2f4f5f)" text-anchor="middle" opacity="0.7">0 mL</text>

    <!-- ===== 玻璃高光 ===== -->
    <rect x="20" y="20" width="5" height="166" rx="2"
          fill="#ffffff" opacity="0.18"/>
    <!-- 右侧微弱反光 -->
    <rect x="47" y="20" width="3" height="166" rx="1.5"
          fill="#ffffff" opacity="0.08"/>

    <!-- ===== 口部（微喇叭口 + 倒液嘴） ===== -->
    <path d="M16,20 L18,18 L52,18 L54,20"
          fill="none" stroke="var(--cmp-stroke,#2f4f5f)"
          stroke-width="var(--cmp-stroke-width,1.5)"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 倒液嘴 -->
    <path d="M54,20 C56,18 57,16 56,14"
          fill="none" stroke="var(--cmp-stroke,#2f4f5f)"
          stroke-width="calc(var(--cmp-stroke-width,1.5) * 0.8)"
          stroke-linecap="round"/>
  </svg>
</div>

<script>
(() => {
  const root = document.currentScript?.previousElementSibling;
  if (!root || root.getAttribute("data-cmp-id") !== "chem.labware.graduated-cylinder.basic") return;

  const NS = "http://www.w3.org/2000/svg";
  const scaleLayer = root.querySelector(".gc__scale-layer");
  const liquidEl = root.querySelector(".gc__liquid");
  const meniscusEl = root.querySelector(".gc__meniscus");
  const readoutEl = root.querySelector(".gc__readout");

  /* 筒身内部区域: y=20(顶) → y=188(底), 可用高度 168px */
  const Y_TOP = 20, Y_BOT = 188, X_RIGHT = 50, X_LEFT = 20;

  function parseDataProps() {
    const raw = root.getAttribute("data-props");
    if (!raw) return {};
    try { const p = JSON.parse(raw); return p && typeof p === "object" ? p : {}; } catch (e) { return {}; }
  }

  function readNumber(props, key, cssVar, fallback) {
    if (Number.isFinite(Number(props[key]))) return Number(props[key]);
    const v = getComputedStyle(root).getPropertyValue(cssVar).trim();
    const n = Number.parseFloat(v);
    return Number.isFinite(n) ? n : fallback;
  }

  function renderScale() {
    const props = parseDataProps();

    let min = readNumber(props, "scaleMin", "--cmp-scale-min", 0);
    let max = readNumber(props, "scaleMax", "--cmp-scale-max", 100);
    let majorStep = readNumber(props, "majorStep", "--cmp-scale-major-step", 10);
    let minorStep = readNumber(props, "minorStep", "--cmp-scale-minor-step", 2);

    if (max <= min) max = min + 1;
    if (majorStep <= 0) majorStep = (max - min) / 5;
    if (minorStep <= 0) minorStep = majorStep / 5;
    if (minorStep > majorStep) minorStep = majorStep;

    const range = max - min;
    const maxTicks = 100;
    if (range / minorStep > maxTicks) minorStep = range / maxTicks;

    const eps = Math.max(minorStep * 0.02, 1e-6);
    const usableH = Y_BOT - Y_TOP;

    scaleLayer.innerHTML = "";

    /* 生成刻度值 */
    const values = [min];
    for (let v = min + minorStep; v < max - eps; v += minorStep) values.push(v);
    if (Math.abs(values[values.length - 1] - max) > eps) values.push(max);

    for (const value of values) {
      const ratio = (value - min) / range;
      const y = Y_BOT - ratio * usableH;

      const delta = value - min;
      const majorRem = ((delta % majorStep) + majorStep) % majorStep;
      const isMajor = Math.abs(majorRem) < eps || Math.abs(majorRem - majorStep) < eps;

      const tickLen = isMajor ? 18 : 10;
      const x1 = X_RIGHT - tickLen;

      const line = document.createElementNS(NS, "line");
      line.setAttribute("x1", String(x1));
      line.setAttribute("x2", String(X_RIGHT));
      line.setAttribute("y1", String(y));
      line.setAttribute("y2", String(y));
      line.setAttribute("stroke", "var(--cmp-mark-color,rgba(47,79,95,0.5))");
      line.setAttribute("stroke-width", isMajor ? "1.2" : "0.7");
      scaleLayer.appendChild(line);

      if (isMajor) {
        const text = document.createElementNS(NS, "text");
        text.setAttribute("x", String(x1 - 2));
        let textY = y;
        if (Math.abs(value - max) < eps) textY = y + 5;
        if (Math.abs(value - min) < eps) textY = y - 3;
        text.setAttribute("y", String(textY));
        text.setAttribute("font-size", "7");
        text.setAttribute("font-family", "'DIN Alternate','Arial Narrow',sans-serif");
        text.setAttribute("font-weight", "600");
        text.setAttribute("fill", "var(--cmp-mark-color,rgba(47,79,95,0.5))");
        text.setAttribute("text-anchor", "end");
        text.setAttribute("dominant-baseline", "middle");
        text.textContent = String(Math.round(value));
        scaleLayer.appendChild(text);
      }
    }

    /* 液面 */
    let liquidLevel = readNumber(props, "liquidLevel", "--cmp-liquid-level", 0.5);
    liquidLevel = Math.max(0, Math.min(1, liquidLevel));

    const liquidH = liquidLevel * usableH;
    const liquidY = Y_BOT - liquidH;

    if (liquidEl) {
      liquidEl.setAttribute("y", String(liquidY));
      liquidEl.setAttribute("height", String(Math.max(0, liquidH)));
    }
    if (meniscusEl) {
      meniscusEl.setAttribute("cy", String(liquidY));
      meniscusEl.style.display = liquidLevel > 0.01 ? "" : "none";
    }

    /* 读数 */
    const currentValue = min + liquidLevel * range;
    if (readoutEl) {
      readoutEl.textContent = Math.round(currentValue) + " mL";
    }
    root.setAttribute("aria-label", "量筒，当前 " + Math.round(currentValue) + " mL");
  }

  renderScale();

  const observer = new MutationObserver(() => renderScale());
  observer.observe(root, { attributes: true, attributeFilter: ["style", "data-props"] });
  window.addEventListener("beforeunload", () => observer.disconnect(), { once: true });
})();
</script>

<style>
  .cmp[data-cmp-id="chem.labware.graduated-cylinder.basic"] {
    height: var(--cmp-size, 200px);
    width: calc(var(--cmp-size, 200px) * 0.35);
    display: inline-block;
  }

  .cmp[data-cmp-id="chem.labware.graduated-cylinder.basic"] .gc__svg {
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
