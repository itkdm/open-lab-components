<div class="cmp" data-cmp-id="math.geometry.coordinate-grid.interactive" role="img" aria-label="方向与位置">
  <style>
    .cmp[data-cmp-id="math.geometry.coordinate-grid.interactive"] {
      --sz: var(--cmp-size, 320px);
      display: inline-block; width: var(--sz); height: var(--sz);
      user-select: none; touch-action: none;
    }
    .cmp[data-cmp-id="math.geometry.coordinate-grid.interactive"] svg {
      display: block; width: 100%; height: 100%;
    }
    .cmp[data-cmp-id="math.geometry.coordinate-grid.interactive"] .cg__hit {
      cursor: pointer;
    }
    .cmp[data-cmp-id="math.geometry.coordinate-grid.interactive"] .cg__hit:hover + .cg__preview {
      opacity: 0.3;
    }
    .cmp[data-cmp-id="math.geometry.coordinate-grid.interactive"] .cg__marker {
      cursor: pointer;
    }
    .cmp[data-cmp-id="math.geometry.coordinate-grid.interactive"] .cg__lbl {
      font-family: Arial, 'Microsoft YaHei', sans-serif; pointer-events: none;
    }
  </style>

  <svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
</div>

<script>
(function() {
  var sc = document.currentScript;
  if (!sc) return;
  var root = sc.previousElementSibling;
  if (!root || root.getAttribute('data-cmp-id') !== 'math.geometry.coordinate-grid.interactive') return;
  var svg = root.querySelector('svg');
  if (!svg) return;

  var uid = 'cg_' + Math.random().toString(36).slice(2, 8);
  var P = {};
  try { var d = root.getAttribute('data-props'); if (d) { var o = JSON.parse(d); if (o && typeof o === 'object') P = o; } } catch(e) {}

  var N = Math.max(4, Math.min(12, Number(P.gridSize) || 8));
  var COLORS = ['#EF5350','#42A5F5','#66BB6A','#FF9800','#AB47BC','#26C6DA','#FF7043','#FFEE58'];
  var MAX_MARKERS = 8;
  var markers = []; // {col, row, color}
  var colorIdx = 0;
  var lastPair = null;

  /* grid area: x 40..310, y 10..280 */
  var OX = 40, OY = 280, GW = 270, GH = 270;
  var cell = GW / N;

  function colX(c) { return OX + c * cell; }
  function rowY(r) { return OY - r * cell; }

  function findMarker(c, r) {
    for (var i = 0; i < markers.length; i++) {
      if (markers[i].col === c && markers[i].row === r) return i;
    }
    return -1;
  }

  function emit(c, r) {
    root.dispatchEvent(new CustomEvent('cmp:change', {
      bubbles: true, composed: true,
      detail: { id: root.getAttribute('data-cmp-id'), type: 'toggle',
        values: { col: c, row: r, markers: markers.map(function(m) { return {col: m.col, row: m.row, color: m.color}; }) } }
    }));
  }

  function render() {
    var h = '';
    var font = "font-family=\"Arial,'Microsoft YaHei',sans-serif\"";

    /* background */
    h += '<rect width="320" height="320" fill="#FAFAFA" rx="4"/>';

    /* grid lines */
    for (var i = 0; i <= N; i++) {
      var x = colX(i), y = rowY(i);
      h += '<line x1="' + x + '" y1="' + rowY(0) + '" x2="' + x + '" y2="' + rowY(N) + '" stroke="#D0D0D0" stroke-width="0.7"/>';
      h += '<line x1="' + colX(0) + '" y1="' + y + '" x2="' + colX(N) + '" y2="' + y + '" stroke="#D0D0D0" stroke-width="0.7"/>';
    }

    /* intersection dots */
    for (var c = 0; c <= N; c++) {
      for (var r = 0; r <= N; r++) {
        h += '<circle cx="' + colX(c) + '" cy="' + rowY(r) + '" r="1.5" fill="#BDBDBD"/>';
      }
    }

    /* axes (thicker) */
    h += '<line x1="' + OX + '" y1="' + OY + '" x2="' + colX(N) + '" y2="' + OY + '" stroke="#616161" stroke-width="1.5"/>';
    h += '<line x1="' + OX + '" y1="' + OY + '" x2="' + OX + '" y2="' + rowY(N) + '" stroke="#616161" stroke-width="1.5"/>';

    /* column numbers (bottom) */
    for (var c = 1; c <= N; c++) {
      h += '<text class="cg__lbl" x="' + colX(c) + '" y="' + (OY + 16) + '" text-anchor="middle" font-size="10" fill="#455A64" ' + font + '>' + c + '</text>';
    }
    /* row numbers (left, bottom-to-top) */
    for (var r = 1; r <= N; r++) {
      h += '<text class="cg__lbl" x="' + (OX - 8) + '" y="' + (rowY(r) + 4) + '" text-anchor="end" font-size="10" fill="#455A64" ' + font + '>' + r + '</text>';
    }

    /* origin label */
    h += '<text class="cg__lbl" x="' + (OX - 4) + '" y="' + (OY + 16) + '" text-anchor="end" font-size="9" fill="#9E9E9E" ' + font + '>(0,0)</text>';
    /* axis labels */
    h += '<text class="cg__lbl" x="' + ((colX(0) + colX(N)) / 2) + '" y="' + (OY + 28) + '" text-anchor="middle" font-size="11" font-weight="bold" fill="#78909C" ' + font + '>列</text>';
    h += '<text class="cg__lbl" x="' + (OX - 20) + '" y="' + ((rowY(0) + rowY(N)) / 2 + 4) + '" text-anchor="middle" font-size="11" font-weight="bold" fill="#78909C" ' + font + ' transform="rotate(-90,' + (OX - 20) + ',' + ((rowY(0) + rowY(N)) / 2) + ')">行</text>';

    /* guide lines for markers */
    for (var i = 0; i < markers.length; i++) {
      var m = markers[i], mx = colX(m.col), my = rowY(m.row);
      h += '<line x1="' + mx + '" y1="' + my + '" x2="' + mx + '" y2="' + OY + '" stroke="' + m.color + '" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.5"/>';
      h += '<line x1="' + mx + '" y1="' + my + '" x2="' + OX + '" y2="' + my + '" stroke="' + m.color + '" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.5"/>';
    }

    /* markers */
    h += '<defs><filter id="' + uid + '_sh"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.25"/></filter></defs>';
    for (var i = 0; i < markers.length; i++) {
      var m = markers[i], mx = colX(m.col), my = rowY(m.row);
      h += '<circle class="cg__marker" cx="' + mx + '" cy="' + my + '" r="8" fill="' + m.color + '" stroke="#fff" stroke-width="2" filter="url(#' + uid + '_sh)" data-mc="' + m.col + '" data-mr="' + m.row + '"/>';
      /* label */
      var lx = mx + 12, anchor = 'start';
      if (m.col >= N - 1) { lx = mx - 12; anchor = 'end'; }
      h += '<text class="cg__lbl" x="' + lx + '" y="' + (my - 10) + '" text-anchor="' + anchor + '" font-size="9" font-weight="bold" fill="' + m.color + '" ' + font + '>(' + m.col + ',' + m.row + ')</text>';
    }

    /* invisible hit areas for intersections (1..N) */
    for (var c = 1; c <= N; c++) {
      for (var r = 1; r <= N; r++) {
        if (findMarker(c, r) >= 0) continue;
        var ix = colX(c), iy = rowY(r);
        h += '<circle class="cg__hit" cx="' + ix + '" cy="' + iy + '" r="10" fill="transparent" data-hc="' + c + '" data-hr="' + r + '"/>';
        h += '<circle class="cg__preview" cx="' + ix + '" cy="' + iy + '" r="6" fill="#9E9E9E" opacity="0" pointer-events="none"/>';
      }
    }

    /* bottom display */
    var pairText = lastPair ? '(' + lastPair[0] + ', ' + lastPair[1] + ')' : '—';
    h += '<text class="cg__lbl" x="40" y="308" font-size="11" fill="#455A64" ' + font + '>数对: <tspan font-weight="bold">' + pairText + '</tspan></text>';
    h += '<text class="cg__lbl" x="310" y="308" text-anchor="end" font-size="11" fill="#455A64" ' + font + '>已标记: <tspan font-weight="bold">' + markers.length + '</tspan> 个</text>';

    svg.innerHTML = h;
  }

  svg.addEventListener('click', function(e) {
    var t = e.target;
    /* click on marker to remove */
    if (t.classList.contains('cg__marker')) {
      var mc = +t.getAttribute('data-mc'), mr = +t.getAttribute('data-mr');
      var idx = findMarker(mc, mr);
      if (idx >= 0) {
        markers.splice(idx, 1);
        lastPair = [mc, mr];
        render(); emit(mc, mr);
      }
      return;
    }
    /* click on hit area to place */
    if (t.classList.contains('cg__hit')) {
      var c = +t.getAttribute('data-hc'), r = +t.getAttribute('data-hr');
      if (markers.length >= MAX_MARKERS) return;
      markers.push({ col: c, row: r, color: COLORS[colorIdx % COLORS.length] });
      colorIdx++;
      lastPair = [c, r];
      render(); emit(c, r);
    }
  });

  render();
})();
</script>
