<div class="cmp" data-cmp-id="math.geometry.tangram.basic" role="img" aria-label="七巧板">
  <svg class="tg__svg" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <!-- 标准七巧板拼合（200×200 正方形）
         基于 4×4 网格，单元格 50px
         顶点坐标基于网格交点 -->

    <!-- 大三角1（左上→右上→左下） -->
    <polygon class="tg__p tg__p1" points="10,10 190,10 10,190"
             fill="var(--cmp-c1,#e53935)" stroke="var(--cmp-stroke,#263238)"
             stroke-width="var(--cmp-stroke-width,1.5)" stroke-linejoin="round"/>

    <!-- 大三角2（右上→右下→左下） -->
    <polygon class="tg__p tg__p2" points="190,10 190,190 10,190"
             fill="var(--cmp-c2,#fb8c00)" stroke="var(--cmp-stroke,#263238)"
             stroke-width="var(--cmp-stroke-width,1.5)" stroke-linejoin="round"/>

    <!-- 中三角（中心→右→下） -->
    <polygon class="tg__p tg__p3" points="100,100 190,100 100,190"
             fill="var(--cmp-c3,#fdd835)" stroke="var(--cmp-stroke,#263238)"
             stroke-width="var(--cmp-stroke-width,1.5)" stroke-linejoin="round"/>

    <!-- 小三角1 -->
    <polygon class="tg__p tg__p4" points="10,190 100,100 100,190"
             fill="var(--cmp-c4,#43a047)" stroke="var(--cmp-stroke,#263238)"
             stroke-width="var(--cmp-stroke-width,1.5)" stroke-linejoin="round"/>

    <!-- 小三角2 -->
    <polygon class="tg__p tg__p5" points="100,10 145,55 55,55"
             fill="var(--cmp-c5,#1e88e5)" stroke="var(--cmp-stroke,#263238)"
             stroke-width="var(--cmp-stroke-width,1.5)" stroke-linejoin="round"/>

    <!-- 正方形 -->
    <polygon class="tg__p tg__p6" points="55,55 100,100 55,145 10,100"
             fill="var(--cmp-c6,#8e24aa)" stroke="var(--cmp-stroke,#263238)"
             stroke-width="var(--cmp-stroke-width,1.5)" stroke-linejoin="round"/>

    <!-- 平行四边形 -->
    <polygon class="tg__p tg__p7" points="145,55 190,10 190,100 100,100"
             fill="var(--cmp-c7,#00897b)" stroke="var(--cmp-stroke,#263238)"
             stroke-width="var(--cmp-stroke-width,1.5)" stroke-linejoin="round"/>
  </svg>
</div>

<script>
(() => {
  const root = document.currentScript?.previousElementSibling;
  if (!root || root.getAttribute("data-cmp-id") !== "math.geometry.tangram.basic") return;

  /* 拼合状态坐标 */
  const assembled = [
    "10,10 190,10 10,190",
    "190,10 190,190 10,190",
    "100,100 190,100 100,190",
    "10,190 100,100 100,190",
    "100,10 145,55 55,55",
    "55,55 100,100 55,145 10,100",
    "145,55 190,10 190,100 100,100"
  ];

  /* 分解展示坐标（各块分散开） */
  const exploded = [
    "10,10 100,10 10,100",
    "120,10 190,10 190,80",
    "80,100 130,100 80,150",
    "10,130 50,170 10,170",
    "130,110 155,135 105,135",
    "50,110 80,140 50,170 20,140",
    "120,150 190,150 190,190 160,190"
  ];

  const pieces = root.querySelectorAll(".tg__p");

  function update() {
    let props = {};
    try { const r = root.getAttribute("data-props"); if (r) props = JSON.parse(r) || {}; } catch (e) {}
    const isExploded = props.exploded === "on";
    const coords = isExploded ? exploded : assembled;
    pieces.forEach((p, i) => {
      if (coords[i]) p.setAttribute("points", coords[i]);
    });
  }

  update();
  const obs = new MutationObserver(update);
  obs.observe(root, { attributes: true, attributeFilter: ["data-props"] });
  window.addEventListener("beforeunload", () => obs.disconnect(), { once: true });
})();
</script>

<style>
.cmp[data-cmp-id="math.geometry.tangram.basic"] {
  width: var(--cmp-size, 200px);
  height: var(--cmp-size, 200px);
  display: inline-block;
}
.cmp[data-cmp-id="math.geometry.tangram.basic"] .tg__svg {
  width: 100%; height: 100%; display: block;
}
.cmp[data-cmp-id="math.geometry.tangram.basic"] .tg__p {
  transition: points 0.5s ease, opacity 0.3s;
}
.cmp[data-cmp-id="math.geometry.tangram.basic"] .tg__p:hover {
  opacity: 0.8;
}
</style>
