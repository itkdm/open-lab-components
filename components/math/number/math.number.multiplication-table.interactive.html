<!-- @cmp-manifest
{
  "schema": "cmp-manifest/v1",
  "id": "math.number.multiplication-table.interactive",
  "name": "乘法口诀表",
  "nameEn": "Multiplication Table",
  "category": "math/number",
  "version": "1.0.0",
  "viewport": { "w": 380, "h": 380 },
  "props": [
    { "key": "size", "type": "number(px)", "default": 380, "min": 240, "max": 600, "desc": "组件尺寸" },
    { "key": "maxNumber", "type": "number", "default": 9, "min": 2, "max": 12, "desc": "最大乘数" },
    { "key": "headerColor", "type": "color", "default": "#1565C0", "desc": "表头颜色" },
    { "key": "cellColor", "type": "color", "default": "#E3F2FD", "desc": "单元格颜色" },
    { "key": "highlightColor", "type": "color", "default": "#FF9800", "desc": "高亮颜色" }
  ],
  "cssVars": {
    "size": "--cmp-size",
    "headerColor": "--cmp-header",
    "cellColor": "--cmp-cell",
    "highlightColor": "--cmp-highlight"
  },
  "tags": ["multiplication", "times-table", "arithmetic", "math", "primary", "interactive"],
  "events": [
    { "name": "cmp:change", "type": "toggle", "values": { "a": "number", "b": "number", "product": "number" } }
  ]
}
-->
<div class="cmp" data-cmp-id="math.number.multiplication-table.interactive" role="img" aria-label="乘法口诀表">
  <style>
    .cmp[data-cmp-id="math.number.multiplication-table.interactive"]{
      --s:var(--cmp-size,380px);
      display:inline-block;width:var(--s);height:var(--s);
      user-select:none;touch-action:none;
    }
    .cmp[data-cmp-id="math.number.multiplication-table.interactive"] svg{
      width:100%;height:100%;display:block;
    }
    .cmp[data-cmp-id="math.number.multiplication-table.interactive"] .mt__cell{
      cursor:pointer;transition:opacity .15s ease;
    }
    .cmp[data-cmp-id="math.number.multiplication-table.interactive"] .mt__cell:hover{
      opacity:0.8;
    }
  </style>

  <svg viewBox="0 0 380 380" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <filter class="mt__shadow" x="-5%" y="-5%" width="110%" height="110%">
        <feDropShadow dx="0" dy="0.5" stdDeviation="0.8" flood-color="#000" flood-opacity="0.1"/>
      </filter>
    </defs>
    <!-- title -->
    <text class="mt__title" x="190" y="18" text-anchor="middle" font-size="14"
          font-weight="700" fill="var(--cmp-header,#1565C0)"
          font-family="'Microsoft YaHei','PingFang SC',sans-serif">九九乘法表</text>
    <!-- grid built by JS -->
    <g class="mt__grid"></g>
    <!-- selection display -->
    <text class="mt__result" x="190" y="375" text-anchor="middle" font-size="11"
          font-weight="600" fill="var(--cmp-header,#1565C0)"
          font-family="'Courier New',monospace" opacity="0"></text>
  </svg>

  <script>
  (function(){
    var sc=document.currentScript;if(!sc)return;
    var root=sc.parentElement;
    if(!root||root.getAttribute('data-cmp-id')!=='math.number.multiplication-table.interactive')return;

    var NS='http://www.w3.org/2000/svg';
    var svg=root.querySelector('svg');
    var gridG=root.querySelector('.mt__grid');
    var resultText=root.querySelector('.mt__result');
    var shadowFilter=svg.querySelector('.mt__shadow');
    var uid='mt-'+Math.random().toString(36).slice(2,8);
    if(shadowFilter)shadowFilter.setAttribute('id',uid+'-sh');

    var N=9,selected=null; // {r,c}

    function parseProps(){
      try{var r=root.getAttribute('data-props');return r?JSON.parse(r)||{}:{};}catch(e){return{};}
    }

    /* heat-map color: blend cellColor toward a deeper tone based on product */
    function heatColor(product,maxProduct){
      var t=product/maxProduct;
      // blend from light cellColor base to a medium blue
      var r0=227,g0=242,b0=253; // #E3F2FD
      var r1=100,g1=160,b1=220; // deeper blue
      var r=Math.round(r0+(r1-r0)*t);
      var g=Math.round(g0+(g1-g0)*t);
      var b=Math.round(b0+(b1-b0)*t);
      return 'rgb('+r+','+g+','+b+')';
    }

    function render(){
      var props=parseProps();
      N=Math.max(2,Math.min(12,Math.round(Number(props.maxNumber)||9)));
      gridG.innerHTML='';

      var GRID_TOP=28,GRID_LEFT=8;
      var cellW=(380-GRID_LEFT-4)/(N+1);
      var cellH=(380-GRID_TOP-20)/(N+1);
      var maxP=N*N;
      var filterId=uid+'-sh';

      /* header row: "x", 1..N */
      for(var c=0;c<=N;c++){
        var x=GRID_LEFT+c*cellW,y=GRID_TOP;
        var rect=document.createElementNS(NS,'rect');
        rect.setAttribute('x',x);rect.setAttribute('y',y);
        rect.setAttribute('width',cellW-1);rect.setAttribute('height',cellH-1);
        rect.setAttribute('rx','3');
        rect.setAttribute('fill',c===0?'var(--cmp-header,#1565C0)':'var(--cmp-header,#1565C0)');
        rect.setAttribute('opacity',c===0?'0.9':'0.85');
        gridG.appendChild(rect);

        var txt=document.createElementNS(NS,'text');
        txt.setAttribute('x',x+cellW/2-0.5);txt.setAttribute('y',y+cellH/2+3.5);
        txt.setAttribute('text-anchor','middle');txt.setAttribute('font-size',cellH*0.38>10?10:cellH*0.38);
        txt.setAttribute('fill','#fff');txt.setAttribute('font-weight','700');
        txt.setAttribute('font-family',"'Courier New',monospace");
        txt.setAttribute('pointer-events','none');
        txt.textContent=c===0?'\u00d7':String(c);
        gridG.appendChild(txt);
      }

      /* header column: 1..N */
      for(var r=1;r<=N;r++){
        var x=GRID_LEFT,y=GRID_TOP+r*cellH;
        var rect=document.createElementNS(NS,'rect');
        rect.setAttribute('x',x);rect.setAttribute('y',y);
        rect.setAttribute('width',cellW-1);rect.setAttribute('height',cellH-1);
        rect.setAttribute('rx','3');
        rect.setAttribute('fill','var(--cmp-header,#1565C0)');
        rect.setAttribute('opacity','0.85');
        gridG.appendChild(rect);

        var txt=document.createElementNS(NS,'text');
        txt.setAttribute('x',x+cellW/2-0.5);txt.setAttribute('y',y+cellH/2+3.5);
        txt.setAttribute('text-anchor','middle');txt.setAttribute('font-size',cellH*0.38>10?10:cellH*0.38);
        txt.setAttribute('fill','#fff');txt.setAttribute('font-weight','700');
        txt.setAttribute('font-family',"'Courier New',monospace");
        txt.setAttribute('pointer-events','none');
        txt.textContent=String(r);
        gridG.appendChild(txt);
      }

      /* data cells: triangular layout — row r shows columns 1..r */
      for(var r=1;r<=N;r++){
        for(var c=1;c<=r;c++){
          var product=r*c;
          var x=GRID_LEFT+c*cellW,y=GRID_TOP+r*cellH;
          var isSelected=selected&&selected.r===r&&selected.c===c;
          var isRowHL=selected&&selected.r===r;
          var isColHL=selected&&selected.c===c;

          var rect=document.createElementNS(NS,'rect');
          rect.setAttribute('x',x);rect.setAttribute('y',y);
          rect.setAttribute('width',cellW-1);rect.setAttribute('height',cellH-1);
          rect.setAttribute('rx','3');
          rect.setAttribute('class','mt__cell');
          rect.setAttribute('data-r',String(r));rect.setAttribute('data-c',String(c));
          rect.setAttribute('filter','url(#'+filterId+')');

          if(isSelected){
            rect.setAttribute('fill','var(--cmp-highlight,#FF9800)');
            rect.setAttribute('opacity','1');
          }else if(isRowHL||isColHL){
            rect.setAttribute('fill','var(--cmp-highlight,#FF9800)');
            rect.setAttribute('opacity','0.3');
          }else{
            rect.setAttribute('fill',heatColor(product,maxP));
          }
          gridG.appendChild(rect);

          var txt=document.createElementNS(NS,'text');
          txt.setAttribute('x',x+cellW/2-0.5);txt.setAttribute('y',y+cellH/2+3);
          txt.setAttribute('text-anchor','middle');
          txt.setAttribute('font-family',"'Courier New',monospace");
          txt.setAttribute('pointer-events','none');

          var eqStr=c+'\u00d7'+r+'='+product;
          var fontSize=Math.min(cellW*0.22,7.5);
          if(N<=5)fontSize=Math.min(cellW*0.25,10);
          txt.setAttribute('font-size',fontSize);
          txt.setAttribute('fill',isSelected?'#fff':'#37474f');
          txt.setAttribute('font-weight',isSelected?'700':'500');
          txt.textContent=eqStr;
          gridG.appendChild(txt);
        }
      }

      /* result display */
      if(selected){
        var p=selected.r*selected.c;
        resultText.textContent=selected.c+' \u00d7 '+selected.r+' = '+p;
        resultText.setAttribute('opacity','1');
      }else{
        resultText.setAttribute('opacity','0');
      }
    }

    /* click handler via delegation */
    gridG.addEventListener('click',function(e){
      var el=e.target;
      if(!el.classList.contains('mt__cell'))return;
      var r=parseInt(el.getAttribute('data-r'),10);
      var c=parseInt(el.getAttribute('data-c'),10);
      if(isNaN(r)||isNaN(c))return;

      if(selected&&selected.r===r&&selected.c===c){
        selected=null;
      }else{
        selected={r:r,c:c};
      }
      render();

      if(selected){
        root.dispatchEvent(new CustomEvent('cmp:change',{
          bubbles:true,composed:true,
          detail:{
            id:root.getAttribute('data-cmp-id'),
            type:'toggle',
            values:{a:selected.c,b:selected.r,product:selected.r*selected.c}
          }
        }));
      }
    });

    /* hover cross-highlight (visual only, no state change) */
    gridG.addEventListener('mouseover',function(e){
      if(selected)return; // locked selection takes priority
      var el=e.target;
      if(!el.classList.contains('mt__cell'))return;
      var hr=parseInt(el.getAttribute('data-r'),10);
      var hc=parseInt(el.getAttribute('data-c'),10);
      var cells=gridG.querySelectorAll('.mt__cell');
      for(var i=0;i<cells.length;i++){
        var cr=parseInt(cells[i].getAttribute('data-r'),10);
        var cc=parseInt(cells[i].getAttribute('data-c'),10);
        if(cr===hr&&cc===hc){
          cells[i].setAttribute('fill','var(--cmp-highlight,#FF9800)');
          cells[i].setAttribute('opacity','0.9');
        }else if(cr===hr||cc===hc){
          cells[i].setAttribute('fill','var(--cmp-highlight,#FF9800)');
          cells[i].setAttribute('opacity','0.25');
        }
      }
      var p=hr*hc;
      resultText.textContent=hc+' \u00d7 '+hr+' = '+p;
      resultText.setAttribute('opacity','1');
    });

    gridG.addEventListener('mouseout',function(e){
      if(selected)return;
      /* restore all cells */
      render();
    });

    /* keyboard support */
    root.setAttribute('tabindex','0');

    /* initial render */
    render();

    /* observe prop changes */
    var obs=new MutationObserver(function(muts){
      for(var i=0;i<muts.length;i++){
        if(muts[i].attributeName==='data-props'||muts[i].attributeName==='style'){
          selected=null;render();
        }
      }
    });
    obs.observe(root,{attributes:true,attributeFilter:['data-props','style']});
    window.addEventListener('beforeunload',function(){obs.disconnect();});
  })();
  </script>
</div>
