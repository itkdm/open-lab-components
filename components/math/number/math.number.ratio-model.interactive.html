<div class="cmp" data-cmp-id="math.number.ratio-model.interactive" role="img" aria-label="比例模型">
  <style>
    .cmp[data-cmp-id="math.number.ratio-model.interactive"]{
      --w:var(--cmp-size,340px);
      display:inline-block;width:var(--w);height:calc(var(--w)*260/340);
      user-select:none;touch-action:none;
    }
    .cmp[data-cmp-id="math.number.ratio-model.interactive"] svg{
      display:block;width:100%;height:100%;overflow:visible;
    }
    .cmp[data-cmp-id="math.number.ratio-model.interactive"] .rm__btn{
      cursor:pointer;transition:opacity .12s ease;
    }
    .cmp[data-cmp-id="math.number.ratio-model.interactive"] .rm__btn:hover{opacity:.82;}
    .cmp[data-cmp-id="math.number.ratio-model.interactive"] .rm__btn:active{opacity:.6;}
    .cmp[data-cmp-id="math.number.ratio-model.interactive"] .rm__bar-part{
      transition:width .3s ease,x .3s ease;
    }
    .cmp[data-cmp-id="math.number.ratio-model.interactive"] .rm__sector{
      transition:d .3s ease;
    }
  </style>
  <svg viewBox="0 0 340 260" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <filter class="rm__shadow" x="-5%" y="-5%" width="110%" height="120%">
        <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity=".10"/>
      </filter>
    </defs>
    <!-- title -->
    <g class="rm__title"></g>
    <!-- bar model -->
    <g class="rm__bar"></g>
    <!-- circle model -->
    <g class="rm__circle"></g>
    <!-- equivalent ratios -->
    <g class="rm__equiv"></g>
    <!-- numeric display -->
    <g class="rm__nums"></g>
    <!-- controls -->
    <g class="rm__ctrls"></g>
  </svg>
  <script>
  (function(){
    var sc=document.currentScript;if(!sc)return;
    var root=sc.parentElement;
    if(!root||root.getAttribute('data-cmp-id')!=='math.number.ratio-model.interactive')return;
    var NS='http://www.w3.org/2000/svg';
    var svg=root.querySelector('svg');
    var uid='rm-'+Math.random().toString(36).slice(2,8);
    var flt=svg.querySelector('.rm__shadow');
    if(flt)flt.setAttribute('id',uid+'-sh');
    var fUrl=flt?'url(#'+uid+'-sh)':'';
    var FT="'Nunito','Segoe UI',Arial,sans-serif";
    var BLUE='#42A5F5',ORANGE='#FF9800';

    var titleG=root.querySelector('.rm__title');
    var barG=root.querySelector('.rm__bar');
    var circleG=root.querySelector('.rm__circle');
    var equivG=root.querySelector('.rm__equiv');
    var numsG=root.querySelector('.rm__nums');
    var ctrlsG=root.querySelector('.rm__ctrls');

    function el(tag,a){var e=document.createElementNS(NS,tag);for(var k in a)e.setAttribute(k,a[k]);return e;}

    /* state */
    var a=3,b=5;

    function parseProps(){
      try{var r=root.getAttribute('data-props');return r?JSON.parse(r)||{}:{};}catch(e){return{};}
    }
    function gcd(x,y){x=Math.abs(x);y=Math.abs(y);while(y){var t=y;y=x%y;x=t;}return x;}
    function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,Math.round(v)));}

    function polarXY(cx,cy,r,deg){
      var rad=(deg-90)*Math.PI/180;
      return{x:cx+r*Math.cos(rad),y:cy+r*Math.sin(rad)};
    }
    function sectorPath(cx,cy,r,startDeg,endDeg){
      if(endDeg-startDeg>=360){
        return 'M'+cx+','+(cy-r)+' A'+r+','+r+' 0 1,1 '+(cx-0.01)+','+(cy-r)+' Z';
      }
      var s=polarXY(cx,cy,r,startDeg),e=polarXY(cx,cy,r,endDeg);
      var large=(endDeg-startDeg)>180?1:0;
      return 'M'+cx+','+cy+' L'+s.x+','+s.y+' A'+r+','+r+' 0 '+large+',1 '+e.x+','+e.y+' Z';
    }

    function render(){
      var total=a+b;
      var g=gcd(a,b),sa=a/g,sb=b/g;
      var pctA=((a/total)*100),pctB=((b/total)*100);

      /* ── Title ── */
      titleG.innerHTML='';
      var tt=el('text',{x:'170',y:'16','text-anchor':'middle','font-size':'13','font-weight':'700',fill:'#37474f','font-family':FT});
      tt.textContent='比例模型   '+a+' : '+b;
      titleG.appendChild(tt);

      /* ── Bar model ── */
      barG.innerHTML='';
      var BX=30,BY=30,BW=280,BH=28,partW=BW/total;
      /* background */
      barG.appendChild(el('rect',{x:BX,y:BY,width:BW,height:BH,rx:'4',fill:'#eee',stroke:'#ccc','stroke-width':'0.6'}));
      /* A parts */
      for(var i=0;i<a;i++){
        var r1=el('rect',{'class':'rm__bar-part',x:BX+i*partW,y:BY,width:partW,height:BH,
          fill:BLUE,stroke:'#fff','stroke-width':'1',rx:i===0?'4':'0',ry:i===0?'4':'0'});
        barG.appendChild(r1);
      }
      /* B parts */
      for(var j=0;j<b;j++){
        var idx=a+j;
        var r2=el('rect',{'class':'rm__bar-part',x:BX+idx*partW,y:BY,width:partW,height:BH,
          fill:ORANGE,stroke:'#fff','stroke-width':'1',rx:j===b-1?'4':'0',ry:j===b-1?'4':'0'});
        barG.appendChild(r2);
      }
      /* labels on bar */
      var aMid=BX+a*partW/2, bMid=BX+a*partW+b*partW/2;
      var lt1=el('text',{x:aMid,y:BY+BH/2+4.5,'text-anchor':'middle','font-size':'11','font-weight':'700',fill:'#fff','font-family':FT});
      lt1.textContent='A';barG.appendChild(lt1);
      var lt2=el('text',{x:bMid,y:BY+BH/2+4.5,'text-anchor':'middle','font-size':'11','font-weight':'700',fill:'#fff','font-family':FT});
      lt2.textContent='B';barG.appendChild(lt2);
      /* bracket labels below bar */
      var brkY=BY+BH+12;
      var t1=el('text',{x:aMid,y:brkY,'text-anchor':'middle','font-size':'9',fill:BLUE,'font-weight':'600','font-family':FT});
      t1.textContent='A = '+a+'份';barG.appendChild(t1);
      var t2=el('text',{x:bMid,y:brkY,'text-anchor':'middle','font-size':'9',fill:ORANGE,'font-weight':'600','font-family':FT});
      t2.textContent='B = '+b+'份';barG.appendChild(t2);
      var t3=el('text',{x:BX+BW/2,y:brkY+13,'text-anchor':'middle','font-size':'9',fill:'#666','font-family':FT});
      t3.textContent='总共 '+total+'份';barG.appendChild(t3);

      /* ── Circle model ── */
      circleG.innerHTML='';
      var CX=80,CY=135,CR=36;
      /* shadow bg */
      var cBg=el('circle',{cx:CX,cy:CY,r:CR,fill:'#f5f5f5',stroke:'#ccc','stroke-width':'0.6'});
      if(fUrl)cBg.setAttribute('filter',fUrl);
      circleG.appendChild(cBg);
      /* A sectors */
      var degPerPart=360/total;
      var pathA=el('path',{'class':'rm__sector',d:sectorPath(CX,CY,CR,0,a*degPerPart),fill:BLUE,stroke:'#fff','stroke-width':'1'});
      circleG.appendChild(pathA);
      /* B sectors */
      var pathB=el('path',{'class':'rm__sector',d:sectorPath(CX,CY,CR,a*degPerPart,360),fill:ORANGE,stroke:'#fff','stroke-width':'1'});
      circleG.appendChild(pathB);
      /* divider lines */
      for(var d=0;d<total;d++){
        var pt=polarXY(CX,CY,CR,d*degPerPart);
        circleG.appendChild(el('line',{x1:CX,y1:CY,x2:pt.x,y2:pt.y,stroke:'#fff','stroke-width':'1'}));
      }
      /* outer ring */
      circleG.appendChild(el('circle',{cx:CX,cy:CY,r:CR,fill:'none',stroke:'#999','stroke-width':'0.8'}));
      /* percentage labels */
      var pl1=el('text',{x:CX,y:CY+CR+14,'text-anchor':'middle','font-size':'8.5',fill:BLUE,'font-weight':'600','font-family':FT});
      pl1.textContent='A: '+pctA.toFixed(1)+'%';circleG.appendChild(pl1);
      var pl2=el('text',{x:CX,y:CY+CR+24,'text-anchor':'middle','font-size':'8.5',fill:ORANGE,'font-weight':'600','font-family':FT});
      pl2.textContent='B: '+pctB.toFixed(1)+'%';circleG.appendChild(pl2);

      /* ── Equivalent ratios ── */
      equivG.innerHTML='';
      var EX=160,EY=100;
      var eqTitle=el('text',{x:EX,y:EY,'font-size':'11','font-weight':'700',fill:'#37474f','font-family':FT});
      eqTitle.textContent='等价比';equivG.appendChild(eqTitle);
      var eqStrs=[];
      for(var m=1;m<=4;m++){
        eqStrs.push((sa*m)+' : '+(sb*m));
      }
      for(var n=0;n<eqStrs.length;n++){
        var isBase=(sa*(n+1)===a&&sb*(n+1)===b);
        var eqt=el('text',{x:EX,y:EY+16+n*15,'font-size':'10',fill:isBase?'#2E7D32':'#555',
          'font-weight':isBase?'700':'400','font-family':FT});
        eqt.textContent=eqStrs[n];
        equivG.appendChild(eqt);
      }
      /* simplified hint */
      if(g>1){
        var simT=el('text',{x:EX,y:EY+16+eqStrs.length*15+4,'font-size':'9',fill:'#2E7D32','font-weight':'600','font-family':FT});
        simT.textContent='最简比: '+sa+':'+sb;equivG.appendChild(simT);
      }

      /* ── Numeric display ── */
      numsG.innerHTML='';
      var NY=190;
      var lines=[
        'A : B = '+a+' : '+b,
        'A/B = '+a+'/'+b+' = '+(a/b).toFixed(a%b===0?0:2),
        'A占总数 '+a+'/'+total+' = '+pctA.toFixed(1)+'%',
        'B占总数 '+b+'/'+total+' = '+pctB.toFixed(1)+'%'
      ];
      for(var li=0;li<lines.length;li++){
        var nt=el('text',{x:'30',y:NY+li*12,'font-size':'9',fill:'#555','font-family':FT});
        nt.textContent=lines[li];numsG.appendChild(nt);
      }

      /* ── Controls ── */
      ctrlsG.innerHTML='';
      var CY2=242;
      /* A controls */
      var aLbl=el('text',{x:'50',y:CY2+4,'text-anchor':'middle','font-size':'11','font-weight':'700',fill:BLUE,'font-family':FT});
      aLbl.textContent='A: '+a;ctrlsG.appendChild(aLbl);
      makeBtn(ctrlsG,78,CY2,true,'a');
      makeBtn(ctrlsG,24,CY2,false,'a');
      /* B controls */
      var bLbl=el('text',{x:'170',y:CY2+4,'text-anchor':'middle','font-size':'11','font-weight':'700',fill:ORANGE,'font-family':FT});
      bLbl.textContent='B: '+b;ctrlsG.appendChild(bLbl);
      makeBtn(ctrlsG,198,CY2,true,'b');
      makeBtn(ctrlsG,144,CY2,false,'b');
      /* simplified pill */
      if(g>1){
        var pillTxt='\u6700\u7B80\u6BD4: '+sa+':'+sb;
        var pw=pillTxt.length*7+12;
        ctrlsG.appendChild(el('rect',{x:240,y:CY2-10,width:pw,height:20,rx:'10',fill:'#E8F5E9',stroke:'#66BB6A','stroke-width':'1'}));
        var pt=el('text',{x:240+pw/2,y:CY2+4,'text-anchor':'middle','font-size':'10','font-weight':'600',fill:'#2E7D32','font-family':FT});
        pt.textContent=pillTxt;ctrlsG.appendChild(pt);
      }

      root.setAttribute('aria-label','比例模型: '+a+':'+b);
    }

    function makeBtn(parent,x,y,isPlus,which){
      var g2=el('g',{'class':'rm__btn','data-which':which,'data-act':isPlus?'plus':'minus'});
      g2.appendChild(el('circle',{cx:x,cy:y,r:'9',fill:isPlus?'#66bb6a':'#ef5350',
        stroke:isPlus?'#2e7d32':'#c62828','stroke-width':'1'}));
      g2.appendChild(el('line',{x1:x-4,y1:y,x2:x+4,y2:y,stroke:'#fff','stroke-width':'2','stroke-linecap':'round'}));
      if(isPlus)g2.appendChild(el('line',{x1:x,y1:y-4,x2:x,y2:y+4,stroke:'#fff','stroke-width':'2','stroke-linecap':'round'}));
      parent.appendChild(g2);
    }

    function adjust(which,delta){
      if(which==='a')a=clamp(a+delta,1,10);
      else b=clamp(b+delta,1,10);
      render();
      emitChange();
    }

    function emitChange(){
      var g2=gcd(a,b);
      root.dispatchEvent(new CustomEvent('cmp:change',{
        bubbles:true,composed:true,
        detail:{id:root.getAttribute('data-cmp-id'),type:'adjust',
          values:{a:a,b:b,simplified:(a/g2)+':'+(b/g2)}}
      }));
    }

    svg.addEventListener('click',function(e){
      var btn=e.target.closest('.rm__btn');
      if(!btn)return;
      adjust(btn.getAttribute('data-which'),btn.getAttribute('data-act')==='plus'?1:-1);
    });

    root.setAttribute('tabindex','0');
    root.addEventListener('keydown',function(e){
      var k=e.key;
      if(k==='ArrowRight'){e.preventDefault();adjust('a',1);}
      else if(k==='ArrowLeft'){e.preventDefault();adjust('a',-1);}
      else if(k==='ArrowUp'){e.preventDefault();adjust('b',1);}
      else if(k==='ArrowDown'){e.preventDefault();adjust('b',-1);}
    });

    /* init from props */
    var p=parseProps();
    a=clamp(Number(p.a)||3,1,10);
    b=clamp(Number(p.b)||5,1,10);
    render();

    new MutationObserver(function(m){
      for(var i=0;i<m.length;i++){
        if(m[i].attributeName==='data-props'){
          var np=parseProps();
          a=clamp(Number(np.a)||a,1,10);
          b=clamp(Number(np.b)||b,1,10);
          render();
        }
      }
    }).observe(root,{attributes:true,attributeFilter:['data-props','style']});
  })();
  </script>
</div>
