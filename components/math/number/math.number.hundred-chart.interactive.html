<div class="cmp" data-cmp-id="math.number.hundred-chart.interactive" role="img" aria-label="百数表">
  <style>
    .cmp[data-cmp-id="math.number.hundred-chart.interactive"]{
      --s:var(--cmp-size,320px);
      display:inline-block;width:var(--s);height:calc(var(--s)*360/320);
      user-select:none;touch-action:none;
    }
    .cmp[data-cmp-id="math.number.hundred-chart.interactive"] svg{
      width:100%;height:100%;display:block;
    }
    .cmp[data-cmp-id="math.number.hundred-chart.interactive"] .hc__cell{
      cursor:pointer;transition:opacity .12s ease;
    }
    .cmp[data-cmp-id="math.number.hundred-chart.interactive"] .hc__cell:hover{
      opacity:0.75;
    }
    .cmp[data-cmp-id="math.number.hundred-chart.interactive"] .hc__btn{
      cursor:pointer;transition:opacity .12s ease;
    }
    .cmp[data-cmp-id="math.number.hundred-chart.interactive"] .hc__btn:hover{
      opacity:0.7;
    }
  </style>

  <svg viewBox="0 0 320 360" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <text x="160" y="18" text-anchor="middle" font-size="14" font-weight="700"
          fill="#1565C0" font-family="'Microsoft YaHei','PingFang SC',sans-serif">百数表</text>
    <g class="hc__grid"></g>
    <g class="hc__controls">
      <g class="hc__btn" data-action="even">
        <rect x="30" y="334" width="56" height="18" rx="4" fill="#E3F2FD" stroke="#90CAF9" stroke-width="0.5"/>
        <text x="58" y="346.5" text-anchor="middle" font-size="10" fill="#1565C0"
              font-family="'Microsoft YaHei','PingFang SC',sans-serif" pointer-events="none">偶数</text>
      </g>
      <g class="hc__btn" data-action="odd">
        <rect x="96" y="334" width="56" height="18" rx="4" fill="#E3F2FD" stroke="#90CAF9" stroke-width="0.5"/>
        <text x="124" y="346.5" text-anchor="middle" font-size="10" fill="#1565C0"
              font-family="'Microsoft YaHei','PingFang SC',sans-serif" pointer-events="none">奇数</text>
      </g>
      <g class="hc__btn" data-action="clear">
        <rect x="162" y="334" width="56" height="18" rx="4" fill="#FFF3E0" stroke="#FFCC80" stroke-width="0.5"/>
        <text x="190" y="346.5" text-anchor="middle" font-size="10" fill="#E65100"
              font-family="'Microsoft YaHei','PingFang SC',sans-serif" pointer-events="none">清除</text>
      </g>
    </g>
    <text class="hc__hint" x="280" y="346.5" text-anchor="middle" font-size="9" fill="#666"
          font-family="'Microsoft YaHei','PingFang SC',sans-serif" opacity="0"></text>
  </svg>

  <script>
  (function(){
    var sc=document.currentScript;if(!sc)return;
    var root=sc.parentElement;
    if(!root||root.getAttribute('data-cmp-id')!=='math.number.hundred-chart.interactive')return;

    var NS='http://www.w3.org/2000/svg';
    var gridG=root.querySelector('.hc__grid');
    var hintText=root.querySelector('.hc__hint');
    var controlsG=root.querySelector('.hc__controls');
    var highlighted={}; // {number: true}

    var GX=10,GY=28,CW=30,CH=30;

    function render(){
      gridG.innerHTML='';
      for(var r=0;r<10;r++){
        for(var c=0;c<10;c++){
          var n=r*10+c+1;
          var x=GX+c*CW, y=GY+r*CH;
          var isHL=!!highlighted[n];
          var isEvenRow=r%2===0;

          var rect=document.createElementNS(NS,'rect');
          rect.setAttribute('x',x);rect.setAttribute('y',y);
          rect.setAttribute('width',CW);rect.setAttribute('height',CH);
          rect.setAttribute('class','hc__cell');
          rect.setAttribute('data-n',String(n));
          if(isHL){
            rect.setAttribute('fill','var(--cmp-highlight,#FF9800)');
          }else{
            rect.setAttribute('fill',isEvenRow?'var(--cmp-cell,#E3F2FD)':'#EDF5FD');
          }
          rect.setAttribute('stroke','#B0BEC5');
          rect.setAttribute('stroke-width','0.5');
          gridG.appendChild(rect);

          var txt=document.createElementNS(NS,'text');
          txt.setAttribute('x',x+CW/2);txt.setAttribute('y',y+CH/2+4);
          txt.setAttribute('text-anchor','middle');
          txt.setAttribute('font-size','11');
          txt.setAttribute('font-family',"'Courier New',monospace");
          txt.setAttribute('pointer-events','none');
          txt.setAttribute('fill',isHL?'#fff':'#37474F');
          txt.setAttribute('font-weight',isHL?'700':'500');
          txt.textContent=String(n);
          gridG.appendChild(txt);
        }
      }
      updateHint();
    }

    function getHighlightedArray(){
      var arr=[];
      for(var k in highlighted){if(highlighted[k])arr.push(Number(k));}
      arr.sort(function(a,b){return a-b;});
      return arr;
    }

    function updateHint(){
      var arr=getHighlightedArray();
      var count=arr.length;
      if(count===0){hintText.setAttribute('opacity','0');return;}
      hintText.setAttribute('opacity','1');
      var pattern=detectPattern(arr);
      hintText.textContent=count+'个'+(pattern?' · '+pattern:'');
    }

    function detectPattern(arr){
      if(arr.length<2)return '';
      // check multiples of N (2-10)
      for(var n=2;n<=10;n++){
        var allMult=true;
        for(var i=0;i<arr.length;i++){if(arr[i]%n!==0){allMult=false;break;}}
        if(allMult){
          // check if ALL multiples of n in 1-100 are selected
          var total=Math.floor(100/n);
          if(arr.length===total)return n+'的倍数';
        }
      }
      // check consecutive
      var consec=true;
      for(var i=1;i<arr.length;i++){if(arr[i]!==arr[i-1]+1){consec=false;break;}}
      if(consec&&arr.length>=2)return '连续数';
      // check same column (same ones digit)
      var d=arr[0]%10;
      var sameCol=true;
      for(var i=1;i<arr.length;i++){if(arr[i]%10!==d){sameCol=false;break;}}
      if(sameCol&&arr.length>=2)return '个位是'+((d===0)?'0':d)+'的数';
      // check same row
      var row0=Math.ceil(arr[0]/10);
      var sameRow=true;
      for(var i=1;i<arr.length;i++){if(Math.ceil(arr[i]/10)!==row0){sameRow=false;break;}}
      if(sameRow&&arr.length>=2){
        var tens=(row0-1)*10;
        return tens===0?'一到十':tens+'到'+(tens+10>100?100:tens+10);
      }
      return '';
    }

    function emitChange(lastN){
      root.dispatchEvent(new CustomEvent('cmp:change',{
        bubbles:true,composed:true,
        detail:{
          id:root.getAttribute('data-cmp-id'),
          type:'toggle',
          values:{number:lastN,highlighted:getHighlightedArray()}
        }
      }));
    }

    gridG.addEventListener('click',function(e){
      var el=e.target;
      if(!el.classList.contains('hc__cell'))return;
      var n=parseInt(el.getAttribute('data-n'),10);
      if(isNaN(n))return;
      if(highlighted[n])delete highlighted[n];
      else highlighted[n]=true;
      render();
      emitChange(n);
    });

    controlsG.addEventListener('click',function(e){
      var btn=e.target.closest('.hc__btn');
      if(!btn)return;
      var action=btn.getAttribute('data-action');
      if(action==='even'){
        highlighted={};
        for(var i=2;i<=100;i+=2)highlighted[i]=true;
      }else if(action==='odd'){
        highlighted={};
        for(var i=1;i<=100;i+=2)highlighted[i]=true;
      }else if(action==='clear'){
        highlighted={};
      }
      render();
      emitChange(0);
    });

    root.setAttribute('tabindex','0');
    render();

    var obs=new MutationObserver(function(muts){
      for(var i=0;i<muts.length;i++){
        if(muts[i].attributeName==='data-props'||muts[i].attributeName==='style'){
          highlighted={};render();
        }
      }
    });
    obs.observe(root,{attributes:true,attributeFilter:['data-props','style']});
    window.addEventListener('beforeunload',function(){obs.disconnect();});
  })();
  </script>
</div>
