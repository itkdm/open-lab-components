<script>
(function() {
  var root = document.currentScript && document.currentScript.previousElementSibling;
  if (!root || root.getAttribute('data-cmp-id') !== 'sci.life.leaf-structure.basic') return;
  var svg = root.querySelector('svg');
  if (!svg) return;

  var uid = 'lf_' + Math.random().toString(36).slice(2, 8);

  /* 为渐变分配唯一 id */
  var grad = svg.querySelector('.lf__leaf-grad');
  if (grad) grad.setAttribute('id', uid + '_lg');

  /* 绑定 fill 引用 */
  var blade = svg.querySelector('.lf__blade');
  if (blade) blade.setAttribute('fill', 'url(#' + uid + '_lg)');

  /* 标注显隐 */
  var labels = root.querySelectorAll('.lf__labels');

  function update() {
    var props = {};
    try { var r = root.getAttribute('data-props'); if (r) props = JSON.parse(r) || {}; } catch (e) {}
    var show = !(props.showLabels === false || props.showLabels === 'false');
    for (var i = 0; i < labels.length; i++) {
      labels[i].style.display = show ? '' : 'none';
    }
  }
  update();
  var obs = new MutationObserver(update);
  obs.observe(root, { attributes: true, attributeFilter: ['data-props'] });
  window.addEventListener('beforeunload', function() { obs.disconnect(); }, { once: true });
})();
</script>
