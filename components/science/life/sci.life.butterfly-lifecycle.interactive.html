  <style>
    .cmp[data-cmp-id="sci.life.butterfly-lifecycle.interactive"] {
      width: var(--cmp-size, 300px); display: inline-block;
    }
    .cmp[data-cmp-id="sci.life.butterfly-lifecycle.interactive"] .bl__svg {
      width: 100%; height: auto; display: block;
    }
    .cmp[data-cmp-id="sci.life.butterfly-lifecycle.interactive"] .bl__stage:hover .bl__ring {
      stroke: rgba(255,152,0,0.25); stroke-width: 3;
    }
    .cmp[data-cmp-id="sci.life.butterfly-lifecycle.interactive"] .bl__ring {
      transition: stroke 0.3s, stroke-width 0.3s;
    }
    .cmp[data-cmp-id="sci.life.butterfly-lifecycle.interactive"] .bl__arc {
      transition: stroke 0.4s, stroke-width 0.4s;
    }
    @keyframes bl-pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .cmp[data-cmp-id="sci.life.butterfly-lifecycle.interactive"] .bl__arc--active {
      animation: bl-pulse 1.8s ease-in-out infinite;
    }
  </style>

  <script>
  (function(){
    var root = document.currentScript && document.currentScript.closest
      ? document.currentScript.closest('[data-cmp-id="sci.life.butterfly-lifecycle.interactive"]')
      : null;
    if(!root) return;

    var svg = root.querySelector('.bl__svg');
    if(!svg) return;

    var uid = 'bl' + Math.random().toString(36).slice(2,8);
    // Assign unique IDs to defs elements
    svg.querySelectorAll('defs > [class^="bl__"]').forEach(function(el){
      var cls = el.getAttribute('class');
      var newId = uid + '_' + cls;
      el.setAttribute('id', newId);
    });
    // Fix marker-end references on arcs
    svg.querySelectorAll('.bl__arc').forEach(function(el){
      el.setAttribute('marker-end', 'url(#' + uid + '_bl__arrow)');
    });

    var STAGES = ['卵','幼虫','蛹','成虫'];
    var stageEls = svg.querySelectorAll('.bl__stage');
    var arcEls = svg.querySelectorAll('.bl__arc');

    var props = {};
    try { props = JSON.parse(root.getAttribute('data-props')||'{}'); } catch(e){}
    var current = Math.max(1, Math.min(4, props.stage || 1));

    function setActive(stage){
      current = stage;
      stageEls.forEach(function(g){
        var s = parseInt(g.getAttribute('data-stage'));
        var ring = g.querySelector('.bl__ring');
        if(s === stage){
          ring.setAttribute('stroke', '#FF9800');
          ring.setAttribute('stroke-width', '3');
          ring.style.filter = 'url(#' + uid + '_bl__glow)';
        } else {
          ring.setAttribute('stroke', 'transparent');
          ring.setAttribute('stroke-width', '3');
          ring.style.filter = '';
        }
      });
      arcEls.forEach(function(arc){
        var a = parseInt(arc.getAttribute('data-arc'));
        if(a === stage){
          arc.setAttribute('stroke', '#FF9800');
          arc.setAttribute('stroke-width', '2.5');
          arc.setAttribute('marker-end', 'url(#' + uid + '_bl__arrow-active)');
          arc.classList.add('bl__arc--active');
        } else {
          arc.setAttribute('stroke', '#BDBDBD');
          arc.setAttribute('stroke-width', '1.8');
          arc.setAttribute('marker-end', 'url(#' + uid + '_bl__arrow)');
          arc.classList.remove('bl__arc--active');
        }
      });
    }

    function emitChange(stage){
      root.dispatchEvent(new CustomEvent('cmp:change', {
        bubbles: true, composed: true,
        detail: { id: root.getAttribute('data-cmp-id'), type: 'toggle',
          values: { stage: stage, stageName: STAGES[stage - 1] }
        }
      }));
    }

    stageEls.forEach(function(g){
      g.addEventListener('click', function(e){
        e.stopPropagation();
        var s = parseInt(g.getAttribute('data-stage'));
        setActive(s);
        emitChange(s);
      });
    });

    setActive(current);

    new MutationObserver(function(){
      try {
        var p = JSON.parse(root.getAttribute('data-props')||'{}');
        if(p.stage !== undefined){
          var s = Math.max(1, Math.min(4, p.stage));
          if(s !== current){ setActive(s); }
        }
      } catch(e){}
    }).observe(root, { attributes: true, attributeFilter: ['data-props','style'] });
  })();
  </script>
</div>
