<div class="cmp" data-cmp-id="sci.life.food-chain.interactive" role="img" aria-label="食物链">

      <circle cx="358" cy="118" r="1.3" fill="#FDD835"/>
      <ellipse cx="358" cy="118" rx="0.5" ry="1.2" fill="#1B5E20"/>

  <style>
    .cmp[data-cmp-id="sci.life.food-chain.interactive"]{width:var(--cmp-size,400px);display:inline-block;user-select:none}
    .cmp[data-cmp-id="sci.life.food-chain.interactive"] .fc__svg{width:100%;height:auto;display:block}
    .cmp[data-cmp-id="sci.life.food-chain.interactive"] .fc__org{transition:opacity .3s}
    .cmp[data-cmp-id="sci.life.food-chain.interactive"] .fc__org:hover{filter:brightness(1.08)}
    .cmp[data-cmp-id="sci.life.food-chain.interactive"] .fc__arrow{transition:stroke .3s,stroke-width .3s,opacity .3s}
    .cmp[data-cmp-id="sci.life.food-chain.interactive"] .fc__arrow-label{transition:opacity .3s}
    .cmp[data-cmp-id="sci.life.food-chain.interactive"] .fc__org--dim{opacity:.25}
    .cmp[data-cmp-id="sci.life.food-chain.interactive"] .fc__arrow--dim{opacity:.15}
    .cmp[data-cmp-id="sci.life.food-chain.interactive"] .fc__label--dim{opacity:.15}
    @keyframes fc-arrow-pulse{0%,100%{stroke-opacity:.7}50%{stroke-opacity:1}}
    .cmp[data-cmp-id="sci.life.food-chain.interactive"] .fc__arrow--glow{animation:fc-arrow-pulse 1.5s ease-in-out infinite}
  </style>

  <script>
  (function(){
    var root=document.currentScript&&document.currentScript.closest
      ?document.currentScript.closest('[data-cmp-id="sci.life.food-chain.interactive"]'):null;
    if(!root)return;
    var svg=root.querySelector('.fc__svg');
    if(!svg)return;

    var uid='fc'+Math.random().toString(36).slice(2,8);
    svg.querySelectorAll('defs > [class^="fc__"]').forEach(function(el){
      el.setAttribute('id',uid+'_'+el.getAttribute('class'));
    });
    svg.querySelectorAll('[fill^="url(#fc__"]').forEach(function(el){
      el.setAttribute('fill',el.getAttribute('fill').replace('url(#fc__','url(#'+uid+'_fc__'));
    });
    svg.querySelectorAll('[marker-end^="url(#fc__"]').forEach(function(el){
      el.setAttribute('marker-end',el.getAttribute('marker-end').replace('url(#fc__','url(#'+uid+'_fc__'));
    });

    var orgs=svg.querySelectorAll('.fc__org');
    var arrows=svg.querySelectorAll('.fc__arrow');
    var aLabels=svg.querySelectorAll('.fc__arrow-label');
    var tooltip=svg.querySelector('.fc__tooltip');
    var tipBg=svg.querySelector('.fc__tip-bg');
    var tipText=svg.querySelector('.fc__tip-text');
    var selected=null;

    var NAMES={sun:'太阳',grass:'草',grasshopper:'蚱蜢',frog:'青蛙',snake:'蛇'};
    var ROLES={sun:'能量来源',grass:'生产者',grasshopper:'初级消费者',frog:'次级消费者',snake:'三级消费者'};

    function clearAll(){
      orgs.forEach(function(g){g.classList.remove('fc__org--dim');g.style.filter=''});
      arrows.forEach(function(a){
        a.classList.remove('fc__arrow--dim','fc__arrow--glow');
        a.setAttribute('stroke','#E67E22');a.setAttribute('stroke-width','1.8');
        a.setAttribute('marker-end','url(#'+uid+'_fc__arrowhead)');a.style.filter='';
      });
      aLabels.forEach(function(l){l.classList.remove('fc__label--dim')});
      tooltip.setAttribute('opacity','0');
    }

    function highlight(orgKey){
      orgs.forEach(function(g){g.classList.add('fc__org--dim');g.style.filter=''});
      arrows.forEach(function(a){a.classList.add('fc__arrow--dim');a.classList.remove('fc__arrow--glow');a.style.filter=''});
      aLabels.forEach(function(l){l.classList.add('fc__label--dim')});
      var sel=svg.querySelector('.fc__org[data-org="'+orgKey+'"]');
      if(sel){sel.classList.remove('fc__org--dim');sel.style.filter='url(#'+uid+'_fc__glow)';}
      arrows.forEach(function(a,i){
        var from=a.getAttribute('data-from'),to=a.getAttribute('data-to');
        if(from===orgKey||to===orgKey){
          a.classList.remove('fc__arrow--dim');a.classList.add('fc__arrow--glow');
          a.setAttribute('stroke','#F39C12');a.setAttribute('stroke-width','2.5');
          a.setAttribute('marker-end','url(#'+uid+'_fc__arrowhead-glow)');
          a.style.filter='url(#'+uid+'_fc__glow)';
          var nb=(from===orgKey)?to:from;
          var nG=svg.querySelector('.fc__org[data-org="'+nb+'"]');
          if(nG)nG.classList.remove('fc__org--dim');
          if(aLabels[i])aLabels[i].classList.remove('fc__label--dim');
        }
      });
      var tipStr=NAMES[orgKey]+' — '+ROLES[orgKey];
      tipText.textContent=tipStr;
      var tw=tipStr.length*8+16;
      tipBg.setAttribute('width',tw);tipText.setAttribute('x',tw/2);
      var hit=svg.querySelector('.fc__org[data-org="'+orgKey+'"] .fc__hit');
      if(hit){
        var cx=parseFloat(hit.getAttribute('cx'));
        tooltip.setAttribute('transform','translate('+(Math.max(tw/2,Math.min(400-tw/2,cx))-tw/2)+',172)');
      }
      tooltip.setAttribute('opacity','1');
    }

    function emit(sel,role){
      root.dispatchEvent(new CustomEvent('cmp:change',{bubbles:true,composed:true,
        detail:{id:root.getAttribute('data-cmp-id'),type:'toggle',values:{selected:sel,role:role}}}));
    }

    orgs.forEach(function(g){
      g.addEventListener('click',function(e){
        e.stopPropagation();
        var k=g.getAttribute('data-org');
        if(selected===k){selected=null;clearAll();emit('','');}
        else{selected=k;highlight(k);emit(k,ROLES[k]||'');}
      });
    });

    svg.addEventListener('click',function(e){
      if(!e.target.closest('.fc__org')&&selected){selected=null;clearAll();emit('','');}
    });

    new MutationObserver(function(){
      try{JSON.parse(root.getAttribute('data-props')||'{}');}catch(e){}
    }).observe(root,{attributes:true,attributeFilter:['data-props','style']});
  })();
  </script>
</div>
