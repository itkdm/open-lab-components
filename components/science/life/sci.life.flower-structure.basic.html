<script>
(function() {
  var root = document.currentScript && document.currentScript.previousElementSibling;
  if (!root || root.getAttribute('data-cmp-id') !== 'sci.life.flower-structure.basic') return;
  var svg = root.querySelector('svg');
  if (!svg) return;

  var uid = 'fl_' + Math.random().toString(36).slice(2, 8);

  /* 为渐变分配唯一 id */
  var gradMap = {
    '.fl__petal-grad':  uid + '_pg',
    '.fl__ovary-grad':  uid + '_og',
    '.fl__anther-grad': uid + '_ag'
  };
  for (var sel in gradMap) {
    var el = svg.querySelector(sel);
    if (el) el.setAttribute('id', gradMap[sel]);
  }

  /* 绑定 fill 引用 */
  var petals = svg.querySelectorAll('.fl__petal');
  for (var i = 0; i < petals.length; i++) {
    petals[i].setAttribute('fill', 'url(#' + gradMap['.fl__petal-grad'] + ')');
  }
  var ovary = svg.querySelector('.fl__ovary');
  if (ovary) ovary.setAttribute('fill', 'url(#' + gradMap['.fl__ovary-grad'] + ')');
  var anthers = svg.querySelectorAll('.fl__anther');
  for (var j = 0; j < anthers.length; j++) {
    anthers[j].setAttribute('fill', 'url(#' + gradMap['.fl__anther-grad'] + ')');
  }

  /* 标注显隐 */
  var labels = root.querySelector('.fl__labels');

  function update() {
    var props = {};
    try { var r = root.getAttribute('data-props'); if (r) props = JSON.parse(r) || {}; } catch (e) {}
    if (labels) labels.style.display = (props.showLabels === false || props.showLabels === 'false') ? 'none' : '';
  }
  update();
  var obs = new MutationObserver(update);
  obs.observe(root, { attributes: true, attributeFilter: ['data-props'] });
  window.addEventListener('beforeunload', function() { obs.disconnect(); }, { once: true });
})();
</script>

}
</style>
