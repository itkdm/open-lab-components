  <style>
    .cmp[data-cmp-id="sci.life.human-body.interactive"] {
      width: var(--cmp-size, 240px); display: inline-block;
    }
    .cmp[data-cmp-id="sci.life.human-body.interactive"] .hb__svg {
      width: 100%; height: auto; display: block;
    }
    .cmp[data-cmp-id="sci.life.human-body.interactive"] .hb__btn rect {
      transition: fill 0.25s, stroke 0.25s;
    }
    .cmp[data-cmp-id="sci.life.human-body.interactive"] .hb__btn:hover rect {
      filter: brightness(0.95);
    }
    .cmp[data-cmp-id="sci.life.human-body.interactive"] .hb__sys {
      transition: opacity 0.35s;
    }
  </style>

  <script>
  (function(){
    var root = document.currentScript && document.currentScript.closest
      ? document.currentScript.closest('[data-cmp-id="sci.life.human-body.interactive"]')
      : null;
    if(!root) return;

    var svg = root.querySelector('.hb__svg');
    if(!svg) return;

    var uid = 'hb' + Math.random().toString(36).slice(2,8);
    svg.querySelectorAll('defs > [class^="hb__"]').forEach(function(el){
      var cls = el.getAttribute('class');
      el.setAttribute('id', uid + '_' + cls);
    });

    var SYSTEMS = {
      skeleton:    { name: '骨骼', color: '#795548' },
      digestive:   { name: '消化', color: '#E65100' },
      respiratory: { name: '呼吸', color: '#1976D2' },
      circulatory: { name: '循环', color: '#C62828' }
    };
    var KEYS = ['skeleton','digestive','respiratory','circulatory'];

    var sysGroups = {};
    svg.querySelectorAll('.hb__sys').forEach(function(g){
      sysGroups[g.getAttribute('data-sys')] = g;
    });
    var btnGroups = {};
    svg.querySelectorAll('.hb__btn').forEach(function(g){
      btnGroups[g.getAttribute('data-sys')] = g;
    });

    var props = {};
    try { props = JSON.parse(root.getAttribute('data-props')||'{}'); } catch(e){}
    var current = SYSTEMS[props.system] ? props.system : 'skeleton';

    function setActive(sys){
      current = sys;
      KEYS.forEach(function(k){
        var g = sysGroups[k];
        var btn = btnGroups[k];
        if(!g||!btn) return;
        if(k === sys){
          g.style.display = '';
          btn.querySelector('rect').setAttribute('fill', SYSTEMS[k].color);
          btn.querySelector('rect').setAttribute('stroke', SYSTEMS[k].color);
          btn.querySelector('text').setAttribute('fill', '#fff');
        } else {
          g.style.display = 'none';
          btn.querySelector('rect').setAttribute('fill', '#EEEEEE');
          btn.querySelector('rect').setAttribute('stroke', '#BDBDBD');
          btn.querySelector('text').setAttribute('fill', '#5D4037');
        }
      });
    }

    function emitChange(sys){
      root.dispatchEvent(new CustomEvent('cmp:change', {
        bubbles: true, composed: true,
        detail: { id: root.getAttribute('data-cmp-id'), type: 'toggle',
          values: { system: sys, systemName: SYSTEMS[sys].name }
        }
      }));
    }

    svg.querySelectorAll('.hb__btn').forEach(function(g){
      g.addEventListener('click', function(e){
        e.stopPropagation();
        var sys = g.getAttribute('data-sys');
        if(sys !== current){
          setActive(sys);
          emitChange(sys);
        }
      });
    });

    setActive(current);

    new MutationObserver(function(){
      try {
        var p = JSON.parse(root.getAttribute('data-props')||'{}');
        if(p.system && SYSTEMS[p.system] && p.system !== current){
          setActive(p.system);
        }
      } catch(e){}
    }).observe(root, { attributes: true, attributeFilter: ['data-props','style'] });
  })();
  </script>
</div>
