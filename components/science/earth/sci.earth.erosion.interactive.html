<!-- @cmp-manifest
{
  "schema": "cmp-manifest/v1",
  "id": "sci.earth.erosion.interactive",
  "name": "风化侵蚀",
  "nameEn": "Erosion",
  "category": "science/earth",
  "version": "1.0.0",
  "viewport": { "w": 360, "h": 260 },
  "props": [
    { "key": "size", "type": "number(px)", "default": 360, "min": 220, "max": 600, "desc": "组件宽度" },
    { "key": "type", "type": "enum(water,wind,ice)", "default": "water", "desc": "侵蚀类型" }
  ],
  "cssVars": { "size": "--cmp-size" },
  "tags": ["erosion", "weathering", "water", "wind", "glacier", "earth-science", "science", "primary", "interactive"],
  "events": [
    { "name": "cmp:change", "type": "toggle", "values": { "type": "string", "typeName": "string" } }
  ]
}
-->
<div class="cmp" data-cmp-id="sci.earth.erosion.interactive" role="img" aria-label="风化侵蚀">
  <style>
    .cmp[data-cmp-id="sci.earth.erosion.interactive"] {
      --w: var(--cmp-size, 360px);
      display: inline-block; width: var(--w); height: calc(var(--w) * 260 / 360);
      user-select: none; position: relative;
    }
    .cmp[data-cmp-id="sci.earth.erosion.interactive"] svg {
      width: 100%; height: 100%; display: block;
    }
    .cmp[data-cmp-id="sci.earth.erosion.interactive"] .er__tab {
      cursor: pointer; transition: opacity 0.2s;
    }
    .cmp[data-cmp-id="sci.earth.erosion.interactive"] .er__tab:hover { opacity: 0.85; }
    .cmp[data-cmp-id="sci.earth.erosion.interactive"] .er__label {
      font-family: Arial, 'Microsoft YaHei', sans-serif;
      font-size: 8px; font-weight: 600; pointer-events: none; fill: #555;
    }
    .cmp[data-cmp-id="sci.earth.erosion.interactive"] .er__scene { display: none; }
    .cmp[data-cmp-id="sci.earth.erosion.interactive"] .er__scene.er__active { display: block; }
    /* Water flow animation */
    @keyframes er-water-flow { 0% { stroke-dashoffset: 24; } 100% { stroke-dashoffset: 0; } }
    @keyframes er-rain-fall { 0% { opacity: 0; transform: translateY(-8px); } 20% { opacity: 0.8; } 100% { opacity: 0; transform: translateY(45px); } }
    @keyframes er-crumble { 0% { opacity: 0.8; transform: translate(0,0); } 100% { opacity: 0; transform: translate(6px,12px); } }
    /* Wind animations */
    @keyframes er-wind-move { 0% { stroke-dashoffset: 20; } 100% { stroke-dashoffset: 0; } }
    @keyframes er-sand-blow { 0% { opacity: 0.7; transform: translateX(0); } 100% { opacity: 0; transform: translateX(-40px); } }
    /* Glacier animation */
    @keyframes er-glacier-move { 0% { transform: translateX(0); } 100% { transform: translateX(-2px); } }
    .cmp[data-cmp-id="sci.earth.erosion.interactive"] .er__water-line {
      stroke-dasharray: 8,4; animation: er-water-flow 1.2s linear infinite;
    }
    .cmp[data-cmp-id="sci.earth.erosion.interactive"] .er__raindrop {
      animation: er-rain-fall 1.8s ease-in infinite;
    }
    .cmp[data-cmp-id="sci.earth.erosion.interactive"] .er__crumble {
      animation: er-crumble 2s ease-out infinite;
    }
    .cmp[data-cmp-id="sci.earth.erosion.interactive"] .er__wind-line {
      stroke-dasharray: 6,4; animation: er-wind-move 0.8s linear infinite;
    }
    .cmp[data-cmp-id="sci.earth.erosion.interactive"] .er__sand-p {
      animation: er-sand-blow 1.5s ease-out infinite;
    }
    .cmp[data-cmp-id="sci.earth.erosion.interactive"] .er__glacier-body {
      animation: er-glacier-move 4s ease-in-out infinite alternate;
    }
  </style>

  <svg viewBox="0 0 360 260" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <linearGradient class="er__g-sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#87CEEB"/><stop offset="100%" stop-color="#d4ecf7"/>
      </linearGradient>
      <linearGradient class="er__g-soil" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#A1887F"/><stop offset="40%" stop-color="#8D6E63"/>
        <stop offset="100%" stop-color="#6D4C41"/>
      </linearGradient>
      <linearGradient class="er__g-desert" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FFE0B2"/><stop offset="100%" stop-color="#FFCC80"/>
      </linearGradient>
      <linearGradient class="er__g-ice" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#E3F2FD"/><stop offset="100%" stop-color="#90CAF9"/>
      </linearGradient>
      <linearGradient class="er__g-glacier" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#B3E5FC" stop-opacity="0.9"/><stop offset="100%" stop-color="#4FC3F7" stop-opacity="0.8"/>
      </linearGradient>
    </defs>

    <!-- ===== TABS (y=5-25) ===== -->
    <g class="er__tab" data-type="water">

    <g class="er__tab" data-type="wind">

    <g class="er__tab" data-type="ice">

    <!-- ===== WATER EROSION SCENE ===== -->

      <!-- Left high terrain with strata -->
      <polygon class="er__p-soil-w" points="0,80 60,55 140,90 140,220 0,220" fill="url(#__soil)"/>
      <line x1="0" y1="120" x2="140" y2="130" stroke="#795548" stroke-width="0.8" opacity="0.4"/>

      <!-- V-shaped valley / river channel -->

      <!-- River water -->
      <path d="M130,88 Q150,105 160,130 Q170,155 200,175 Q240,195 300,205" stroke="#1E88E5" stroke-width="10" fill="none" opacity="0.6"/>
      <path class="er__water-line" d="M130,88 Q150,105 160,130 Q170,155 200,175 Q240,195 300,205" stroke="#42A5F5" stroke-width="5" fill="none"/>
      <!-- Eroded bank - crumbling particles on outer bend -->

      <circle class="er__crumble" cx="178" cy="152" r="1.2" fill="#A1887F" style="animation-delay:0.5s"/>
      <circle class="er__crumble" cx="172" cy="155" r="1" fill="#8D6E63" style="animation-delay:1s"/>
      <circle class="er__crumble" cx="195" cy="172" r="1.3" fill="#A1887F" style="animation-delay:0.3s"/>

      <!-- Labels -->

      <text class="er__label" x="305" y="196" text-anchor="middle">冲积扇</text>
      <text class="er__label" x="185" y="142" text-anchor="start" fill="#8D6E63">河岸崩塌</text>

      <line x1="73" y1="160" x2="87" y2="160" stroke="#795548" stroke-width="0.5" opacity="0.4"/>
      <!-- Yardang landforms -->

      <path d="M260,148 Q268,138 280,140 Q284,145 280,152 L260,152Z" fill="#8D6E63" opacity="0.7"/>

      <line class="er__wind-line" x1="345" y1="100" x2="210" y2="100" stroke="#78909C" stroke-width="0.8" opacity="0.35" style="animation-delay:0.2s"/>

      <polygon points="180,68 172,70 180,72" fill="#78909C" opacity="0.4"/>

      <circle class="er__sand-p" cx="200" cy="105" r="1" fill="#BCAAA4" style="animation-delay:0.2s"/>
      <circle class="er__sand-p" cx="120" cy="118" r="1.2" fill="#D7CCC8" style="animation-delay:1.0s"/>
      <circle class="er__sand-p" cx="170" cy="102" r="0.8" fill="#BCAAA4" style="animation-delay:0.6s"/>
      <!-- Labels -->
      <text class="er__label" x="80" y="100" text-anchor="middle">风蚀蘑菇</text>
      <text class="er__label" x="160" y="175" text-anchor="middle">沙丘</text>
      <text class="er__label" x="255" y="165" text-anchor="middle">雅丹地貌</text>
    </g>

    <!-- ===== GLACIER EROSION SCENE ===== -->
    <g class="er__scene" data-scene="ice">

      <rect class="er__r-sky-i" x="0" y="30" width="360" height="60" fill="url(#__sky)"/>
      <!-- Left mountain peak -->
      <polygon points="0,90 50,40 100,90" fill="#78909C"/>
      <polygon points="40,55 50,40 60,55" fill="#fff" opacity="0.8"/>
      <!-- Right mountain peak -->
      <polygon points="260,90 310,35 360,90" fill="#78909C"/>
      <polygon points="300,50 310,35 320,50" fill="#fff" opacity="0.8"/>

      <polygon points="100,90 100,220 130,220 130,120" fill="#90A4AE"/>
      <polygon points="260,90 260,220 230,220 230,120" fill="#90A4AE"/>

        <line x1="102" y1="170" x2="128" y2="172"/><line x1="102" y1="190" x2="128" y2="190"/>

        <line x1="258" y1="170" x2="232" y2="172"/><line x1="258" y1="190" x2="232" y2="190"/>

      <!-- Glacier body -->

        <!-- Crevasses -->
        <line x1="155" y1="110" x2="150" y2="140" stroke="#4FC3F7" stroke-width="1" opacity="0.5"/>
        <line x1="195" y1="105" x2="200" y2="135" stroke="#4FC3F7" stroke-width="0.8" opacity="0.4"/>
        <line x1="170" y1="140" x2="165" y2="165" stroke="#4FC3F7" stroke-width="0.8" opacity="0.45"/>

  </svg>
</div>

<script>
(function() {
  var script = document.currentScript;
  if (!script) return;
  var root = script.previousElementSibling;
  if (!root || root.getAttribute('data-cmp-id') !== 'sci.earth.erosion.interactive') return;
  var svg = root.querySelector('svg');
  if (!svg) return;

  /* Unique IDs for multi-instance safety */
  var uid = 'er_' + Math.random().toString(36).slice(2, 8);
  var gradMap = {
    'er__g-sky': '__sky', 'er__g-soil': '__soil', 'er__g-desert': '__desert',
    'er__g-ice': '__ice', 'er__g-glacier': '__glacier'
  };
  var refMap = {};
  Object.keys(gradMap).forEach(function(cls) {
    var el = svg.querySelector('.' + cls);
    if (!el) return;
    var newId = uid + gradMap[cls];
    el.setAttribute('id', newId);
    refMap[gradMap[cls]] = newId;
  });

  /* Update fill url() references */
  function fixRef(sel, key) {
    var el = svg.querySelector(sel);
    if (el && refMap[key]) el.setAttribute('fill', 'url(#' + refMap[key] + ')');
  }
  fixRef('.er__r-sky-w', '__sky');
  fixRef('.er__r-sky-i', '__sky');
  fixRef('.er__p-soil-w', '__soil');
  fixRef('.er__p-soil-w2', '__soil');
  fixRef('.er__r-desert', '__desert');
  fixRef('.er__p-glacier', '__glacier');

  /* State */
  var TYPES = { water: '水蚀', wind: '风蚀', ice: '冰蚀' };
  var DESCS = {
    water: '流水侵蚀地表，形成V形谷和冲积扇',
    wind: '风力搬运沙粒，磨蚀岩石形成风蚀地貌',
    ice: '冰川缓慢移动，刨蚀地表形成U形谷'
  };
  var current = 'water';
  try {
    var p = JSON.parse(root.getAttribute('data-props') || '{}');
    if (p.type && TYPES[p.type]) current = p.type;
  } catch (e) {}

  var infoText = svg.querySelector('.er__info-text');
  var scenes = svg.querySelectorAll('.er__scene');
  var tabs = svg.querySelectorAll('.er__tab');

  function update(type) {
    current = type;
    /* Toggle scenes */
    for (var i = 0; i < scenes.length; i++) {
      var s = scenes[i];
      if (s.getAttribute('data-scene') === type) {
        s.classList.add('er__active');
      } else {
        s.classList.remove('er__active');
      }
    }
    /* Update tabs */
    for (var j = 0; j < tabs.length; j++) {
      var t = tabs[j];
      var bg = t.querySelector('.er__tab-bg');
      if (bg) bg.setAttribute('fill', t.getAttribute('data-type') === type ? '#1976D2' : '#9E9E9E');
    }
    /* Update info text */
    if (infoText) infoText.textContent = DESCS[type] || '';
  }

  update(current);

  function emitChange() {
    root.dispatchEvent(new CustomEvent('cmp:change', {
      bubbles: true, composed: true,
      detail: {
        id: root.getAttribute('data-cmp-id'), type: 'toggle',
        values: { type: current, typeName: TYPES[current] }
      }
    }));
  }

  /* Click handler */
  svg.addEventListener('click', function(e) {
    var tab = e.target.closest('.er__tab');
    if (!tab) return;
    var type = tab.getAttribute('data-type');
    if (!type || !TYPES[type] || type === current) return;
    update(type);
    emitChange();
  });

  /* MutationObserver for external prop changes */
  new MutationObserver(function() {
    try {
      var p = JSON.parse(root.getAttribute('data-props') || '{}');
      if (p.type && TYPES[p.type] && p.type !== current) {
        update(p.type);
      }
    } catch (e) {}
  }).observe(root, { attributes: true, attributeFilter: ['data-props', 'style'] });
})();
</script>
