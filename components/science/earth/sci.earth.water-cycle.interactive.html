<div class="cmp" data-cmp-id="sci.earth.water-cycle.interactive" role="img" aria-label="水循环">
  <style>
    .cmp[data-cmp-id="sci.earth.water-cycle.interactive"] {
      --w: var(--cmp-size, 400px);
      display: inline-block;
      width: var(--w);
      height: calc(var(--w) * 0.75);
      user-select: none;
    }
    .cmp[data-cmp-id="sci.earth.water-cycle.interactive"] svg {
      width: 100%; height: 100%; display: block;
    }
    .cmp[data-cmp-id="sci.earth.water-cycle.interactive"] .wc__stage {
      cursor: pointer; opacity: 0.85; transition: opacity 0.3s;
    }
    .cmp[data-cmp-id="sci.earth.water-cycle.interactive"] .wc__stage:hover {
      opacity: 1;
    }
    .cmp[data-cmp-id="sci.earth.water-cycle.interactive"] .wc__stage.wc__active {
      opacity: 1; filter: drop-shadow(0 0 6px rgba(255,235,59,0.8));
    }
    .cmp[data-cmp-id="sci.earth.water-cycle.interactive"] .wc__label {
      font-family: Arial, 'Microsoft YaHei', sans-serif;
      font-size: 11px; font-weight: 700; pointer-events: none;
      fill: var(--cmp-label, #333);
    }
    .cmp[data-cmp-id="sci.earth.water-cycle.interactive"] .wc__sublabel {
      font-family: Arial, 'Microsoft YaHei', sans-serif;
      font-size: 8px; font-weight: 400; pointer-events: none;
      fill: var(--cmp-label, #333); opacity: 0.7;
    }
    /* Evaporation arrows rise */
    @keyframes wc-rise {
      0% { opacity: 0.8; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-40px); }
    }
    /* Rain drops fall */
    @keyframes wc-fall {
      0% { opacity: 0; transform: translateY(-10px); }
      20% { opacity: 0.9; }
      100% { opacity: 0; transform: translateY(50px); }
    }
    .cmp[data-cmp-id="sci.earth.water-cycle.interactive"] .wc__evap-arrow {
      animation: wc-rise 2.5s ease-in infinite;
    }
    .cmp[data-cmp-id="sci.earth.water-cycle.interactive"] .wc__raindrop {
      animation: wc-fall 2s ease-in infinite;
    }
  </style>

  <svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <!-- Sky gradient -->
      <linearGradient class="wc__grad-sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--cmp-sky, #87CEEB)"/>
        <stop offset="100%" stop-color="#e8f4fd"/>
      </linearGradient>
      <!-- Sun glow -->
      <radialGradient class="wc__grad-sun" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="var(--cmp-sun, #FFD54F)"/>
        <stop offset="60%" stop-color="var(--cmp-sun, #FFD54F)" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="var(--cmp-sun, #FFD54F)" stop-opacity="0"/>
      </radialGradient>
      <!-- Mountain gradient -->
      <linearGradient class="wc__grad-mtn" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#8D6E63"/>
        <stop offset="100%" stop-color="var(--cmp-mountain, #6D4C41)"/>
      </linearGradient>
      <!-- Water gradient -->
      <linearGradient class="wc__grad-water" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--cmp-water, #2196F3)"/>
        <stop offset="100%" stop-color="#1565C0"/>
      </linearGradient>
      <!-- Underground gradient -->
      <linearGradient class="wc__grad-under" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#5D4037"/>
        <stop offset="100%" stop-color="#3E2723"/>
      </linearGradient>
      <!-- Arrow marker -->
      <marker class="wc__marker-arrow" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">

    </defs>

      <path d="M145,208 Q165,204 185,208 Q205,212 225,208 Q245,204 265,208 Q285,212 305,208 Q325,204 345,208 Q365,212 385,208"/>

      <text class="wc__label" x="295" y="152" text-anchor="middle">蒸发</text>

<script>
(function() {
  var script = document.currentScript;
  if (!script) return;
  var root = script.previousElementSibling;
  if (!root || root.getAttribute('data-cmp-id') !== 'sci.earth.water-cycle.interactive') return;

  var svg = root.querySelector('svg');
  if (!svg) return;

  /* ── Unique IDs for multi-instance safety ── */
  var uid = 'wc_' + Math.random().toString(36).slice(2, 8);
  var gradientMap = {
    'wc__grad-sky': '__sky',
    'wc__grad-sun': '__sun',
    'wc__grad-mtn': '__mtn',
    'wc__grad-water': '__water',
    'wc__grad-under': '__under',
    'wc__marker-arrow': '__arrow'
  };

  var refMap = {};
  Object.keys(gradientMap).forEach(function(cls) {
    var el = svg.querySelector('.' + cls);
    if (!el) return;
    var newId = uid + gradientMap[cls];
    el.setAttribute('id', newId);
    refMap[gradientMap[cls]] = newId;
  });

  /* Update fill/stroke url() references */
  var skyRect = svg.querySelector('.wc__sky-rect');
  if (skyRect && refMap['__sky']) skyRect.setAttribute('fill', 'url(#' + refMap['__sky'] + ')');

  var sunGlow = svg.querySelector('.wc__sun-glow');
  if (sunGlow && refMap['__sun']) sunGlow.setAttribute('fill', 'url(#' + refMap['__sun'] + ')');

  var mtnFill = svg.querySelector('.wc__mtn-fill');
  if (mtnFill && refMap['__mtn']) mtnFill.setAttribute('fill', 'url(#' + refMap['__mtn'] + ')');

  var waterRect = svg.querySelector('.wc__water-rect');
  if (waterRect && refMap['__water']) waterRect.setAttribute('fill', 'url(#' + refMap['__water'] + ')');

  var underRect = svg.querySelector('.wc__under-rect');
  if (underRect && refMap['__under']) underRect.setAttribute('fill', 'url(#' + refMap['__under'] + ')');

  /* ── Stage interaction ── */
  var stages = root.querySelectorAll('.wc__stage');
  var activeStage = null;

  function emitChange(stageId, stageName) {
    root.dispatchEvent(new CustomEvent('cmp:change', {
      bubbles: true,
      composed: true,
      detail: {
        id: root.getAttribute('data-cmp-id'),
        type: 'toggle',
        values: {
          activeStage: stageId,
          stageName: stageName
        }
      }
    }));
  }

  for (var i = 0; i < stages.length; i++) {
    (function(stage) {
      stage.addEventListener('click', function(e) {
        e.stopPropagation();
        var stageId = stage.getAttribute('data-stage');
        var stageName = stage.getAttribute('data-name');

        if (activeStage === stageId) {
          /* Deactivate */
          stage.classList.remove('wc__active');
          activeStage = null;
          emitChange('', '');
        } else {
          /* Deactivate previous */
          for (var j = 0; j < stages.length; j++) {
            stages[j].classList.remove('wc__active');
          }
          /* Activate clicked */
          stage.classList.add('wc__active');
          activeStage = stageId;
          emitChange(stageId, stageName);
        }
      });
    })(stages[i]);
  }
})();
</script>
