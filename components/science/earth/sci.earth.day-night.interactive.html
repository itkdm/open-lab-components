<div class="cmp" data-cmp-id="sci.earth.day-night.interactive" role="img" aria-label="昼夜交替">

  <script>
  (function() {
    var script = document.currentScript; if (!script) return;
    var root = script.closest ? script.closest('.cmp') : script.parentElement;
    if (!root || root.getAttribute('data-cmp-id') !== 'sci.earth.day-night.interactive') return;
    var svg = root.querySelector('svg'); if (!svg) return;

    /* ── Unique IDs to avoid multi-instance conflicts ── */
    var uid = 'dn_' + Math.random().toString(36).slice(2, 8);

    var defs = svg.querySelectorAll('defs [class^="dn__"]');
    defs.forEach(function(el) {
      var cls = el.getAttribute('class');
      el.setAttribute('id', uid + '_' + cls);
    });

    function fixFill(el, cls) { if (el) el.setAttribute('fill', 'url(#' + uid + '_' + cls + ')'); }
    function fixClip(el, cls) { if (el) el.setAttribute('clip-path', 'url(#' + uid + '_' + cls + ')'); }

    fixFill(svg.querySelector('.dn__ref-sun-glow'), 'dn__sun-glow');
    fixFill(svg.querySelector('.dn__ref-sun-core'), 'dn__sun-core');
    fixFill(svg.querySelector('.dn__ref-ocean'), 'dn__earth-ocean');
    fixFill(svg.querySelector('.dn__shadow'), 'dn__shadow-grad');
    fixClip(svg.querySelector('.dn__continents'), 'dn__earth-clip');
    fixClip(svg.querySelector('.dn__shadow-g'), 'dn__earth-clip');

    var continents = svg.querySelector('.dn__continents');
    var statusText = svg.querySelector('.dn__status-text');
    var statusIcon = svg.querySelector('.dn__status-icon');
    var statusBg = svg.querySelector('.dn__status-bg');
    var hitArea = svg.querySelector('.dn__earth-hit');
    if (!continents || !statusText || !hitArea) return;

    var EX = 220, EY = 140;
    var rotation = 0;
    var dragging = false;
    var lastAngle = 0;

    // Read initial props
    try {
      var p = JSON.parse(root.getAttribute('data-props') || '{}');
      if (p.rotation !== undefined) rotation = ((+p.rotation || 0) % 360 + 360) % 360;
    } catch (e) {}

    /*
     * Geometry:
     *   Sun is at the LEFT of the Earth. Left semicircle = lit, right = shadow.
     *   Red marker starts at (220, 108) = top of Earth (12 o'clock position).
     *   SVG rotate(deg, 220, 140) rotates clockwise.
     *
     *   Side view with North Pole up: Earth's west-to-east rotation appears
     *   CLOCKWISE (surface at top moves rightward). So increasing `deg` = time advancing.
     *
     *   Marker position after rotation by `deg`:
     *     screen_x = 220 + 65·sin(deg)   → right when deg∈(0°,180°), left when deg∈(180°,360°)
     *
     *   The marker at the TOP of Earth sits on the terminator (day/night boundary).
     *   With clockwise rotation, the top moves toward the shadow side (right) first.
     *   So top = sunset (18:00), right = midnight, bottom = sunrise, left = noon.
     *
     *   Time mapping:
     *     deg=0   → 18:00 (sunset,   marker at top,    on terminator)
     *     deg=90  → 00:00 (midnight, marker at right,  deepest shadow)
     *     deg=180 → 06:00 (sunrise,  marker at bottom, on terminator)
     *     deg=270 → 12:00 (noon,     marker at left,   facing sun)
     *
     *   hour = (18 + deg / 15) % 24
     */

    function calcHour(deg) {
      var norm = ((deg % 360) + 360) % 360;
      var h = (18 + norm / 15) % 24;
      return h;
    }

    function isDaytime(deg) {
      var h = calcHour(deg);
      return h >= 6 && h < 18;
    }

    function timeLabel(deg) {
      var h = calcHour(deg);
      var hour = Math.floor(h);
      var min = Math.round((h - hour) * 60);
      if (min === 60) { hour++; min = 0; }
      hour = hour % 24;
      var hStr = (hour < 10 ? '0' : '') + hour + ':' + (min < 10 ? '0' : '') + min;

      var period;
      if (h >= 5 && h < 7) period = '日出';
      else if (h >= 7 && h < 11) period = '上午';
      else if (h >= 11 && h < 13) period = '正午';
      else if (h >= 13 && h < 17) period = '下午';
      else if (h >= 17 && h < 19) period = '日落';
      else if (h >= 19 && h < 22) period = '夜晚';
      else if (h >= 22 || h < 2) period = '深夜';
      else period = '凌晨';

      return { hStr: hStr, period: period, hour: hour };
    }

    function update() {
      var norm = ((rotation % 360) + 360) % 360;
      continents.setAttribute('transform', 'rotate(' + norm + ' ' + EX + ' ' + EY + ')');

      var day = isDaytime(norm);
      var info = timeLabel(norm);

      var icon = day ? '\u2600' : '\uD83C\uDF19';
      statusIcon.textContent = icon;
      statusText.textContent = info.period + '  ' + info.hStr;
      statusBg.setAttribute('fill', day ? '#1a2e1a' : '#1a1e3a');
    }

    function emitEvent(name) {
      var norm = ((rotation % 360) + 360) % 360;
      var info = timeLabel(norm);
      root.dispatchEvent(new CustomEvent(name, {
        bubbles: true, composed: true,
        detail: {
          id: root.getAttribute('data-cmp-id'),
          type: 'rotate',
          values: {
            rotation: Math.round(norm),
            hour: info.hour,
            dayNight: isDaytime(norm) ? '白天' : '黑夜'
          }
        }
      }));
    }

    function getAngle(e) {
      var pt = svg.createSVGPoint();
      var cx = e.touches ? e.touches[0].clientX : e.clientX;
      var cy = e.touches ? e.touches[0].clientY : e.clientY;
      pt.x = cx; pt.y = cy;
      var svgPt = pt.matrixTransform(svg.getScreenCTM().inverse());
      return Math.atan2(svgPt.y - EY, svgPt.x - EX) * 180 / Math.PI;
    }

    function onDown(e) {
      e.preventDefault();
      dragging = true;
      lastAngle = getAngle(e);
      hitArea.style.cursor = 'grabbing';
    }

    function onMove(e) {
      if (!dragging) return;
      e.preventDefault();
      var angle = getAngle(e);
      var delta = angle - lastAngle;
      if (delta > 180) delta -= 360;
      if (delta < -180) delta += 360;
      rotation = ((rotation + delta) % 360 + 360) % 360;
      lastAngle = angle;
      update();
      emitEvent('cmp:change');
    }

    function onUp() {
      if (!dragging) return;
      dragging = false;
      hitArea.style.cursor = '';
      emitEvent('cmp:changeend');
    }

    hitArea.addEventListener('mousedown', onDown);
    hitArea.addEventListener('touchstart', onDown, { passive: false });
    window.addEventListener('mousemove', onMove);
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('mouseup', onUp);
    window.addEventListener('touchend', onUp);

    // MutationObserver for external prop changes
    new MutationObserver(function() {
      try {
        var p2 = JSON.parse(root.getAttribute('data-props') || '{}');
        if (p2.rotation !== undefined) {
          var r = ((+p2.rotation || 0) % 360 + 360) % 360;
          if (Math.abs(r - rotation) > 0.5) { rotation = r; update(); }
        }
      } catch (e) {}
    }).observe(root, { attributes: true, attributeFilter: ['data-props', 'style'] });

    update();
  })();
  </script>
