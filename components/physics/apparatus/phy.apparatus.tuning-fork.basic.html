    <!-- 叉根内侧高光 -->

<script>
(() => {
  const root = document.currentScript?.previousElementSibling;
  if (!root || root.getAttribute("data-cmp-id") !== "phy.apparatus.tuning-fork.basic") return;

  const tineL = root.querySelector(".tf__tine-l");
  const tineR = root.querySelector(".tf__tine-r");
  const waves = root.querySelector(".tf__waves");

  function parseDataProps() {
    const raw = root.getAttribute("data-props");
    if (!raw) return {};
    try { const p = JSON.parse(raw); return p && typeof p === "object" ? p : {}; } catch (e) { return {}; }
  }

  function render() {
    const props = parseDataProps();
    const vibrating = props.vibrating === "on";

    if (tineL) tineL.style.animation = vibrating ? "tf-vibrate-l 0.05s ease-in-out infinite alternate" : "none";
    if (tineR) tineR.style.animation = vibrating ? "tf-vibrate-r 0.05s ease-in-out infinite alternate" : "none";
    if (waves) waves.style.opacity = vibrating ? "1" : "0";
  }

  render();

  const observer = new MutationObserver(() => render());
  observer.observe(root, { attributes: true, attributeFilter: ["style", "data-props"] });
  window.addEventListener("beforeunload", () => observer.disconnect(), { once: true });
})();
</script>

<style>
  .cmp[data-cmp-id="phy.apparatus.tuning-fork.basic"] {
    height: var(--cmp-size, 160px);
    width: calc(var(--cmp-size, 160px) * 0.5);
    display: inline-grid;
    place-items: center;
    transform: rotate(var(--cmp-rotate, 0deg)) scale(var(--cmp-scale, 1));
  }

  .cmp[data-cmp-id="phy.apparatus.tuning-fork.basic"] .tf__svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
    filter: drop-shadow(0 0 calc(8px * var(--cmp-glow, 0))
            rgba(255, 214, 102, calc(0.9 * var(--cmp-glow, 0))));
  }

  @keyframes tf-vibrate-l {
    0%   { transform: translateX(-1px); }
    100% { transform: translateX(1px); }
  }

  @keyframes tf-vibrate-r {
    0%   { transform: translateX(1px); }
    100% { transform: translateX(-1px); }
  }

  .cmp[data-cmp-id="phy.apparatus.tuning-fork.basic"] .tf__waves {
    transition: opacity 0.3s ease;
  }
</style>
