<!-- @cmp-manifest
{
  "schema": "cmp-manifest/v1",
  "id": "phy.apparatus.balance.interactive",
  "name": "托盘天平（交互式）",
  "nameEn": "Balance Scale (Interactive)",
  "category": "physics/apparatus",
  "version": "1.0.0",
  "viewport": { "w": 480, "h": 360 },
  "tags": ["balance","scale","mass","weight","measurement","interactive","draggable"],
  "props": [
    { "key": "size",         "type": "number(px)", "default": 360, "min": 240, "max": 600, "desc": "组件高度" },
    { "key": "leftMass",     "type": "number",     "default": 0,   "min": 0, "max": 200, "desc": "左盘质量(g)" },
    { "key": "rightMass",    "type": "number",     "default": 0,   "min": 0, "max": 200, "desc": "右盘质量(g)" },
    { "key": "rider",        "type": "number",     "default": 0,   "min": 0, "max": 5, "desc": "游码读数(g)" },
    { "key": "maxMass",      "type": "number",     "default": 200, "min": 50, "max": 500, "desc": "最大称量(g)" },
    { "key": "beamColor",    "type": "color",  "default": "#8d6e63", "desc": "横梁颜色" },
    { "key": "panColor",     "type": "color",  "default": "#b0bec5", "desc": "托盘颜色" },
    { "key": "baseColor",    "type": "color",  "default": "#5d4037", "desc": "底座颜色" },
    { "key": "pillarColor",  "type": "color",  "default": "#757575", "desc": "支柱颜色" },
    { "key": "pointerColor", "type": "color",  "default": "#d32f2f", "desc": "指针颜色" },
    { "key": "stroke",       "type": "color",  "default": "#333333", "desc": "描边颜色" },
    { "key": "strokeWidth",  "type": "number", "default": 1.5, "min": 0.5, "max": 4, "desc": "描边粗细" },
    { "key": "glow",         "type": "number(0-1)", "default": 0, "min": 0, "max": 1, "desc": "强调亮度" }
  ],
  "cssVars": {
    "size": "--cmp-size", "beamColor": "--cmp-beam", "panColor": "--cmp-pan",
    "baseColor": "--cmp-base", "pillarColor": "--cmp-pillar", "pointerColor": "--cmp-pointer",
    "stroke": "--cmp-stroke", "strokeWidth": "--cmp-stroke-width", "glow": "--cmp-glow"
  },
  "events": [
    {
      "name": "cmp:change",
      "type": "adjust",
      "values": { "rider": "number(0-5) — 游码读数(g)", "leftMass": "number — 左盘质量(g)", "rightMass": "number — 右盘质量(g)", "balanced": "boolean — 是否平衡" }
    },
    {
      "name": "cmp:changeend",
      "type": "adjust",
      "values": { "rider": "number(0-5) — 游码读数(g)", "leftMass": "number — 左盘质量(g)", "rightMass": "number — 右盘质量(g)", "balanced": "boolean — 是否平衡" }
    }
  ]
}
-->
<div class="cmp" data-cmp-id="phy.apparatus.balance.interactive" role="img" aria-label="托盘天平（交互式）">
  <style>
    .cmp[data-cmp-id="phy.apparatus.balance.interactive"]{
      --h:var(--cmp-size,360px);display:inline-block;width:calc(var(--h)*1.333);height:var(--h);
      filter:drop-shadow(0 0 calc(8px*var(--cmp-glow,0)) rgba(255,214,102,calc(.8*var(--cmp-glow,0))));
      user-select:none;touch-action:none;
    }
    .cmp[data-cmp-id="phy.apparatus.balance.interactive"] svg{width:100%;height:100%;display:block;overflow:visible}
    .cmp[data-cmp-id="phy.apparatus.balance.interactive"] .bal__drag{cursor:ew-resize}
  </style>

  <svg viewBox="0 0 480 360" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <!-- ===== 底座 ===== -->
    <path class="bal__base" d="M160,330 L320,330 L340,350 L140,350 Z"
          fill="var(--cmp-base,#5d4037)" stroke="var(--cmp-stroke,#333)" stroke-width="var(--cmp-stroke-width,1.5)" stroke-linejoin="round"/>
    <!-- 底座高光 -->
    <path d="M165,332 L315,332 L320,336 L160,336 Z" fill="#ffffff" opacity="0.12"/>
    <!-- 底座底部阴影 -->
    <path d="M145,346 L335,346 L340,350 L140,350 Z" fill="#000000" opacity="0.15"/>

    <!-- ===== 标尺刻度盘（底座上方） ===== -->
    <rect x="215" y="310" width="50" height="18" rx="3"
          fill="rgba(255,255,255,0.85)" stroke="var(--cmp-stroke,#333)" stroke-width="0.8"/>
    <!-- 刻度线 -->
    <line x1="240" y1="312" x2="240" y2="326" stroke="var(--cmp-stroke,#333)" stroke-width="0.8" opacity="0.6"/>
    <line x1="230" y1="316" x2="230" y2="326" stroke="var(--cmp-stroke,#333)" stroke-width="0.5" opacity="0.4"/>
    <line x1="250" y1="316" x2="250" y2="326" stroke="var(--cmp-stroke,#333)" stroke-width="0.5" opacity="0.4"/>
    <line x1="220" y1="318" x2="220" y2="326" stroke="var(--cmp-stroke,#333)" stroke-width="0.5" opacity="0.3"/>
    <line x1="260" y1="318" x2="260" y2="326" stroke="var(--cmp-stroke,#333)" stroke-width="0.5" opacity="0.3"/>

    <!-- ===== 支柱 ===== -->
    <rect x="234" y="140" width="12" height="192" rx="2"
          fill="var(--cmp-pillar,#757575)" stroke="var(--cmp-stroke,#333)" stroke-width="var(--cmp-stroke-width,1.5)"/>
    <!-- 支柱高光 -->
    <rect x="236" y="142" width="4" height="188" rx="1" fill="#ffffff" opacity="0.15"/>

    <!-- ===== 支点轴承 ===== -->
    <circle cx="240" cy="140" r="8"
            fill="var(--cmp-pillar,#757575)" stroke="var(--cmp-stroke,#333)" stroke-width="var(--cmp-stroke-width,1.5)"/>
    <circle cx="240" cy="140" r="3" fill="var(--cmp-stroke,#333)" opacity="0.5"/>

    <!-- ===== 横梁（可旋转组） ===== -->
    <g class="bal__beam-group">
      <!-- 横梁主体 -->
      <rect class="bal__beam-bar" x="60" y="134" width="360" height="12" rx="2"
            fill="var(--cmp-beam,#8d6e63)" stroke="var(--cmp-stroke,#333)" stroke-width="var(--cmp-stroke-width,1.5)"/>
      <!-- 横梁高光 -->
      <rect x="64" y="136" width="352" height="4" rx="1" fill="#ffffff" opacity="0.18"/>
      <!-- 横梁刻度 -->
      <g class="bal__beam-ticks"></g>

      <!-- 指针（从支点向下） -->
      <polygon class="bal__pointer" points="240,142 237,310 240,315 243,310"
               fill="var(--cmp-pointer,#d32f2f)" stroke="var(--cmp-stroke,#333)" stroke-width="0.8" opacity="0.9"/>

      <!-- ===== 游码 ===== -->
      <g class="bal__rider-group bal__drag">
        <rect class="bal__rider" x="237" y="126" width="12" height="22" rx="2"
              fill="var(--cmp-pointer,#d32f2f)" stroke="var(--cmp-stroke,#333)" stroke-width="1" opacity="0.85"/>
        <rect class="bal__rider-hi" x="239" y="128" width="8" height="4" rx="1" fill="#ffffff" opacity="0.3"/>
        <!-- 拖拽热区 -->
        <rect class="bal__rider-hit" x="229" y="120" width="28" height="34" fill="transparent"/>
      </g>

    </g>

    <!-- ===== 左侧吊绳 + 托盘（beam-group 外部，JS 独立定位） ===== -->
    <g class="bal__left-pan-group">
      <line class="bal__left-wire1" stroke="var(--cmp-stroke,#333)" stroke-width="1"/>
      <line class="bal__left-wire2" stroke="var(--cmp-stroke,#333)" stroke-width="1"/>
      <ellipse class="bal__left-pan" rx="48" ry="6"
               fill="var(--cmp-pan,#b0bec5)" stroke="var(--cmp-stroke,#333)" stroke-width="var(--cmp-stroke-width,1.5)"/>
      <ellipse class="bal__left-pan-hi" rx="38" ry="3" fill="#ffffff" opacity="0.2"/>
    </g>

    <!-- ===== 右侧吊绳 + 托盘 ===== -->
    <g class="bal__right-pan-group">
      <line class="bal__right-wire1" stroke="var(--cmp-stroke,#333)" stroke-width="1"/>
      <line class="bal__right-wire2" stroke="var(--cmp-stroke,#333)" stroke-width="1"/>
      <ellipse class="bal__right-pan" rx="48" ry="6"
               fill="var(--cmp-pan,#b0bec5)" stroke="var(--cmp-stroke,#333)" stroke-width="var(--cmp-stroke-width,1.5)"/>
      <ellipse class="bal__right-pan-hi" rx="38" ry="3" fill="#ffffff" opacity="0.2"/>
    </g>
  </svg>

  <script>
  (function(){
    var sc=document.currentScript;if(!sc)return;
    var root=sc.parentElement;
    if(!root||root.getAttribute('data-cmp-id')!=='phy.apparatus.balance.interactive')return;
    var svg=root.querySelector('svg');if(!svg)return;

    /* ─── 解析 props ─── */
    var P={};
    try{var r=root.getAttribute('data-props');if(r){var o=JSON.parse(r);if(o&&typeof o==='object')P=o;}}catch(e){}

    var leftMass=Math.max(0,Math.min(500,Number(P.leftMass)||0));
    var rightMass=Math.max(0,Math.min(500,Number(P.rightMass)||0));
    var rider=Math.max(0,Math.min(5,Number(P.rider)||0));
    var maxMass=Math.max(50,Math.min(500,Number(P.maxMass)||200));

    /* ─── 常量 ─── */
    var VB_W=480,VB_H=360;
    var CX=240,PIVOT_Y=140;
    var BEAM_HALF=160;
    var PAN_HANG=70;
    var MAX_TILT=8*Math.PI/180; /* 最大倾斜 8° */
    var RIDER_RANGE=120;

    /* ─── 元素引用 ─── */
    function q(c){return root.querySelector('.bal__'+c)}
    var el={};
    ['beam-group','beam-bar','beam-ticks','pointer',
     'rider','rider-hi','rider-hit','rider-group',
     'left-wire1','left-wire2','left-pan','left-pan-hi',
     'right-wire1','right-wire2','right-pan','right-pan-hi'
    ].forEach(function(k){el[k]=q(k)});

    /* ─── 横梁刻度（一次性） ─── */
    var ticksG=el['beam-ticks'];
    if(ticksG){
      ticksG.innerHTML='';
      for(var i=-10;i<=10;i++){
        var tx=CX+i*(BEAM_HALF/10);
        var ln=document.createElementNS('http://www.w3.org/2000/svg','line');
        ln.setAttribute('x1',tx);ln.setAttribute('x2',tx);
        ln.setAttribute('y1',134);ln.setAttribute('y2',i%5===0?130:132);
        ln.setAttribute('stroke','var(--cmp-stroke,#333)');
        ln.setAttribute('stroke-width',i===0?'0':'0.7');
        ln.setAttribute('opacity','0.4');
        ticksG.appendChild(ln);
      }
    }

    /* ─── 渲染 ─── */
    function render(){
      /* 力矩计算 */
      var effectiveRight=rightMass+rider;
      var diff=leftMass-effectiveRight;
      var maxT=Math.max(maxMass,1);
      var tilt=0;
      if(Math.abs(diff)>0.05){
        tilt=Math.min(MAX_TILT,Math.max(-MAX_TILT,(diff/maxT)*MAX_TILT*3));
      }

      var cosT=Math.cos(tilt),sinT=Math.sin(tilt);

      /* 横梁旋转（只旋转横梁、指针、游码） */
      if(el['beam-group']){
        el['beam-group'].setAttribute('transform','rotate('+(-tilt*180/Math.PI)+' '+CX+' '+PIVOT_Y+')');
      }

      /* 横梁两端的实际坐标（旋转后） */
      var lx=CX-BEAM_HALF*cosT;
      var ly=PIVOT_Y+BEAM_HALF*sinT;
      var rx=CX+BEAM_HALF*cosT;
      var ry=PIVOT_Y-BEAM_HALF*sinT;

      /* 托盘始终竖直悬挂在横梁端点下方 */
      var panY_L=ly+PAN_HANG;
      var panY_R=ry+PAN_HANG;

      /* 左托盘 */
      if(el['left-wire1']){
        el['left-wire1'].setAttribute('x1',lx);el['left-wire1'].setAttribute('y1',ly+6);
        el['left-wire1'].setAttribute('x2',lx-20);el['left-wire1'].setAttribute('y2',panY_L);
      }
      if(el['left-wire2']){
        el['left-wire2'].setAttribute('x1',lx);el['left-wire2'].setAttribute('y1',ly+6);
        el['left-wire2'].setAttribute('x2',lx+20);el['left-wire2'].setAttribute('y2',panY_L);
      }
      if(el['left-pan']){
        el['left-pan'].setAttribute('cx',lx);el['left-pan'].setAttribute('cy',panY_L+4);
      }
      if(el['left-pan-hi']){
        el['left-pan-hi'].setAttribute('cx',lx);el['left-pan-hi'].setAttribute('cy',panY_L+2);
      }

      /* 右托盘 */
      if(el['right-wire1']){
        el['right-wire1'].setAttribute('x1',rx);el['right-wire1'].setAttribute('y1',ry+6);
        el['right-wire1'].setAttribute('x2',rx-20);el['right-wire1'].setAttribute('y2',panY_R);
      }
      if(el['right-wire2']){
        el['right-wire2'].setAttribute('x1',rx);el['right-wire2'].setAttribute('y1',ry+6);
        el['right-wire2'].setAttribute('x2',rx+20);el['right-wire2'].setAttribute('y2',panY_R);
      }
      if(el['right-pan']){
        el['right-pan'].setAttribute('cx',rx);el['right-pan'].setAttribute('cy',panY_R+4);
      }
      if(el['right-pan-hi']){
        el['right-pan-hi'].setAttribute('cx',rx);el['right-pan-hi'].setAttribute('cy',panY_R+2);
      }

      /* 游码位置 */
      var riderX=CX+(rider/5)*RIDER_RANGE;
      if(el['rider']){el['rider'].setAttribute('x',riderX-6);}
      if(el['rider-hi']){el['rider-hi'].setAttribute('x',riderX-4);}
      if(el['rider-hit']){el['rider-hit'].setAttribute('x',riderX-14);}

      var balanced=Math.abs(diff)<0.1;
      root.setAttribute('aria-label',
        '托盘天平 左盘'+leftMass.toFixed(1)+'g 右盘'+rightMass.toFixed(1)+'g 游码'+rider.toFixed(2)+'g'+(balanced?' 平衡':''));
    }

    render();

    /* ─── 事件派发 ─── */
    function getValues(){
      var diff=leftMass-(rightMass+rider);
      return {
        rider:Math.round(rider*100)/100,
        leftMass:Math.round(leftMass*10)/10,
        rightMass:Math.round(rightMass*10)/10,
        balanced:Math.abs(diff)<0.1
      };
    }
    function emit(name){
      root.dispatchEvent(new CustomEvent(name,{bubbles:true,composed:true,
        detail:{id:root.getAttribute('data-cmp-id'),type:'adjust',values:getValues()}}));
    }

    /* ─── 游码拖拽 ─── */
    var dragging=false;

    function svgX(cx){
      var rect=svg.getBoundingClientRect();
      return (cx-rect.left)/(rect.width/VB_W);
    }

    function onStart(e){
      e.preventDefault();dragging=true;
      document.addEventListener('mousemove',onMove,{passive:false});
      document.addEventListener('mouseup',onEnd);
      document.addEventListener('touchmove',onMove,{passive:false});
      document.addEventListener('touchend',onEnd);
    }
    function onMove(e){
      if(!dragging)return;e.preventDefault();
      var pt=e.touches?e.touches[0]:e;
      var sx=svgX(pt.clientX);
      /* 游码只能在横梁右半段移动：CX → CX+RIDER_RANGE */
      var ratio=(sx-CX)/RIDER_RANGE;
      rider=Math.max(0,Math.min(5,ratio*5));
      /* 对齐到 0.1g */
      rider=Math.round(rider*10)/10;
      render();
      emit('cmp:change');
    }
    function onEnd(){
      dragging=false;
      document.removeEventListener('mousemove',onMove);
      document.removeEventListener('mouseup',onEnd);
      document.removeEventListener('touchmove',onMove);
      document.removeEventListener('touchend',onEnd);
      emit('cmp:changeend');
    }

    var riderG=root.querySelector('.bal__rider-group');
    if(riderG){
      riderG.addEventListener('mousedown',onStart,{passive:false});
      riderG.addEventListener('touchstart',onStart,{passive:false});
    }

    /* ─── 监听 data-props 变化 ─── */
    var obs=new MutationObserver(function(){
      var P2={};
      try{var r2=root.getAttribute('data-props');if(r2){var o2=JSON.parse(r2);if(o2&&typeof o2==='object')P2=o2;}}catch(e){}
      leftMass=Math.max(0,Math.min(500,Number(P2.leftMass)||0));
      rightMass=Math.max(0,Math.min(500,Number(P2.rightMass)||0));
      if(P2.rider!=null)rider=Math.max(0,Math.min(5,Number(P2.rider)||0));
      render();
    });
    obs.observe(root,{attributes:true,attributeFilter:['data-props','style']});

    window.addEventListener('beforeunload',function(){
      obs.disconnect();
      if(riderG){riderG.removeEventListener('mousedown',onStart);riderG.removeEventListener('touchstart',onStart);}
      document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onEnd);
      document.removeEventListener('touchmove',onMove);document.removeEventListener('touchend',onEnd);
    });
  })();
  </script>
</div>
