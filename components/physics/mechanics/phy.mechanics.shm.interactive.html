<div class="cmp" data-cmp-id="phy.mechanics.shm.interactive" role="img" aria-label="简谐运动（交互式）">
  <style>
    .cmp[data-cmp-id="phy.mechanics.shm.interactive"]{
      --h:var(--cmp-size,400px);display:inline-block;
      width:calc(var(--h)*520/400);height:var(--h);
      filter:drop-shadow(0 0 calc(8px*var(--cmp-glow,0)) rgba(255,152,0,calc(.7*var(--cmp-glow,0))));
      user-select:none;
    }
    .cmp[data-cmp-id="phy.mechanics.shm.interactive"] svg{width:100%;height:100%;display:block;overflow:visible}
    .cmp[data-cmp-id="phy.mechanics.shm.interactive"] text{font-family:Arial,'Microsoft YaHei',sans-serif}
    .cmp[data-cmp-id="phy.mechanics.shm.interactive"] .shm__data{font-family:'Courier New',monospace;font-weight:600;font-variant-numeric:tabular-nums}
  </style>

  <svg viewBox="0 0 520 400" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <marker id="shm__arrF" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="var(--cmp-mass,#e53935)"/></marker>
      <marker id="shm__arrV" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#43a047"/></marker>
    </defs>

    <text x="260" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="var(--cmp-stroke,#37474f)">简谐运动</text>

    <!-- 弹簧-质量块系统 -->
    <g transform="translate(0,60)">
      <!-- 墙壁 -->
      <rect x="10" y="40" width="8" height="60" fill="#90a4ae" rx="1"/>
      <line x1="10" y1="40" x2="10" y2="100" stroke="var(--cmp-stroke,#37474f)" stroke-width="1.5"/>
      <!-- 阴影线 -->
      <g stroke="#78909c" stroke-width="0.8" opacity="0.5">
        <line x1="10" y1="45" x2="4" y2="51"/><line x1="10" y1="55" x2="4" y2="61"/>
        <line x1="10" y1="65" x2="4" y2="71"/><line x1="10" y1="75" x2="4" y2="81"/>
        <line x1="10" y1="85" x2="4" y2="91"/>
      </g>

      <!-- 弹簧 (动态) -->
      <polyline class="shm__spring" fill="none" stroke="var(--cmp-spring,#78909c)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- 质量块 -->
      <rect class="shm__mass" width="40" height="40" rx="4" fill="var(--cmp-mass,#e53935)" stroke="var(--cmp-stroke,#37474f)" stroke-width="1.2"/>
      <text class="shm__massLabel" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">m</text>

      <!-- 平衡位置线 -->
      <line class="shm__eqLine" y1="35" y2="105" stroke="var(--cmp-stroke,#37474f)" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.4"/>
      <text class="shm__eqLabel" y="118" text-anchor="middle" font-size="9" fill="#999">平衡位置</text>

      <!-- 力矢量 -->
      <line class="shm__forceVec" y1="70" y2="70" stroke="var(--cmp-mass,#e53935)" stroke-width="2.5" marker-end="url(#shm__arrF)"/>
      <text class="shm__forceLabel" y="62" font-size="9" fill="var(--cmp-mass,#e53935)" font-weight="600">F</text>

      <!-- 速度矢量 -->
      <line class="shm__velVec" y1="70" y2="70" stroke="#43a047" stroke-width="2.5" marker-end="url(#shm__arrV)"/>
      <text class="shm__velLabel" y="88" font-size="9" fill="#43a047" font-weight="600">v</text>

      <!-- 地面 -->
      <line x1="0" y1="100" x2="350" y2="100" stroke="var(--cmp-stroke,#37474f)" stroke-width="1"/>
    </g>

    <!-- x-t 图 -->
    <g class="shm__graph" transform="translate(40,200)">
      <text x="220" y="-5" text-anchor="middle" font-size="11" font-weight="600" fill="var(--cmp-stroke,#37474f)">位移-时间图 (x-t)</text>
      <!-- 坐标轴 -->
      <line x1="0" y1="75" x2="440" y2="75" stroke="var(--cmp-stroke,#37474f)" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="150" stroke="var(--cmp-stroke,#37474f)" stroke-width="1"/>
      <text x="445" y="79" font-size="9" fill="#999">t</text>
      <text x="-5" y="-3" font-size="9" fill="#999">x</text>
      <!-- 振幅线 -->
      <line x1="0" y1="10" x2="440" y2="10" stroke="var(--cmp-trace,#ff9800)" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.4"/>
      <line x1="0" y1="140" x2="440" y2="140" stroke="var(--cmp-trace,#ff9800)" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.4"/>
      <text x="-18" y="14" font-size="8" fill="var(--cmp-trace,#ff9800)">+A</text>
      <text x="-18" y="144" font-size="8" fill="var(--cmp-trace,#ff9800)">-A</text>

      <!-- 正弦曲线 -->
      <polyline class="shm__sine" fill="none" stroke="var(--cmp-trace,#ff9800)" stroke-width="2"/>
      <!-- 当前时刻指示 -->
      <circle class="shm__graphDot" r="4" fill="var(--cmp-mass,#e53935)"/>
      <line class="shm__graphLine" y1="0" y2="150" stroke="var(--cmp-mass,#e53935)" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.5"/>
    </g>

    <!-- 数据面板 -->
    <g transform="translate(380,65)">
      <rect x="0" y="0" width="125" height="110" rx="6" fill="rgba(255,255,255,0.95)" stroke="#e0e0e0" stroke-width="0.5"/>
      <text x="62" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="var(--cmp-stroke,#37474f)">实时数据</text>
      <text x="10" y="38" font-size="9" fill="#666">位移 x:</text>
      <text class="shm__xVal shm__data" x="115" y="38" text-anchor="end" font-size="10" fill="var(--cmp-mass,#e53935)">0.0 cm</text>
      <text x="10" y="56" font-size="9" fill="#666">速度 v:</text>
      <text class="shm__vVal shm__data" x="115" y="56" text-anchor="end" font-size="10" fill="#43a047">0.0 cm/s</text>
      <text x="10" y="74" font-size="9" fill="#666">加速度 a:</text>
      <text class="shm__aVal shm__data" x="115" y="74" text-anchor="end" font-size="10" fill="#1e88e5">0.0 cm/s²</text>
      <text x="10" y="92" font-size="9" fill="#666">时间 t:</text>
      <text class="shm__tVal shm__data" x="115" y="92" text-anchor="end" font-size="10" fill="#78909c">0.00 s</text>
    </g>
  </svg>

  <script>
  (function(){
    var sc=document.currentScript;if(!sc)return;
    var root=sc.parentElement;
    if(!root||root.getAttribute('data-cmp-id')!=='phy.mechanics.shm.interactive')return;

    var P={};
    try{var r=root.getAttribute('data-props');if(r){var o=JSON.parse(r);if(o&&typeof o==='object')P=o;}}catch(e){}

    var amp=Math.max(20,Math.min(120,Number(P.amplitude)||80));
    var period=Math.max(0.5,Math.min(5,Number(P.period)||2));
    var damping=Math.max(0,Math.min(0.5,Number(P.damping)||0));
    var speed=Math.max(0.2,Math.min(3,Number(P.speed)||1));
    var running=(P.running!=='off');
    var showGraph=(P.showGraph!=='off');
    var showVectors=(P.showVectors!=='off');

    var omega=2*Math.PI/period;
    var eqX=180; /* 平衡位置x */

    var springEl=root.querySelector('.shm__spring');
    var massEl=root.querySelector('.shm__mass');
    var massLabel=root.querySelector('.shm__massLabel');
    var eqLine=root.querySelector('.shm__eqLine');
    var eqLabel=root.querySelector('.shm__eqLabel');
    var forceVec=root.querySelector('.shm__forceVec');
    var forceLabel=root.querySelector('.shm__forceLabel');
    var velVec=root.querySelector('.shm__velVec');
    var velLabel=root.querySelector('.shm__velLabel');
    var sineEl=root.querySelector('.shm__sine');
    var graphDot=root.querySelector('.shm__graphDot');
    var graphLine=root.querySelector('.shm__graphLine');
    var graphG=root.querySelector('.shm__graph');
    var xVal=root.querySelector('.shm__xVal');
    var vVal=root.querySelector('.shm__vVal');
    var aVal=root.querySelector('.shm__aVal');
    var tVal=root.querySelector('.shm__tVal');

    eqLine.setAttribute('x1',eqX);eqLine.setAttribute('x2',eqX);
    eqLabel.setAttribute('x',eqX);

    /* 弹簧绘制 */
    function drawSpring(endX){
      var sx=18,sy=70,ex=endX,ey=70;
      var coils=12,coilH=8;
      var len=ex-sx;
      var segLen=len/(coils*2+2);
      var pts=sx+','+sy;
      pts+=' '+(sx+segLen)+','+sy;
      for(var i=0;i<coils;i++){
        pts+=' '+(sx+segLen*(2+i*2))+','+(sy-coilH);
        pts+=' '+(sx+segLen*(3+i*2))+','+(sy+coilH);
      }
      pts+=' '+(ex-segLen)+','+sy;
      pts+=' '+ex+','+ey;
      springEl.setAttribute('points',pts);
    }

    var time=0;
    var history=[];
    var graphW=440,graphH=150,graphMid=75;

    var animId=0,lastT=0;
    function tick(t){
      if(!lastT)lastT=t;
      var dt=Math.min((t-lastT)/1000,0.04);
      lastT=t;
      time+=dt*speed;

      var decay=Math.exp(-damping*time);
      var x=amp*decay*Math.cos(omega*time);
      var v=-amp*decay*omega*Math.sin(omega*time);
      var a=-amp*decay*omega*omega*Math.cos(omega*time);

      /* 弹簧+质量块 */
      var massX=eqX+x;
      drawSpring(massX);
      massEl.setAttribute('x',massX);massEl.setAttribute('y',50);
      massLabel.setAttribute('x',massX+20);massLabel.setAttribute('y',76);

      /* 力矢量 */
      if(showVectors){
        var fScale=0.3;
        var fLen=-x*fScale;
        forceVec.setAttribute('x1',massX+20);forceVec.setAttribute('x2',massX+20+fLen);
        forceVec.style.display=(Math.abs(fLen)>3)?'':'none';
        forceLabel.setAttribute('x',massX+20+fLen/2);
        forceLabel.style.display=(Math.abs(fLen)>3)?'':'none';

        var vScale=0.5;
        var vLen=v*vScale;
        velVec.setAttribute('x1',massX+20);velVec.setAttribute('x2',massX+20+vLen);
        velVec.style.display=(Math.abs(vLen)>3)?'':'none';
        velLabel.setAttribute('x',massX+20+vLen/2);
        velLabel.style.display=(Math.abs(vLen)>3)?'':'none';
      }else{
        forceVec.style.display='none';forceLabel.style.display='none';
        velVec.style.display='none';velLabel.style.display='none';
      }

      /* x-t图 */
      if(showGraph){
        graphG.style.display='';
        history.push({t:time,x:x});
        /* 保留最近一段 */
        var tWindow=period*3;
        while(history.length>0&&history[0].t<time-tWindow)history.shift();

        var pts='';
        for(var i=0;i<history.length;i++){
          var gx=(history[i].t-history[0].t)/(tWindow)*graphW;
          var gy=graphMid-history[i].x/amp*graphMid*0.85;
          var pair=gx.toFixed(1)+','+gy.toFixed(1);
          pts+=(i?' ':'')+pair;
        }
        sineEl.setAttribute('points',pts);

        var lastGx=graphW;
        var lastGy=graphMid-x/amp*graphMid*0.85;
        graphDot.setAttribute('cx',lastGx);graphDot.setAttribute('cy',lastGy);
        graphLine.setAttribute('x1',lastGx);graphLine.setAttribute('x2',lastGx);
      }else{
        graphG.style.display='none';
      }

      /* 数据 */
      xVal.textContent=(x/10).toFixed(1)+' cm';
      vVal.textContent=(v/10).toFixed(1)+' cm/s';
      aVal.textContent=(a/10).toFixed(1)+' cm/s²';
      tVal.textContent=time.toFixed(2)+' s';

      if(running)animId=requestAnimationFrame(tick);
    }
    if(running)animId=requestAnimationFrame(tick);

    var obs=new MutationObserver(function(){
      var P2={};
      try{var r2=root.getAttribute('data-props');if(r2){var o2=JSON.parse(r2);if(o2&&typeof o2==='object')P2=o2;}}catch(e){}
      speed=Math.max(0.2,Math.min(3,Number(P2.speed)||1));
      showGraph=(P2.showGraph!=='off');showVectors=(P2.showVectors!=='off');
      var newRun=(P2.running!=='off');
      if(newRun&&!running){running=true;lastT=0;animId=requestAnimationFrame(tick);}
      if(!newRun&&running){running=false;cancelAnimationFrame(animId);animId=0;}
    });
    obs.observe(root,{attributes:true,attributeFilter:['data-props','style']});
    window.addEventListener('beforeunload',function(){cancelAnimationFrame(animId);obs.disconnect();});
  })();
  </script>
</div>
