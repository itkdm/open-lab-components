<!-- @cmp-manifest
{
  "schema": "cmp-manifest/v1",
  "id": "phy.mechanics.cart.dynamics",
  "name": "力学实验小车",
  "nameEn": "Dynamics Cart",
  "category": "physics/mechanics",
  "version": "1.0.0",
  "viewport": { "w": 140, "h": 65 },
  "tags": ["physics", "mechanics", "cart", "dynamics", "newton", "acceleration", "track"],
  "props": [
    { "key": "size",        "type": "number(px)", "default": 140, "min": 80, "max": 240, "desc": "组件宽度" },
    { "key": "bodyColor",   "type": "color",  "default": "#1e88e5", "desc": "车身颜色" },
    { "key": "wheelColor",  "type": "color",  "default": "#37474f", "desc": "车轮颜色" },
    { "key": "stroke",      "type": "color",  "default": "#263238", "desc": "描边颜色" },
    { "key": "strokeWidth", "type": "number", "default": 1.5, "min": 0.5, "max": 3, "desc": "描边宽度" },
    { "key": "massSlots",   "type": "number", "default": 0, "min": 0, "max": 3, "desc": "砝码槽中砝码数量" },
    { "key": "pulleyHook",  "type": "enum",   "default": "on", "enum": ["on","off"], "desc": "显示滑轮绳钩" }
  ],
  "cssVars": {
    "size":        "--cmp-size",
    "bodyColor":   "--cmp-body",
    "wheelColor":  "--cmp-wheel",
    "stroke":      "--cmp-stroke",
    "strokeWidth": "--cmp-stroke-width"
  }
}
-->
<div class="cmp" data-cmp-id="phy.mechanics.cart.dynamics" role="img" aria-label="力学实验小车">
  <svg class="dc__svg" viewBox="0 0 140 65" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <!-- 车身主体（带砝码槽凹陷） -->
    <path class="dc__body"
          d="M18,18 L122,18 C124,18 126,20 126,22 L126,38 C126,40 124,42 122,42 L18,42 C16,42 14,40 14,38 L14,22 C14,20 16,18 18,18 Z"
          fill="var(--cmp-body,#1e88e5)"
          stroke="var(--cmp-stroke,#263238)"
          stroke-width="var(--cmp-stroke-width,1.5)"/>
    <!-- 车身高光 -->
    <rect x="18" y="20" width="104" height="5" rx="2" fill="#ffffff" opacity="0.22"/>

    <!-- 砝码槽（中央凹陷区域） -->
    <rect x="42" y="20" width="56" height="16" rx="2"
          fill="rgba(0,0,0,0.15)"
          stroke="var(--cmp-stroke,#263238)"
          stroke-width="0.8"/>
    <!-- 槽底纹理 -->
    <line x1="55" y1="21" x2="55" y2="35" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
    <line x1="70" y1="21" x2="70" y2="35" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
    <line x1="85" y1="21" x2="85" y2="35" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>

    <!-- 砝码（动态显示） -->
    <g class="dc__mass dc__mass-1" style="display:none">
      <rect x="46" y="22" width="14" height="12" rx="1.5"
            fill="#78909c" stroke="#455a64" stroke-width="0.8"/>
      <rect x="48" y="23" width="4" height="10" rx="1" fill="#ffffff" opacity="0.15"/>
    </g>
    <g class="dc__mass dc__mass-2" style="display:none">
      <rect x="63" y="22" width="14" height="12" rx="1.5"
            fill="#78909c" stroke="#455a64" stroke-width="0.8"/>
      <rect x="65" y="23" width="4" height="10" rx="1" fill="#ffffff" opacity="0.15"/>
    </g>
    <g class="dc__mass dc__mass-3" style="display:none">
      <rect x="80" y="22" width="14" height="12" rx="1.5"
            fill="#78909c" stroke="#455a64" stroke-width="0.8"/>
      <rect x="82" y="23" width="4" height="10" rx="1" fill="#ffffff" opacity="0.15"/>
    </g>

    <!-- 滑轮绳钩（前端） -->
    <g class="dc__hook">
      <line x1="126" y1="30" x2="134" y2="30"
            stroke="var(--cmp-stroke,#263238)"
            stroke-width="var(--cmp-stroke-width,1.5)" stroke-linecap="round"/>
      <circle cx="136" cy="30" r="3"
              fill="none" stroke="var(--cmp-stroke,#263238)"
              stroke-width="var(--cmp-stroke-width,1.5)"/>
    </g>

    <!-- 左轮（低摩擦宽轮） -->
    <rect x="22" y="42" width="16" height="4" rx="1"
          fill="var(--cmp-wheel,#37474f)"
          stroke="var(--cmp-stroke,#263238)"
          stroke-width="calc(var(--cmp-stroke-width,1.5)*0.7)"/>
    <circle cx="30" cy="54" r="9"
            fill="var(--cmp-wheel,#37474f)"
            stroke="var(--cmp-stroke,#263238)"
            stroke-width="var(--cmp-stroke-width,1.5)"/>
    <circle cx="30" cy="54" r="3" fill="#78909c"/>
    <circle cx="30" cy="54" r="1.2" fill="#b0bec5"/>

    <!-- 右轮 -->
    <rect x="102" y="42" width="16" height="4" rx="1"
          fill="var(--cmp-wheel,#37474f)"
          stroke="var(--cmp-stroke,#263238)"
          stroke-width="calc(var(--cmp-stroke-width,1.5)*0.7)"/>
    <circle cx="110" cy="54" r="9"
            fill="var(--cmp-wheel,#37474f)"
            stroke="var(--cmp-stroke,#263238)"
            stroke-width="var(--cmp-stroke-width,1.5)"/>
    <circle cx="110" cy="54" r="3" fill="#78909c"/>
    <circle cx="110" cy="54" r="1.2" fill="#b0bec5"/>
  </svg>
</div>

<script>
(() => {
  const root = document.currentScript?.previousElementSibling;
  if (!root || root.getAttribute("data-cmp-id") !== "phy.mechanics.cart.dynamics") return;

  function parseProps() {
    try { const r = root.getAttribute("data-props"); return r ? JSON.parse(r) || {} : {}; } catch (e) { return {}; }
  }

  function update() {
    const props = parseProps();
    const slots = Math.max(0, Math.min(3, Math.round(Number(props.massSlots) || 0)));
    const hookOn = props.pulleyHook !== "off";

    for (let i = 1; i <= 3; i++) {
      const el = root.querySelector(`.dc__mass-${i}`);
      if (el) el.style.display = i <= slots ? "" : "none";
    }

    const hook = root.querySelector(".dc__hook");
    if (hook) hook.style.display = hookOn ? "" : "none";
  }

  update();
  const obs = new MutationObserver(update);
  obs.observe(root, { attributes: true, attributeFilter: ["data-props"] });
  window.addEventListener("beforeunload", () => obs.disconnect(), { once: true });
})();
</script>

<style>
.cmp[data-cmp-id="phy.mechanics.cart.dynamics"] {
  width: var(--cmp-size, 140px);
  height: calc(var(--cmp-size, 140px) * 0.464);
  display: inline-block;
}
.cmp[data-cmp-id="phy.mechanics.cart.dynamics"] .dc__svg {
  width: 100%; height: 100%; display: block; overflow: visible;
}
</style>
