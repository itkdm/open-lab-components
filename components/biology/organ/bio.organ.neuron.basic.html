<!--
  神经元结构 — 教学示意（水平布局）
  viewBox: 0 0 360 140
  左侧：树突 → 细胞体 → 轴突丘 → 轴突（髓鞘+郎飞结） → 突触小体
-->
<div class="cmp" data-cmp-id="bio.organ.neuron.basic" role="img" aria-label="神经元结构">

      <linearGradient id="nr_myelinG" x1="0" y1="0" x2="0" y2="1">

        <stop offset="100%" stop-color="#fff9c4"/>

    </defs>

    <!-- ==================== 树突（左侧分支） ==================== -->
    <g stroke="var(--cmp-body,#7e57c2)" fill="none" stroke-linecap="round" opacity="0.7">

      <path d="M10,40 Q25,45 40,50 Q55,55 65,60" stroke-width="2"/>
      <path d="M5,55 Q20,58 35,60 Q50,62 65,65" stroke-width="1.8"/>
      <path d="M8,70 Q25,70 45,70 Q58,70 68,70" stroke-width="2.2"/>
      <path d="M5,85 Q20,82 35,80 Q50,78 65,75" stroke-width="1.8"/>
      <path d="M10,100 Q25,95 40,90 Q55,85 65,80" stroke-width="2"/>
      <!-- 次级分支 -->
      <path d="M10,40 Q5,30 2,22" stroke-width="1"/>
      <path d="M10,40 Q15,32 12,24" stroke-width="0.8"/>
      <path d="M5,55 Q0,48 -2,40" stroke-width="0.8"/>
      <path d="M8,70 Q2,65 -2,58" stroke-width="0.8"/>
      <path d="M8,70 Q2,75 -2,82" stroke-width="0.8"/>
      <path d="M5,85 Q0,92 -2,100" stroke-width="0.8"/>
      <path d="M10,100 Q5,108 2,116" stroke-width="1"/>
      <path d="M10,100 Q15,108 12,118" stroke-width="0.8"/>
      <!-- 树突棘（小突起） -->
      <circle cx="25" cy="44" r="1.2" fill="var(--cmp-body,#7e57c2)" opacity="0.5"/>
      <circle cx="30" cy="60" r="1" fill="var(--cmp-body,#7e57c2)" opacity="0.5"/>
      <circle cx="20" cy="72" r="1.2" fill="var(--cmp-body,#7e57c2)" opacity="0.5"/>
      <circle cx="28" cy="82" r="1" fill="var(--cmp-body,#7e57c2)" opacity="0.5"/>
      <circle cx="22" cy="96" r="1.2" fill="var(--cmp-body,#7e57c2)" opacity="0.5"/>
    </g>

    <!-- ==================== 细胞体（胞体） ==================== -->
    <ellipse cx="85" cy="70" rx="22" ry="20"
             fill="url(#nr_bodyG)" stroke="var(--cmp-stroke,#37474f)" stroke-width="1.5"/>
    <!-- 细胞核 -->
    <circle cx="82" cy="68" r="10" fill="#4527a0" opacity="0.3"
            stroke="#4527a0" stroke-width="0.8" opacity="0.4"/>
    <!-- 核仁 -->
    <circle cx="80" cy="66" r="4" fill="#311b92" opacity="0.25"/>
    <!-- 尼氏体（粗面内质网团块） -->
    <g opacity="0.2">
      <rect x="72" y="78" width="5" height="3" rx="1" fill="#311b92"/>
      <rect x="80" y="80" width="4" height="2.5" rx="1" fill="#311b92"/>
      <rect x="90" y="76" width="5" height="3" rx="1" fill="#311b92"/>
      <rect x="94" y="62" width="4" height="2.5" rx="1" fill="#311b92"/>

    <!-- 郎飞结1 -->

    <!-- 髓鞘段2 -->

          fill="url(#nr_myelinG)" stroke="var(--cmp-stroke,#37474f)" stroke-width="0.8" opacity="0.7"/>
    <!-- 郎飞结2 -->

    <!-- 髓鞘段3 -->
    <rect x="209" y="58" width="30" height="24" rx="10"
          fill="url(#nr_myelinG)" stroke="var(--cmp-stroke,#37474f)" stroke-width="0.8" opacity="0.7"/>
    <!-- 郎飞结3 -->

    <!-- 郎飞结4 -->

    <ellipse cx="150" cy="62" rx="5" ry="2.5" fill="#f9a825" opacity="0.3"/>
    <ellipse cx="187" cy="62" rx="5" ry="2.5" fill="#f9a825" opacity="0.3"/>
    <ellipse cx="224" cy="62" rx="5" ry="2.5" fill="#f9a825" opacity="0.3"/>
    <ellipse cx="261" cy="62" rx="5" ry="2.5" fill="#f9a825" opacity="0.3"/>
    <ellipse cx="298" cy="62" rx="5" ry="2.5" fill="#f9a825" opacity="0.3"/>

    <!-- ==================== 轴突末梢（突触小体） ==================== -->
    <g>

      <circle cx="342" cy="64" r="5" fill="var(--cmp-axon,#fdd835)" opacity="0.5" stroke="var(--cmp-stroke,#37474f)" stroke-width="0.8"/>
      <circle cx="342" cy="76" r="5" fill="var(--cmp-axon,#fdd835)" opacity="0.5" stroke="var(--cmp-stroke,#37474f)" stroke-width="0.8"/>
      <circle cx="337" cy="90" r="5" fill="var(--cmp-axon,#fdd835)" opacity="0.5" stroke="var(--cmp-stroke,#37474f)" stroke-width="0.8"/>
      <!-- 突触小泡（小点） -->
      <circle cx="335" cy="48" r="1.2" fill="#f57f17" opacity="0.4"/>
      <circle cx="339" cy="52" r="1" fill="#f57f17" opacity="0.4"/>
      <circle cx="340" cy="62" r="1.2" fill="#f57f17" opacity="0.4"/>
      <circle cx="344" cy="66" r="1" fill="#f57f17" opacity="0.4"/>
      <circle cx="340" cy="74" r="1.2" fill="#f57f17" opacity="0.4"/>
      <circle cx="344" cy="78" r="1" fill="#f57f17" opacity="0.4"/>
      <circle cx="335" cy="88" r="1.2" fill="#f57f17" opacity="0.4"/>
      <circle cx="339" cy="92" r="1" fill="#f57f17" opacity="0.4"/>
    </g>

    <!-- ==================== 信号传导方向箭头 ==================== -->
    <defs>
      <marker id="nr_arrow" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
        <path d="M0,0 L6,2 L0,4" fill="var(--cmp-stroke,#37474f)" opacity="0.4"/>
      </marker>
    </defs>
    <path d="M50,125 L310,125" fill="none" stroke="var(--cmp-stroke,#37474f)" stroke-width="1"
          stroke-dasharray="4,3" opacity="0.3" marker-end="url(#nr_arrow)"/>
    <text x="180" y="135" text-anchor="middle" font-size="6" font-family="Arial,'Microsoft YaHei',sans-serif"
          fill="var(--cmp-stroke,#37474f)" opacity="0.35">神经冲动传导方向</text>

    <!-- ==================== 标注 ==================== -->

       fill="var(--cmp-stroke,#37474f)" font-weight="600">

      <!-- 树突 -->
      <line x1="15" y1="38" x2="15" y2="22" stroke="var(--cmp-stroke,#37474f)" stroke-width="0.4"/>

      <!-- 轴突 -->
      <text x="220" y="95" text-anchor="middle" font-size="6.5" opacity="0.6">轴突</text>

      <text x="150" y="39" text-anchor="middle" font-size="5.5" opacity="0.6">髓鞘</text>

      <!-- 郎飞结 -->

      <text x="205" y="102" text-anchor="middle" font-size="5.5" opacity="0.6">郎飞结</text>

      <!-- 施万细胞 -->

      <text x="261" y="39" text-anchor="middle" font-size="5" opacity="0.55">施万细胞</text>

      <!-- 突触小体 -->
      <line x1="342" y1="50" x2="352" y2="35" stroke="var(--cmp-stroke,#37474f)" stroke-width="0.4"/>

    </g>
  </svg>
</div>

<script>
(() => {
  const root = document.currentScript?.previousElementSibling;
  if (!root || root.getAttribute("data-cmp-id") !== "bio.organ.neuron.basic") return;
  const labels = root.querySelector(".neuron__labels");

  function update() {
    let props = {};
    try { const r = root.getAttribute("data-props"); if (r) props = JSON.parse(r) || {}; } catch (e) {}
    if (labels) labels.style.display = props.showLabels === "off" ? "none" : "";
  }
  update();
  const obs = new MutationObserver(update);
  obs.observe(root, { attributes: true, attributeFilter: ["data-props"] });
  window.addEventListener("beforeunload", () => obs.disconnect(), { once: true });
})();
</script>

<style>
.cmp[data-cmp-id="bio.organ.neuron.basic"] {
  height: var(--cmp-size, 140px);
  width: calc(var(--cmp-size, 140px) * 360 / 140);
  display: inline-block;
}
.cmp[data-cmp-id="bio.organ.neuron.basic"] .neuron__svg {
  width: 100%; height: 100%; display: block; overflow: visible;
}
</style>
