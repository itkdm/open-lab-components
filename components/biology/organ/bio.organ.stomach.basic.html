<div class="cmp" data-cmp-id="bio.organ.stomach.basic" role="img" aria-label="胃部结构">
  <style>
    .cmp[data-cmp-id="bio.organ.stomach.basic"]{
      --h:var(--cmp-size,380px);display:inline-block;
      width:calc(var(--h)*400/380);height:var(--h);
      filter:drop-shadow(0 0 calc(8px*var(--cmp-glow,0)) rgba(244,143,177,calc(.7*var(--cmp-glow,0))));
      user-select:none;
    }
    .cmp[data-cmp-id="bio.organ.stomach.basic"] svg{width:100%;height:100%;display:block;overflow:visible}
    .cmp[data-cmp-id="bio.organ.stomach.basic"] .stm__label{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:10.5px;font-weight:600}
    .cmp[data-cmp-id="bio.organ.stomach.basic"] .stm__line{stroke:#546e7a;stroke-width:0.8;stroke-dasharray:2,2}
  </style>

  <svg viewBox="0 0 400 380" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <!-- 胃壁3D渐变 -->
      <radialGradient id="stm__gBody" cx="40%" cy="35%" r="60%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
        <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
      </radialGradient>
      <!-- 胃底高光 -->
      <radialGradient id="stm__gFundus" cx="35%" cy="30%" r="50%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.05"/>
      </radialGradient>
      <!-- 黏膜渐变 -->
      <linearGradient id="stm__gMucosa" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.1"/>

    </defs>

             stroke="var(--cmp-stroke,#37474f)" stroke-width="var(--cmp-stroke-width,1.2)"/>

  <script>
  (function(){
    var sc=document.currentScript;if(!sc)return;
    var root=sc.parentElement;
    if(!root||root.getAttribute('data-cmp-id')!=='bio.organ.stomach.basic')return;

    var P={};
    try{var r=root.getAttribute('data-props');if(r){var o=JSON.parse(r);if(o&&typeof o==='object')P=o;}}catch(e){}

    var animate=(P.animate!=='off');
    var showLabels=(P.showLabels!=='off');
    var labelsG=root.querySelector('.stm__labels');
    if(labelsG&&!showLabels)labelsG.style.display='none';

    if(!animate)return;

    var rugae=root.querySelector('.stm__rugae');
    var wall=root.querySelector('.stm__wall');
    if(!rugae&&!wall)return;

    var rugaePaths=rugae?rugae.querySelectorAll('path'):[];
    var phase=0;
    var animId=0;
    var lastT=0;

    function tick(t){
      if(!lastT)lastT=t;
      var dt=(t-lastT)/1000;
      lastT=t;
      phase+=dt*0.4; /* slow peristalsis ~0.4 Hz */
      if(phase>1)phase-=1;

      var wave=Math.sin(phase*Math.PI*2);

      /* Subtle wall deformation — scale the body slightly */
      if(wall){
        var sx=1+wave*0.008;
        var sy=1-wave*0.006;
        wall.setAttribute('transform',
          'translate('+(200*(1-sx))+','+(200*(1-sy))+') scale('+sx+','+sy+')');
      }

      /* Animate rugae — shift each fold with phase offset */
      for(var i=0;i<rugaePaths.length;i++){
        var offset=Math.sin((phase+i*0.18)*Math.PI*2)*3;
        rugaePaths[i].setAttribute('transform','translate('+offset+',0)');
      }

      /* Emit event */
      root.dispatchEvent(new CustomEvent('cmp:change',{bubbles:true,composed:true,
        detail:{id:root.getAttribute('data-cmp-id'),type:'peristalsis',
          values:{phase:Math.round(phase*100)/100}}}));

      animId=requestAnimationFrame(tick);
    }

    animId=requestAnimationFrame(tick);

    /* Props observer */
    var obs=new MutationObserver(function(){
      var P2={};
      try{var r2=root.getAttribute('data-props');if(r2){var o2=JSON.parse(r2);if(o2&&typeof o2==='object')P2=o2;}}catch(e){}
      var newAnimate=(P2.animate!=='off');
      if(!newAnimate&&animId){cancelAnimationFrame(animId);animId=0;}
      if(newAnimate&&!animId){lastT=0;animId=requestAnimationFrame(tick);}
      var newLabels=(P2.showLabels!=='off');
      if(labelsG)labelsG.style.display=newLabels?'':'none';
    });
    obs.observe(root,{attributes:true,attributeFilter:['data-props','style']});

    window.addEventListener('beforeunload',function(){
      cancelAnimationFrame(animId);obs.disconnect();
    });
  })();
  </script>
