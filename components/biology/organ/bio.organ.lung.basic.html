<div class="cmp" data-cmp-id="bio.organ.lung.basic" role="img" aria-label="肺部结构">
  <style>
    .cmp[data-cmp-id="bio.organ.lung.basic"]{
      --h:var(--cmp-size,400px);display:inline-block;
      width:calc(var(--h)*420/400);height:var(--h);
      filter:drop-shadow(0 0 calc(8px*var(--cmp-glow,0)) rgba(239,154,154,calc(.7*var(--cmp-glow,0))));
      user-select:none;
    }
    .cmp[data-cmp-id="bio.organ.lung.basic"] svg{width:100%;height:100%;display:block;overflow:visible}
    .cmp[data-cmp-id="bio.organ.lung.basic"] .lung__label{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:11px;font-weight:600}
    .cmp[data-cmp-id="bio.organ.lung.basic"] .lung__line{stroke:#546e7a;stroke-width:0.8;stroke-dasharray:2,2}
  </style>

  <svg viewBox="0 0 420 400" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <linearGradient id="lung__gL" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.1"/>
      </linearGradient>
      <linearGradient id="lung__gR" x1="1" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.1"/>

        <stop offset="100%" stop-color="#000000" stop-opacity="0.05"/>

    </defs>

      <!-- 气管软骨环 -->

      <line x1="198" y1="42" x2="222" y2="42" stroke="var(--cmp-stroke,#37474f)" stroke-width="0.6" opacity="0.4"/>
      <line x1="198" y1="54" x2="222" y2="54" stroke="var(--cmp-stroke,#37474f)" stroke-width="0.6" opacity="0.4"/>
      <line x1="198" y1="66" x2="222" y2="66" stroke="var(--cmp-stroke,#37474f)" stroke-width="0.6" opacity="0.4"/>

      <path d="M305,200 Q315,230 310,260" fill="none"

      <path d="M270,210 Q280,240 285,270" fill="none"

    </g>

      <circle cx="125" cy="175" r="5" fill="var(--cmp-lung,#ef9a9a)" stroke="var(--cmp-stroke,#37474f)" stroke-width="0.5" opacity="0.4"/>
      <circle cx="100" cy="260" r="6" fill="var(--cmp-lung,#ef9a9a)" stroke="var(--cmp-stroke,#37474f)" stroke-width="0.5" opacity="0.4"/>

      <path class="lung__rpath-hl" d="M225,90 Q250,85 290,110 Q345,155 355,220 Q365,290 330,330 Q300,360 250,355 Q225,350 220,320 L220,90 Z"

      <!-- 肺叶分界线（右肺三叶） -->
      <path d="M340,185 Q280,170 220,200" fill="none"

      <path d="M335,260 Q280,245 220,270" fill="none"

      <!-- 肺泡示意 -->
      <circle cx="310" cy="170" r="6" fill="var(--cmp-lung,#ef9a9a)" stroke="var(--cmp-stroke,#37474f)" stroke-width="0.5" opacity="0.4"/>
      <circle cx="295" cy="175" r="5" fill="var(--cmp-lung,#ef9a9a)" stroke="var(--cmp-stroke,#37474f)" stroke-width="0.5" opacity="0.4"/>
      <circle cx="320" cy="230" r="6" fill="var(--cmp-lung,#ef9a9a)" stroke="var(--cmp-stroke,#37474f)" stroke-width="0.5" opacity="0.4"/>

  <script>
  (function(){
    var sc=document.currentScript;if(!sc)return;
    var root=sc.parentElement;
    if(!root||root.getAttribute('data-cmp-id')!=='bio.organ.lung.basic')return;

    var P={};
    try{var r=root.getAttribute('data-props');if(r){var o=JSON.parse(r);if(o&&typeof o==='object')P=o;}}catch(e){}

    var breathe=(P.breathe!=='off');
    var showLabels=(P.showLabels!=='off');
    var labelsG=root.querySelector('.lung__labels');
    if(labelsG&&!showLabels)labelsG.style.display='none';

    if(!breathe)return;

    var leftLung=root.querySelector('.lung__left');
    var rightLung=root.querySelector('.lung__right');
    var diaphragm=root.querySelector('.lung__diaphragm');
    if(!leftLung||!rightLung)return;

    var phase=0;
    var animId=0;
    var lastT=0;

    function tick(t){
      if(!lastT)lastT=t;
      var dt=(t-lastT)/1000;
      lastT=t;
      phase+=dt*0.8; /* ~0.8 Hz breathing rate */

      var s=Math.sin(phase*Math.PI*2);
      var vol=(s+1)/2; /* 0..1 */
      var scale=1+s*0.035; /* subtle 3.5% expansion */
      var ty=s*3; /* slight vertical shift */

      /* Scale lungs from center */
      leftLung.setAttribute('transform',
        'translate('+(-132*(scale-1))+','+(-220*(scale-1)+ty)+') scale('+scale+')');
      rightLung.setAttribute('transform',
        'translate('+(-222*(scale-1))+','+(-220*(scale-1)+ty)+') scale('+scale+')');

      /* Diaphragm moves down on inhale */
      if(diaphragm){
        var diaY=s*8;
        diaphragm.setAttribute('transform','translate(0,'+diaY+')');
      }

      /* Emit event */
      root.dispatchEvent(new CustomEvent('cmp:change',{bubbles:true,composed:true,
        detail:{id:root.getAttribute('data-cmp-id'),type:'breathe',
          values:{phase:s>0?'inhale':'exhale',volume:Math.round(vol*100)/100}}}));

      animId=requestAnimationFrame(tick);
    }

    animId=requestAnimationFrame(tick);

    /* Props observer */
    var obs=new MutationObserver(function(){
      var P2={};
      try{var r2=root.getAttribute('data-props');if(r2){var o2=JSON.parse(r2);if(o2&&typeof o2==='object')P2=o2;}}catch(e){}
      var newBreathe=(P2.breathe!=='off');
      if(!newBreathe&&animId){cancelAnimationFrame(animId);animId=0;}
      if(newBreathe&&!animId){lastT=0;animId=requestAnimationFrame(tick);}
      var newLabels=(P2.showLabels!=='off');
      if(labelsG)labelsG.style.display=newLabels?'':'none';
    });
    obs.observe(root,{attributes:true,attributeFilter:['data-props','style']});

    window.addEventListener('beforeunload',function(){
      cancelAnimationFrame(animId);obs.disconnect();
    });
  })();
  </script>
</div>
