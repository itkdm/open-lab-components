<script>
(function(){
  var sc = document.currentScript; if (!sc) return;
  var root = sc.previousElementSibling;

  var NS = 'http://www.w3.org/2000/svg';
  var uid = 'ps_' + Math.random().toString(36).slice(2, 8) + '_';

  /* --- Colors (fallback from CSS vars) --- */
  var C = {

    o2: '#ef5350', co2: '#78909c', glucose: '#ff9800', stroke: '#37474f'
  };

  /* --- Helpers --- */
  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);

  }
  function txt(x, y, text, attrs, parent) {

    if (attrs) for (var k in attrs) a[k] = attrs[k];

    t.textContent = text;
    return t;
  }

  /* ============================================================
     DEFS — all gradients, markers, filters use uid prefix
     ============================================================ */
  var defs = el('defs', null, svg);

  /* Sun radial gradient */
  var gSun = el('radialGradient', { id: uid + 'sun', cx: '0.3', cy: '0.3', r: '0.7' }, defs);
  el('stop', { offset: '0', 'stop-color': '#fff9c4' }, gSun);
  el('stop', { offset: '1', 'stop-color': C.light }, gSun);

  /* Thylakoid gradient */
  var gThy = el('linearGradient', { id: uid + 'thy', x1: '0', y1: '0', x2: '0', y2: '1' }, defs);
  el('stop', { offset: '0', 'stop-color': '#4caf50' }, gThy);
  el('stop', { offset: '1', 'stop-color': '#2e7d32' }, gThy);

  /* Arrow markers */
  function makeMarker(name, color) {
    var m = el('marker', {
      id: uid + name, markerWidth: '8', markerHeight: '6', refX: '7', refY: '3', orient: 'auto'
    }, defs);

  }
  makeMarker('arrW', C.water);
  makeMarker('arrO2', C.o2);
  makeMarker('arrCO2', C.co2);
  makeMarker('arrGlu', C.glucose);
  makeMarker('arrPur', '#7b1fa2');
  makeMarker('arrCalvin', '#e65100');

  /* ============================================================
     STATIC STRUCTURE
     ============================================================ */

  /* Background regions */
  el('rect', { x: 25, y: 30, width: 265, height: 310, rx: 14, fill: '#e8f5e9', stroke: 'none', opacity: '0.45' }, svg);
  el('rect', { x: 310, y: 30, width: 265, height: 310, rx: 14, fill: '#fff3e0', stroke: 'none', opacity: '0.45' }, svg);

  /* Chloroplast outer membrane */
  el('ellipse', { cx: 300, cy: 195, rx: 270, ry: 160, fill: 'none', stroke: C.chloro, 'stroke-width': '2.5', 'stroke-dasharray': '8,4', opacity: '0.5' }, svg);

  /* ---- Thylakoid stack (granum) ---- */
  var thyX = 80, thyW = 130, thyH = 18, thyGap = 4, thyCount = 5;
  var thyStartY = 110;
  for (var i = 0; i < thyCount; i++) {
    var ty = thyStartY + i * (thyH + thyGap);
    el('rect', {
      x: thyX, y: ty, width: thyW, height: thyH, rx: 9,
      fill: 'url(#' + uid + 'thy)', stroke: '#2e7d32', 'stroke-width': '0.8'
    }, svg);
  }
  /* Thylakoid connecting stroma lamellae */
  var thyEndY = thyStartY + (thyCount - 1) * (thyH + thyGap) + thyH;
  el('rect', { x: thyX + thyW + 4, y: thyStartY + 8, width: 6, height: thyEndY - thyStartY - 16, rx: 3, fill: '#66bb6a', opacity: '0.5' }, svg);

  /* ---- Sun ---- */
  el('circle', { cx: 42, cy: 22, r: 20, fill: 'url(#' + uid + 'sun)', stroke: '#f9a825', 'stroke-width': '1' }, svg);
  /* Sun rays */
  var rays = [
    [62, 30, 80, thyStartY - 2],
    [52, 40, 95, thyStartY + 10],
    [58, 38, 115, thyStartY + 5],
    [48, 42, 85, thyStartY + 25]
  ];
  rays.forEach(function(r) {
    el('line', { x1: r[0], y1: r[1], x2: r[2], y2: r[3], stroke: C.light, 'stroke-width': '2', 'stroke-linecap': 'round', opacity: '0.7' }, svg);
  });

  /* ---- Calvin cycle ring ---- */
  var calvinCX = 440, calvinCY = 190, calvinR = 75;
  el('circle', { cx: calvinCX, cy: calvinCY, r: calvinR, fill: 'none', stroke: '#ffe0b2', 'stroke-width': '12', opacity: '0.3' }, svg);
  el('circle', { cx: calvinCX, cy: calvinCY, r: calvinR, fill: 'none', stroke: '#ff9800', 'stroke-width': '2', 'stroke-dasharray': '6,3', opacity: '0.5' }, svg);
  /* Calvin cycle arrows — 4 arcs with arrowheads */
  var cArcs = [
    'M' + calvinCX + ',' + (calvinCY - calvinR) + ' A' + calvinR + ',' + calvinR + ' 0 0,1 ' + (calvinCX + calvinR) + ',' + calvinCY,
    'M' + (calvinCX + calvinR) + ',' + calvinCY + ' A' + calvinR + ',' + calvinR + ' 0 0,1 ' + calvinCX + ',' + (calvinCY + calvinR),
    'M' + calvinCX + ',' + (calvinCY + calvinR) + ' A' + calvinR + ',' + calvinR + ' 0 0,1 ' + (calvinCX - calvinR) + ',' + calvinCY,
    'M' + (calvinCX - calvinR) + ',' + calvinCY + ' A' + calvinR + ',' + calvinR + ' 0 0,1 ' + calvinCX + ',' + (calvinCY - calvinR)
  ];
  cArcs.forEach(function(d) {
    el('path', { d: d, fill: 'none', stroke: '#e65100', 'stroke-width': '2', 'marker-end': 'url(#' + uid + 'arrCalvin)' }, svg);
  });

  /* ---- Flow arrows ---- */
  /* H₂O → thylakoid (from bottom-left upward into thylakoid area) */
  el('path', {
    d: 'M55,310 C55,280 90,250 100,' + (thyEndY + 5),
    fill: 'none', stroke: C.water, 'stroke-width': '2', 'marker-end': 'url(#' + uid + 'arrW)'
  }, svg);

  /* O₂ ← thylakoid (from thylakoid area upward to top-left) */
  el('path', {
    d: 'M180,' + thyStartY + ' C180,' + (thyStartY - 25) + ' 210,' + (thyStartY - 45) + ' 230,55',
    fill: 'none', stroke: C.o2, 'stroke-width': '2', 'marker-end': 'url(#' + uid + 'arrO2)'
  }, svg);

  /* ATP arrow: thylakoid → Calvin */
  el('path', {
    d: 'M215,150 L355,150',
    fill: 'none', stroke: '#7b1fa2', 'stroke-width': '2', 'stroke-dasharray': '5,3', 'marker-end': 'url(#' + uid + 'arrPur)'
  }, svg);
  /* NADPH arrow: thylakoid → Calvin */
  el('path', {
    d: 'M215,200 L355,200',
    fill: 'none', stroke: '#7b1fa2', 'stroke-width': '2', 'stroke-dasharray': '5,3', 'marker-end': 'url(#' + uid + 'arrPur)'
  }, svg);

  /* CO₂ → Calvin (from top-right downward into Calvin cycle) */
  el('path', {
    d: 'M520,50 C500,70 475,90 ' + calvinCX + ',' + (calvinCY - calvinR + 5),
    fill: 'none', stroke: C.co2, 'stroke-width': '2', 'marker-end': 'url(#' + uid + 'arrCO2)'
  }, svg);

  /* Glucose ← Calvin (from Calvin cycle downward-right out) */
  el('path', {
    d: 'M' + (calvinCX + 40) + ',' + (calvinCY + calvinR - 10) + ' C' + (calvinCX + 60) + ',' + (calvinCY + calvinR + 20) + ' 530,300 540,320',
    fill: 'none', stroke: C.glucose, 'stroke-width': '2.5', 'marker-end': 'url(#' + uid + 'arrGlu)'
  }, svg);

  /* ---- Particle layer ---- */
  var particlesG = el('g', null, svg);

  /* ============================================================
     LABELS
     ============================================================ */
  var labelsG = el('g', null, svg);

  /* Region titles */
  txt(155, 48, '光反应', { 'text-anchor': 'middle', 'font-size': '14', 'font-weight': 'bold', fill: '#2e7d32' }, labelsG);
  txt(calvinCX, 48, '暗反应（Calvin循环）', { 'text-anchor': 'middle', 'font-size': '14', 'font-weight': 'bold', fill: '#e65100' }, labelsG);

  /* Substance labels */
  txt(35, 325, 'H₂O', { 'font-size': '11', fill: C.water, 'font-weight': '600' }, labelsG);
  txt(235, 50, 'O₂↑', { 'font-size': '11', fill: C.o2, 'font-weight': '600' }, labelsG);
  txt(525, 42, 'CO₂', { 'font-size': '11', fill: C.co2, 'font-weight': '600' }, labelsG);
  txt(545, 335, 'C₆H₁₂O₆', { 'font-size': '11', fill: C.glucose, 'font-weight': '600' }, labelsG);

  /* ATP / NADPH */
  txt(275, 143, 'ATP', { 'text-anchor': 'middle', 'font-size': '10', fill: '#7b1fa2', 'font-weight': '600' }, labelsG);
  txt(275, 215, 'NADPH', { 'text-anchor': 'middle', 'font-size': '10', fill: '#7b1fa2', 'font-weight': '600' }, labelsG);

  /* Structure labels */
  txt(thyX + thyW / 2, thyStartY - 8, '类囊体（基粒）', { 'text-anchor': 'middle', 'font-size': '9', fill: '#1b5e20' }, labelsG);

  txt(calvinCX, calvinCY + 10, '循环', { 'text-anchor': 'middle', 'font-size': '10', fill: '#e65100' }, labelsG);
  txt(300, 355, '基质（叶绿体基质）', { 'text-anchor': 'middle', 'font-size': '9', fill: '#546e7a' }, labelsG);

  labelsG.style.display = showLabels ? '' : 'none';

  el('rect', { x: 110, y: 388, width: 380, height: 26, rx: 5, fill: 'rgba(255,255,255,0.92)', stroke: C.stroke, 'stroke-width': '0.5' }, eqG);
  txt(300, 406, '6CO₂ + 6H₂O  →  C₆H₁₂O₆ + 6O₂', { 'text-anchor': 'middle', 'font-size': '11', fill: C.stroke, 'font-weight': '600' }, eqG);
  txt(300, 393, '光能', { 'text-anchor': 'middle', 'font-size': '7.5', fill: C.light }, eqG);

  eqG.style.display = showEquation ? '' : 'none';

  /* ============================================================

     ============================================================ */
  var particles = [];
  function Particle(type, x, y, vx, vy, life) {
    this.type = type; this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life; this.el = null;
  }

  /* Photon: from sun → thylakoid */
  function spawnPhoton() {
    var sx = 42 + Math.random() * 20;
    var sy = 22 + Math.random() * 15;
    var tx = thyX + Math.random() * thyW;
    var ty = thyStartY + Math.random() * (thyEndY - thyStartY);

    particles.push(new Particle('photon', sx, sy, dx / d * sp, dy / d * sp, d / sp));
  }

  function spawnO2() {
    var x = thyX + 20 + Math.random() * (thyW - 40);

    var sx = 510 + Math.random() * 20;
    var sy = 45 + Math.random() * 10;

    var ty = calvinCY + (Math.random() - 0.5) * 30;

    var d = Math.sqrt(dx * dx + dy * dy);

      attrs = { r: '4', fill: C.o2, opacity: '0.75' };
    } else if (p.type === 'co2') {
      attrs = { r: '3.5', fill: C.co2, opacity: '0.7' };
    }
    p.el = el('circle', attrs, particlesG);
  }

  var time = 0, spawnTimer = 0;
  var animId = 0, lastT = 0;

  function tick(t) {
    if (!lastT) lastT = t;
    var dt = Math.min((t - lastT) / 1000, 0.05);
    lastT = t;
    time += dt;
    spawnTimer += dt;

    if (spawnTimer > 0.35 / speed) {
      spawnTimer = 0;
      spawnPhoton();
      if (Math.random() < 0.35) spawnO2();
      if (Math.random() < 0.25) spawnCO2();
    }

    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      if (!p.el) initParticleEl(p);
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) {
        if (p.el && p.el.parentNode) p.el.parentNode.removeChild(p.el);
        particles.splice(i, 1);
        continue;
      }
      var alpha = Math.min(1, p.life / p.maxLife * 2);
      p.el.setAttribute('cx', p.x);
      p.el.setAttribute('cy', p.y);
      p.el.setAttribute('opacity', alpha * 0.85);
    }

  }

  if (running) animId = requestAnimationFrame(tick);

  /* Click to pause/resume */
  root.addEventListener('click', function() {
    running = !running;

    else { cancelAnimationFrame(animId); animId = 0; }
