<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="查看 Open Lab Components 教学图片详情，支持下载图片和滚轮缩放查看。">
  <meta name="keywords" content="Open Lab Components,教学图片,图片详情,AI提示词,图片下载">
  <meta name="author" content="布吉岛(itkdm)">
  <meta name="robots" content="index, follow">
  <meta name="language" content="zh-CN">
  <link rel="canonical" href="https://itkdm.github.io/open-lab-components/visual-detail.html">
  <link rel="icon" type="image/png" href="./logo.png">
  <title>图片详情 - Open Lab Components</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #059669;
      --primary-hover: #047857;
      --bg: #eff4ee;
      --surface: #ffffff;
      --border: #d1d5db;
      --border-light: #e5e7eb;
      --text-primary: #1f2937;
      --text-secondary: #4b5563;
      --text-tertiary: #6b7280;
      --accent: #10b981;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --radius: 0.75rem;
      --radius-sm: 0.5rem;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", "Roboto", "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    header {
      position: sticky;
      top: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border-light);
      z-index: 100;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
    }

    .header-content {
      width: 100%;
      padding: 0 2rem;
      height: 64px;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .back-btn,
    .lang-btn,
    .action-btn {
      padding: 0.5rem 0.875rem;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      text-decoration: none;
      color: var(--text-primary);
      font-size: 0.875rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      line-height: 1.1;
      cursor: pointer;
      transition: all 0.2s;
    }

    .back-btn:hover,
    .lang-btn:hover,
    .action-btn:hover {
      background: var(--bg);
      border-color: var(--primary);
      color: var(--primary);
    }

    .action-btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .action-btn.primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
      color: #fff;
    }

    .lang-btn {
      margin-left: auto;
    }

    .header-info {
      flex: 1;
      min-width: 0;
      padding: 0 0.5rem;
    }

    .header-info h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.125rem;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-info p {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .container {
      display: flex;
      height: calc(100vh - 64px);
      position: relative;
      z-index: 1;
    }

    .preview-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      min-width: 0;
      overflow: hidden;
    }

    .preview-content {
      flex: 1;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      background: var(--bg);
      overflow: auto;
      position: relative;
    }

    .preview-frame {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 2rem;
    }

    .preview-surface {
      width: 100%;
      height: 100%;
      min-height: 360px;
      background: transparent;
      overflow: auto;
      position: relative;
    }

    .preview-canvas {
      min-width: 100%;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .preview-surface img {
      display: block;
      background: transparent;
      box-shadow: none;
    }

    .controls-pane {
      width: 400px;
      background: var(--surface);
      overflow-y: auto;
      border-left: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
    }

    .controls-content {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
    }

    .controls-footer {
      border-top: 1px solid var(--border-light);
      padding: 1.5rem;
      background: var(--surface);
      position: sticky;
      bottom: 0;
    }

    .control-group {
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-light);
    }

    .control-group:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .control-group h3 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.875rem;
      color: var(--text-primary);
    }

    .meta-list {
      display: grid;
      gap: 0.75rem;
    }

    .meta-row {
      display: grid;
      gap: 0.25rem;
    }

    .meta-label {
      font-size: 0.75rem;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 700;
    }

    .meta-value {
      font-size: 0.9375rem;
      color: var(--text-primary);
      word-break: break-word;
    }

    .tags {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .tag {
      padding: 0.25rem 0.5rem;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 0.375rem;
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 500;
    }

    .code-block {
      background: #0f172a;
      color: #e2e8f0;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid #1e293b;
    }

    .code-block-header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 0.75rem 1rem;
      background: #111827;
      border-bottom: 1px solid #1e293b;
    }

    .code-copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.375rem 0.625rem;
      border-radius: 0.375rem;
      border: 1px solid #334155;
      background: transparent;
      color: #e2e8f0;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .code-copy-btn svg {
      width: 14px;
      height: 14px;
    }

    .code-block code {
      display: block;
      white-space: pre-wrap;
      word-break: break-word;
      padding: 1rem;
      font-size: 0.8125rem;
      line-height: 1.6;
      font-family: Consolas, Monaco, "Courier New", monospace;
    }

    .empty-state {
      padding: 3rem 1rem;
      text-align: center;
      color: var(--text-secondary);
    }

    .empty-state-icon {
      font-size: 2rem;
      margin-bottom: 0.75rem;
      opacity: 0.6;
    }

    @media (max-width: 960px) {
      body {
        overflow: auto;
      }

      .container {
        flex-direction: column;
        height: auto;
      }

      .controls-pane {
        width: 100%;
        border-left: none;
        border-top: 1px solid var(--border-light);
      }

      .preview-pane {
        min-height: 50vh;
      }
    }

    @media (max-width: 768px) {
      .header-content {
        padding: 0 1rem;
        flex-wrap: wrap;
        height: auto;
        min-height: 64px;
        padding-top: 0.75rem;
        padding-bottom: 0.75rem;
      }

      .lang-btn {
        margin-left: 0;
      }

      .header-info {
        order: 3;
        width: 100%;
        padding: 0;
      }

      .preview-frame {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <a href="./visuals.html" class="back-btn" id="backBtn" onclick="return goBack(event)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"></path>
        </svg>
        <span data-i18n="back">返回</span>
      </a>
      <button id="langToggle" class="lang-btn" type="button">English</button>
      <div class="header-info">
        <h1 id="visualName">加载中...</h1>
        <p id="visualMeta"></p>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="preview-pane">
      <div class="preview-content">
        <div class="preview-frame">
          <div class="preview-surface">
            <div class="preview-canvas">
              <img id="previewImage" alt="">
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="controls-pane">
      <div class="controls-content">
        <div id="details">
          <div class="empty-state">
            <div class="empty-state-icon">🖼️</div>
            <p data-i18n="loading-details">加载图片详情中...</p>
          </div>
        </div>
      </div>

      <div class="controls-footer">
        <div class="control-group" style="margin-bottom: 0; padding-bottom: 0; border-bottom: none;">
          <h3 data-i18n="prompt-title">AI 生图提示词</h3>
          <div class="code-block">
            <div class="code-block-header">
              <button class="code-copy-btn" id="codeCopyBtn" type="button" onclick="copyPrompt()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                <span data-i18n="btn-copy">复制</span>
              </button>
            </div>
            <code id="promptOutput">加载中...</code>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function goBack(event) {
      if (window.history.length > 1 && document.referrer && document.referrer.indexOf(location.origin) === 0) {
        event.preventDefault();
        window.history.back();
        return false;
      }
      return true;
    }

    const LANG_KEY = "olc-lang";
    const urlParams = new URLSearchParams(window.location.search);
    const visualId = urlParams.get("id");
    let currentItem = null;
    let zoomScale = 1;
    let fitWidth = 0;
    let fitHeight = 0;

    const i18n = {
      zh: {
        "back": "返回",
        "loading-details": "加载图片详情中...",
        "loading": "加载中...",
        "prompt-title": "AI 生图提示词",
        "btn-copy": "复制",
        "copy-success": "已复制",
        "copy-fail": "复制失败",
        "download": "下载图片",
        "open-original": "打开原图",
        "meta-subject": "学科",
        "meta-type": "分类",
        "meta-size": "尺寸",
        "meta-grades": "适用学段",
        "meta-tags": "标签",
        "not-found-title": "图片未找到",
        "not-found-desc": "请检查图片 ID 是否正确。",
        "need-id-title": "请指定图片 ID",
        "need-id-desc": "请在 URL 中添加 ?id=图片ID",
        "lang-label": "English"
      },
      en: {
        "back": "Back",
        "loading-details": "Loading visual details...",
        "loading": "Loading...",
        "prompt-title": "AI Image Prompt",
        "btn-copy": "Copy",
        "copy-success": "Copied",
        "copy-fail": "Copy failed",
        "download": "Download Image",
        "open-original": "Open Original",
        "meta-subject": "Subject",
        "meta-type": "Category",
        "meta-size": "Size",
        "meta-grades": "Grade Range",
        "meta-tags": "Tags",
        "not-found-title": "Visual not found",
        "not-found-desc": "Please check whether the visual ID is correct.",
        "need-id-title": "Visual ID required",
        "need-id-desc": "Please append ?id=visualId in the URL.",
        "lang-label": "中文"
      }
    };

    function resolveInitialLang() {
      const queryLang = (urlParams.get("lang") || "").toLowerCase();
      if (queryLang === "en") return "en";
      if (queryLang === "zh" || queryLang === "zh-cn") return "zh";
      const stored = (localStorage.getItem(LANG_KEY) || "").toLowerCase();
      if (stored === "en") return "en";
      if (stored === "zh" || stored === "zh-cn") return "zh";
      return (navigator.language || "").toLowerCase().startsWith("en") ? "en" : "zh";
    }

    let currentLang = resolveInitialLang();
    let taxonomyData = {
      subjects: {},
      types: {},
      grades: {},
      originTypes: {},
      thumbnailModes: {}
    };

    function t(key) {
      return i18n[currentLang]?.[key] ?? i18n.zh[key] ?? key;
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function localizeSubject(subject) {
      return taxonomyData.subjects?.[subject] || subject;
    }

    function localizeType(type) {
      return taxonomyData.types?.[type] || type;
    }

    function localizeGradeRange(values) {
      if (!Array.isArray(values) || !values.length) return "-";
      return values.map((value) => {
        return taxonomyData.grades?.[value] || value;
      }).join(currentLang === "en" ? ", " : "、");
    }

    function resolveLocaleFile() {
      return currentLang === "en" ? "en" : "zh-CN";
    }

    function getAssetFilename(assetPath, id) {
      const clean = String(assetPath || "").split("/").pop() || "";
      return clean || `${id || "visual"}.asset`;
    }

    function applyStaticTexts() {
      document.querySelectorAll("[data-i18n]").forEach((element) => {
        element.textContent = t(element.getAttribute("data-i18n"));
      });
      const langBtn = document.getElementById("langToggle");
      if (langBtn) langBtn.textContent = t("lang-label");
    }

    function setHeader(item) {
      const name = item ? item.title : t("loading");
      const meta = item ? `${localizeSubject(item.subject)} · ${localizeType(item.type)}` : "";
      document.getElementById("visualName").textContent = name;
      document.getElementById("visualMeta").textContent = meta;
      document.title = item ? `${item.title} - Open Lab Components` : "图片详情 - Open Lab Components";
    }

    function renderEmpty(title, desc) {
      setHeader(null);
      document.querySelector(".controls-footer").style.display = "none";
      document.getElementById("details").innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">⚠️</div>
          <h3>${title}</h3>
          <p>${desc}</p>
        </div>
      `;
      document.getElementById("promptOutput").textContent = "";
    }

    async function loadVisual() {
      if (!visualId) {
        renderEmpty(t("need-id-title"), t("need-id-desc"));
        return;
      }

      try {
        const locale = resolveLocaleFile();
        const [response, taxonomyResponse] = await Promise.all([
          fetch(`./registry/visuals.${locale}.json`),
          fetch(`./registry/visual-taxonomy.${locale}.json`)
        ]);
        const payload = await response.json();
        const taxonomyPayload = await taxonomyResponse.json();
        const items = Array.isArray(payload.items) ? payload.items : [];
        if (taxonomyPayload && typeof taxonomyPayload === "object") {
          taxonomyData = taxonomyPayload;
        }
        currentItem = items.find((item) => item.id === visualId) || null;
        if (!currentItem) {
          renderEmpty(t("not-found-title"), t("not-found-desc"));
          return;
        }
        renderVisual();
      } catch (_error) {
        renderEmpty(t("not-found-title"), t("not-found-desc"));
      }
    }

    function renderVisual() {
      const item = currentItem;
      const sizeText = item.size && item.size.width && item.size.height
        ? `${item.size.width} × ${item.size.height}`
        : "-";
      const assetFilename = getAssetFilename(item.assetPath, item.id);

      setHeader(item);
      const previewImage = document.getElementById("previewImage");
      previewImage.src = `./${item.assetPath}`;
      previewImage.alt = item.title;
      document.getElementById("promptOutput").textContent = item.aiPrompt || "";
      document.getElementById("codeCopyBtn").style.display = item.aiPrompt ? "inline-flex" : "none";
      document.querySelector(".controls-footer").style.display = item.aiPrompt ? "block" : "none";
      zoomScale = 1;

      document.getElementById("details").innerHTML = `
        <div class="control-group" style="display:flex; gap:0.75rem; flex-wrap:wrap;">
          <a class="action-btn primary" href="./${item.assetPath}" download="${escapeHtml(assetFilename)}">${t("download")}</a>
          <a class="action-btn" href="./${item.assetPath}" target="_blank" rel="noopener">${t("open-original")}</a>
        </div>

        <div class="control-group">
          <h3>${t("meta-type")}</h3>
          <div class="meta-list">
            <div class="meta-row">
              <div class="meta-label">${t("meta-subject")}</div>
              <div class="meta-value">${escapeHtml(localizeSubject(item.subject))}</div>
            </div>
            <div class="meta-row">
              <div class="meta-label">${t("meta-type")}</div>
              <div class="meta-value">${escapeHtml(localizeType(item.type))}</div>
            </div>
            <div class="meta-row">
              <div class="meta-label">${t("meta-size")}</div>
              <div class="meta-value">${escapeHtml(sizeText)}</div>
            </div>
            <div class="meta-row">
              <div class="meta-label">${t("meta-grades")}</div>
              <div class="meta-value">${escapeHtml(localizeGradeRange(item.gradeRange))}</div>
            </div>
          </div>
        </div>

        <div class="control-group">
          <h3>${t("meta-tags")}</h3>
          <div class="tags">
            ${(item.tags || []).length
              ? item.tags.map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join("")
              : `<span class="meta-value">-</span>`
            }
          </div>
        </div>
      `;

      setupZoom();
    }

    async function copyPrompt() {
      const text = (currentItem && currentItem.aiPrompt) || "";
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        const btn = document.getElementById("codeCopyBtn");
        const label = btn.querySelector("span");
        label.textContent = t("copy-success");
        setTimeout(() => {
          label.textContent = t("btn-copy");
        }, 1200);
      } catch (_error) {
        alert(t("copy-fail"));
      }
    }

    function updateZoom() {
      const previewImage = document.getElementById("previewImage");
      if (!previewImage || !fitWidth || !fitHeight) return;
      previewImage.style.width = `${Math.round(fitWidth * zoomScale)}px`;
      previewImage.style.height = `${Math.round(fitHeight * zoomScale)}px`;
    }

    function setupZoom() {
      const surface = document.querySelector(".preview-surface");
      const image = document.getElementById("previewImage");
      if (!surface || !image) return;

      const refreshFit = () => {
        const naturalWidth = image.naturalWidth || currentItem?.size?.width || 1200;
        const naturalHeight = image.naturalHeight || currentItem?.size?.height || 675;
        const maxWidth = Math.max(160, surface.clientWidth - 48);
        const maxHeight = Math.max(160, surface.clientHeight - 48);
        const ratio = Math.min(maxWidth / naturalWidth, maxHeight / naturalHeight, 1);
        fitWidth = naturalWidth * ratio;
        fitHeight = naturalHeight * ratio;
        updateZoom();
      };

      if (image.complete) {
        refreshFit();
      } else {
        image.onload = refreshFit;
      }

      surface.onwheel = (event) => {
        event.preventDefault();
        const nextScale = event.deltaY < 0 ? zoomScale * 1.12 : zoomScale / 1.12;
        zoomScale = Math.min(6, Math.max(0.4, nextScale));
        updateZoom();
      };

      window.onresize = () => {
        zoomScale = Math.max(1, zoomScale);
        refreshFit();
      };
    }

    function switchLang() {
      currentLang = currentLang === "zh" ? "en" : "zh";
      localStorage.setItem(LANG_KEY, currentLang);
      urlParams.set("lang", currentLang);
      window.location.search = urlParams.toString();
    }

    document.getElementById("langToggle").addEventListener("click", switchLang);

    applyStaticTexts();
    loadVisual();
  </script>
</body>
</html>
