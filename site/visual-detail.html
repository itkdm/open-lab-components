<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="查看 Open Lab Components 教学图片详情，支持放大预览、下载图片和查看 AI 生图提示词。">
  <meta name="keywords" content="Open Lab Components,教学图片,图片详情,AI提示词,图片下载,图片放大">
  <meta name="author" content="布吉岛(itkdm)">
  <meta name="robots" content="index, follow">
  <meta name="language" content="zh-CN">
  <link rel="canonical" href="https://itkdm.github.io/open-lab-components/visual-detail.html">
  <link rel="icon" type="image/png" href="./logo.png">
  <title>图片详情 - Open Lab Components</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #059669;
      --primary-hover: #047857;
      --bg: #eff4ee;
      --surface: #ffffff;
      --border: #d1d5db;
      --border-light: #e5e7eb;
      --text-primary: #1f2937;
      --text-secondary: #4b5563;
      --text-tertiary: #6b7280;
      --accent: #10b981;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --radius: 0.75rem;
      --radius-sm: 0.5rem;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", "Roboto", "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    header {
      position: sticky;
      top: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border-light);
      z-index: 100;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
    }

    .header-content {
      width: 100%;
      padding: 0 2rem;
      height: 64px;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .back-btn,
    .lang-btn,
    .action-btn {
      padding: 0.5rem 0.875rem;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      text-decoration: none;
      color: var(--text-primary);
      font-size: 0.875rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      line-height: 1.1;
      cursor: pointer;
      transition: all 0.2s;
    }

    .back-btn:hover,
    .lang-btn:hover,
    .action-btn:hover {
      background: var(--bg);
      border-color: var(--primary);
      color: var(--primary);
    }

    .action-btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .action-btn.primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
      color: #fff;
    }

    .lang-btn {
      margin-left: auto;
    }

    .header-info {
      flex: 1;
      min-width: 0;
      padding: 0 0.5rem;
    }

    .header-info h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.125rem;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-info p {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .container {
      display: flex;
      height: calc(100vh - 64px);
      position: relative;
      z-index: 1;
    }

    .preview-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      min-width: 0;
      overflow: hidden;
    }

    .preview-content {
      flex: 1;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      padding: 0;
      background: var(--bg);
      overflow: auto;
      position: relative;
    }

    .preview-frame {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 100%;
      height: 100%;
      padding: 2rem;
    }

    .preview-surface {
      width: 100%;
      height: 100%;
      min-height: 360px;
      background: var(--surface);
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
    }

    .preview-surface img {
      max-width: 100%;
      max-height: 100%;
      display: block;
      object-fit: contain;
      background: #fff;
    }

    .controls-pane {
      width: 400px;
      background: var(--surface);
      overflow-y: auto;
      padding: 0;
      border-left: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
    }

    .controls-content {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
    }

    .controls-footer {
      border-top: 1px solid var(--border-light);
      padding: 1.5rem;
      background: var(--surface);
      position: sticky;
      bottom: 0;
    }

    .controls-pane::-webkit-scrollbar {
      width: 8px;
    }

    .controls-pane::-webkit-scrollbar-track {
      background: var(--bg);
    }

    .controls-pane::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .control-group {
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-light);
    }

    .control-group:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .control-group h3 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.875rem;
      color: var(--text-primary);
    }

    .meta-list {
      display: grid;
      gap: 0.75rem;
    }

    .meta-row {
      display: grid;
      gap: 0.25rem;
    }

    .meta-label {
      font-size: 0.75rem;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 700;
    }

    .meta-value {
      font-size: 0.9375rem;
      color: var(--text-primary);
      word-break: break-word;
    }

    .tags {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .tag {
      padding: 0.25rem 0.5rem;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 0.375rem;
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 500;
    }

    .code-block {
      background: #0f172a;
      color: #e2e8f0;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid #1e293b;
    }

    .code-block-header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 0.75rem 1rem;
      background: #111827;
      border-bottom: 1px solid #1e293b;
    }

    .code-copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.375rem 0.625rem;
      border-radius: 0.375rem;
      border: 1px solid #334155;
      background: transparent;
      color: #e2e8f0;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .code-copy-btn svg {
      width: 14px;
      height: 14px;
    }

    .code-block code {
      display: block;
      white-space: pre-wrap;
      word-break: break-word;
      padding: 1rem;
      font-size: 0.8125rem;
      line-height: 1.6;
      font-family: Consolas, Monaco, "Courier New", monospace;
    }

    .empty-state {
      padding: 3rem 1rem;
      text-align: center;
      color: var(--text-secondary);
    }

    .empty-state-icon {
      font-size: 2rem;
      margin-bottom: 0.75rem;
      opacity: 0.6;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(15, 23, 42, 0.72);
      z-index: 300;
    }

    .modal.open {
      display: flex;
    }

    .modal-card {
      width: min(1320px, 100%);
      height: min(90vh, 920px);
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.14);
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .modal-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-light);
    }

    .modal-body {
      overflow: auto;
      background: var(--bg);
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-body img {
      max-width: 100%;
      height: auto;
      display: block;
      background: #fff;
    }

    @media (max-width: 960px) {
      body {
        overflow: auto;
      }

      .container {
        flex-direction: column;
        height: auto;
      }

      .controls-pane {
        width: 100%;
        border-left: none;
        border-top: 1px solid var(--border-light);
      }

      .preview-pane {
        min-height: 50vh;
      }
    }

    @media (max-width: 768px) {
      .header-content {
        padding: 0 1rem;
        flex-wrap: wrap;
        height: auto;
        min-height: 64px;
        padding-top: 0.75rem;
        padding-bottom: 0.75rem;
      }

      .lang-btn {
        margin-left: 0;
      }

      .header-info {
        order: 3;
        width: 100%;
        padding: 0;
      }

      .preview-frame {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <a href="./visuals.html" class="back-btn" id="backBtn" onclick="return goBack(event)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"></path>
        </svg>
        <span data-i18n="back">返回</span>
      </a>
      <button id="langToggle" class="lang-btn" type="button">English</button>
      <div class="header-info">
        <h1 id="visualName">加载中...</h1>
        <p id="visualMeta"></p>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="preview-pane">
      <div class="preview-content">
        <div class="preview-frame">
          <div class="preview-surface">
            <img id="previewImage" alt="">
          </div>
        </div>
      </div>
    </div>

    <div class="controls-pane">
      <div class="controls-content">
        <div id="details">
          <div class="empty-state">
            <div class="empty-state-icon">🖼️</div>
            <p data-i18n="loading-details">加载图片详情中...</p>
          </div>
        </div>
      </div>

      <div class="controls-footer">
        <div class="control-group" style="margin-bottom: 0; padding-bottom: 0; border-bottom: none;">
          <h3 data-i18n="prompt-title">AI 生图提示词</h3>
          <div class="code-block">
            <div class="code-block-header">
              <button class="code-copy-btn" id="codeCopyBtn" type="button" onclick="copyPrompt()" title="复制提示词">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                <span data-i18n="btn-copy">复制</span>
              </button>
            </div>
            <code id="promptOutput">加载中...</code>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="previewModal" class="modal" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-toolbar">
        <strong id="modalTitle">图片预览</strong>
        <button id="closeModal" class="action-btn" type="button">关闭</button>
      </div>
      <div class="modal-body">
        <img id="modalImage" alt="">
      </div>
    </div>
  </div>

  <script>
    function goBack(event) {
      if (window.history.length > 1 && document.referrer && document.referrer.indexOf(location.origin) === 0) {
        event.preventDefault();
        window.history.back();
        return false;
      }
      return true;
    }

    const LANG_KEY = "olc-lang";
    const urlParams = new URLSearchParams(window.location.search);
    const visualId = urlParams.get("id");
    let currentItem = null;

    const i18n = {
      zh: {
        "back": "返回",
        "loading-details": "加载图片详情中...",
        "loading": "加载中...",
        "prompt-title": "AI 生图提示词",
        "btn-copy": "复制",
        "copy-success": "已复制",
        "copy-fail": "复制失败",
        "download": "下载图片",
        "enlarge": "放大查看",
        "open-original": "打开原图",
        "meta-subject": "学科",
        "meta-type": "分类",
        "meta-topic": "主题",
        "meta-format": "格式",
        "meta-size": "尺寸",
        "meta-grades": "适用学段",
        "meta-related": "相关组件",
        "meta-tags": "标签",
        "not-found-title": "图片未找到",
        "not-found-desc": "请检查图片 ID 是否正确。",
        "need-id-title": "请指定图片 ID",
        "need-id-desc": "请在 URL 中添加 ?id=图片ID",
        "lang-label": "English",
        "preview-title": "图片预览"
      },
      en: {
        "back": "Back",
        "loading-details": "Loading visual details...",
        "loading": "Loading...",
        "prompt-title": "AI Image Prompt",
        "btn-copy": "Copy",
        "copy-success": "Copied",
        "copy-fail": "Copy failed",
        "download": "Download Image",
        "enlarge": "Enlarge",
        "open-original": "Open Original",
        "meta-subject": "Subject",
        "meta-type": "Category",
        "meta-topic": "Topic",
        "meta-format": "Format",
        "meta-size": "Size",
        "meta-grades": "Grade Range",
        "meta-related": "Related Components",
        "meta-tags": "Tags",
        "not-found-title": "Visual not found",
        "not-found-desc": "Please check whether the visual ID is correct.",
        "need-id-title": "Visual ID required",
        "need-id-desc": "Please append ?id=visualId in the URL.",
        "lang-label": "中文",
        "preview-title": "Image Preview"
      }
    };

    function resolveInitialLang() {
      const queryLang = (urlParams.get("lang") || "").toLowerCase();
      if (queryLang === "en") return "en";
      if (queryLang === "zh" || queryLang === "zh-cn") return "zh";
      const stored = (localStorage.getItem(LANG_KEY) || "").toLowerCase();
      if (stored === "en") return "en";
      if (stored === "zh" || stored === "zh-cn") return "zh";
      return (navigator.language || "").toLowerCase().startsWith("en") ? "en" : "zh";
    }

    let currentLang = resolveInitialLang();

    function t(key) {
      return i18n[currentLang]?.[key] ?? i18n.zh[key] ?? key;
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatValue(value, fallback = "-") {
      if (Array.isArray(value)) return value.length ? value.join(", ") : fallback;
      return value ? String(value) : fallback;
    }

    function resolveLocaleFile() {
      return currentLang === "en" ? "en" : "zh-CN";
    }

    function getAssetFilename(assetPath, id) {
      const clean = String(assetPath || "").split("/").pop() || "";
      return clean || `${id || "visual"}.asset`;
    }

    function applyStaticTexts() {
      document.querySelectorAll("[data-i18n]").forEach((element) => {
        element.textContent = t(element.getAttribute("data-i18n"));
      });
      const langBtn = document.getElementById("langToggle");
      if (langBtn) langBtn.textContent = t("lang-label");
      document.getElementById("modalTitle").textContent = t("preview-title");
      document.getElementById("closeModal").textContent = t("back") === "Back" ? "Close" : "关闭";
    }

    function setHeader(item) {
      const name = item ? item.title : t("loading");
      const meta = item
        ? `${item.subject} · ${item.type} · ${item.topic}`
        : "";
      document.getElementById("visualName").textContent = name;
      document.getElementById("visualMeta").textContent = meta;
      document.title = item ? `${item.title} - Open Lab Components` : `图片详情 - Open Lab Components`;
    }

    function renderEmpty(title, desc) {
      setHeader(null);
      document.getElementById("details").innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">⚠️</div>
          <h3>${title}</h3>
          <p>${desc}</p>
        </div>
      `;
      document.getElementById("promptOutput").textContent = "";
    }

    async function loadVisual() {
      if (!visualId) {
        renderEmpty(t("need-id-title"), t("need-id-desc"));
        return;
      }

      try {
        const response = await fetch(`./registry/visuals.${resolveLocaleFile()}.json`);
        const payload = await response.json();
        const items = Array.isArray(payload.items) ? payload.items : [];
        currentItem = items.find((item) => item.id === visualId) || null;
        if (!currentItem) {
          renderEmpty(t("not-found-title"), t("not-found-desc"));
          return;
        }
        renderVisual();
      } catch (_error) {
        renderEmpty(t("not-found-title"), t("not-found-desc"));
      }
    }

    function renderVisual() {
      const item = currentItem;
      const sizeText = item.size && item.size.width && item.size.height
        ? `${item.size.width} × ${item.size.height}`
        : "-";
      const assetFilename = getAssetFilename(item.assetPath, item.id);

      setHeader(item);
      document.getElementById("previewImage").src = `./${item.assetPath}`;
      document.getElementById("previewImage").alt = item.title;
      document.getElementById("promptOutput").textContent = item.aiPrompt || "";

      document.getElementById("details").innerHTML = `
        <div class="control-group">
          <h3>${t("download")}</h3>
          <div style="display:flex; gap:0.75rem; flex-wrap:wrap;">
            <a class="action-btn primary" href="./${item.assetPath}" download="${escapeHtml(assetFilename)}">${t("download")}</a>
            <button class="action-btn" id="enlargeButton" type="button">${t("enlarge")}</button>
            <a class="action-btn" href="./${item.assetPath}" target="_blank" rel="noopener">${t("open-original")}</a>
          </div>
        </div>

        <div class="control-group">
          <h3>${t("meta-type")}</h3>
          <div class="meta-list">
            <div class="meta-row">
              <div class="meta-label">${t("meta-subject")}</div>
              <div class="meta-value">${escapeHtml(item.subject)}</div>
            </div>
            <div class="meta-row">
              <div class="meta-label">${t("meta-type")}</div>
              <div class="meta-value">${escapeHtml(item.type)}</div>
            </div>
            <div class="meta-row">
              <div class="meta-label">${t("meta-topic")}</div>
              <div class="meta-value">${escapeHtml(item.topic)}</div>
            </div>
            <div class="meta-row">
              <div class="meta-label">${t("meta-format")}</div>
              <div class="meta-value">${escapeHtml(item.format)}</div>
            </div>
            <div class="meta-row">
              <div class="meta-label">${t("meta-size")}</div>
              <div class="meta-value">${escapeHtml(sizeText)}</div>
            </div>
            <div class="meta-row">
              <div class="meta-label">${t("meta-grades")}</div>
              <div class="meta-value">${escapeHtml(formatValue(item.gradeRange))}</div>
            </div>
            <div class="meta-row">
              <div class="meta-label">${t("meta-related")}</div>
              <div class="meta-value">${escapeHtml(formatValue(item.relatedComponents))}</div>
            </div>
          </div>
        </div>

        <div class="control-group">
          <h3>${t("meta-tags")}</h3>
          <div class="tags">
            ${(item.tags || []).length
              ? item.tags.map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join("")
              : `<span class="meta-value">-</span>`
            }
          </div>
        </div>
      `;

      document.getElementById("enlargeButton").addEventListener("click", openModal);
    }

    async function copyPrompt() {
      const text = (currentItem && currentItem.aiPrompt) || "";
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        const btn = document.getElementById("codeCopyBtn");
        const label = btn.querySelector("span");
        label.textContent = t("copy-success");
        setTimeout(() => {
          label.textContent = t("btn-copy");
        }, 1200);
      } catch (_error) {
        alert(t("copy-fail"));
      }
    }

    function openModal() {
      if (!currentItem) return;
      const modal = document.getElementById("previewModal");
      const modalImage = document.getElementById("modalImage");
      modalImage.src = `./${currentItem.assetPath}`;
      modalImage.alt = currentItem.title;
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
    }

    function closeModal() {
      const modal = document.getElementById("previewModal");
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
    }

    function switchLang() {
      currentLang = currentLang === "zh" ? "en" : "zh";
      localStorage.setItem(LANG_KEY, currentLang);
      urlParams.set("lang", currentLang);
      window.location.search = urlParams.toString();
    }

    document.getElementById("langToggle").addEventListener("click", switchLang);
    document.getElementById("closeModal").addEventListener("click", closeModal);
    document.getElementById("previewModal").addEventListener("click", (event) => {
      if (event.target.id === "previewModal") closeModal();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeModal();
    });

    applyStaticTexts();
    loadVisual();
  </script>
</body>
</html>
