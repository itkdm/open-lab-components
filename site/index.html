      box-shadow: var(--shadow-sm);

      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border-light);

      height: 100%;
      background: transparent;
      transform: scale(0.7);
      transform-origin: center;
    }

      left: 0;
      right: 0;
      bottom: 0;

      align-items: center;
      justify-content: center;
      gap: 0.75rem;

      pointer-events: none;

      display: flex;
      flex-direction: column;
    }

      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }

      line-height: 1.5;
      color: var(--text-secondary);
      margin-bottom: 0.75rem;

    }

    }
    
    .card-tags {

      gap: 0.375rem;
      flex-wrap: wrap;
      margin-top: auto;
    }

      color: var(--accent);

      padding: 6rem 2rem;
      color: var(--text-secondary);
      grid-column: 1 / -1;
    }

      margin-bottom: 1rem;

    }
    
    .empty h3 {

      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }
    
    .loading {
      text-align: center;
      padding: 6rem 2rem;
      color: var(--text-secondary);
      grid-column: 1 / -1;
    }

      padding: 0;

      border: none;
      font-size: 0.9375rem;
      font-weight: 500;

        font-size: 2rem;
      }
      
      main {
        padding: 24px 16px;

      .footer-contact {

      en: {

        'hero-btn-primary': 'Browse Components',

        'loading': 'Loading',
        'empty-title': 'No components yet',
        'empty-desc': 'Add components under the components directory and run the build script.',
        'btn-more': 'View More',
        'btn-preview': 'Preview',

        'footer-wechat-title': 'Contact the Author',
        'footer-wechat-desc': 'Custom components, bug reports, collaboration\nPlease note OLC when adding\nComponents still contain many bugs, feel free to report and help improve',
        'lang-label': '中文'
      }
    };

    function resolveInitialLang() {
      const params = new URLSearchParams(window.location.search);
      const queryLang = (params.get('lang') || '').toLowerCase();
      if (queryLang === 'en') return 'en';
      if (queryLang === 'zh' || queryLang === 'zh-cn') return 'zh';
      const stored = (localStorage.getItem(LANG_KEY) || '').toLowerCase();
      if (stored === 'en') return 'en';
      if (stored === 'zh' || stored === 'zh-cn') return 'zh';
      const browserLang = (navigator.language || '').toLowerCase();
      return browserLang.startsWith('en') ? 'en' : 'zh';
    }

    let currentLang = resolveInitialLang();
    let typewriterTimer = null;

    function t(key) {
      return i18n[currentLang]?.[key] ?? i18n.zh[key] ?? key;
    }

    function getComponentName(component) {
      return component.name || component.nameEn || component.id;
    }

    function getCategoryName(component) {
      return component.categoryName || component.categoryNameEn || component.category;
    }

    function applyStaticTexts() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        // hero-desc 使用打字机效果，单独处理
        if (key === 'hero-desc') return;
        const text = t(key);
        if (text.includes('\n')) {
          el.innerHTML = text.replace(/\n/g, '<br>');
        } else {
          el.textContent = text;
        }
      });
      const langBtn = document.getElementById('langToggle');
      if (langBtn) langBtn.textContent = t('lang-label');
      const heroDescEl = document.getElementById('heroDesc');
      if (heroDescEl) {
        startTypewriter(heroDescEl, t('hero-desc'));
      }
      // 更新"查看更多"按钮文本
      const moreBtn = document.getElementById('moreBtn');
      if (moreBtn) {
        moreBtn.textContent = t('btn-more');
      }
    }

    function startTypewriter(el, text) {
      if (!el) return;
      if (typewriterTimer) {
        clearInterval(typewriterTimer);
        typewriterTimer = null;
      }
      el.textContent = '';
      let i = 0;
      const total = text.length;
      typewriterTimer = setInterval(() => {
        el.textContent = text.slice(0, i + 1);
        i++;
        if (i >= total) {
          clearInterval(typewriterTimer);
          typewriterTimer = null;
        }
      }, 60);
    }

    async function loadRegistry() {
      try {
        const locale = currentLang === 'en' ? 'en' : 'zh-CN';
        const res = await fetch(`./registry/registry.${locale}.json`);
        const data = await res.json();
        registry = Array.isArray(data.items) ? data.items : (Array.isArray(data) ? data : []);
        render();
      } catch (err) {
        document.getElementById('grid').innerHTML = `
          <div class="empty">
            <div class="empty-icon">⚠️</div>
            <h3>${t('empty-title')}</h3>
            <p>${t('empty-desc')}</p>
          </div>
        `;
      }
    }

    function render() {
      const grid = document.getElementById('grid');
      const moreBtn = document.getElementById('moreBtn');
      
      if (!Array.isArray(registry) || registry.length === 0) {
        grid.innerHTML = `
          <div class="empty">
            <div class="empty-icon">🔍</div>
            <h3>${t('empty-title')}</h3>
            <p>${t('empty-desc')}</p>
          </div>
        `;
        // 即使没有组件，也显示"查看更多"按钮，让用户可以跳转到组件列表页
        if (moreBtn) moreBtn.style.display = 'inline-flex';
        return;
      }

      // 首页不限制数量：展示全部组件
      const displayItems = registry;
      
      grid.innerHTML = displayItems.map(c => {
        const categoryPath = c.category.replace('/', '/');
        const componentPath = `./components/${categoryPath}/${c.id}.html`;
        const tags = c.tags || [];
        const tagsHtml = tags.slice(0, 3).map(t => `<span class="tag">${t}</span>`).join('');
        const moreTags = tags.length > 3 ? `<span class="tag tag-more">+${tags.length - 3}</span>` : '';
        
        return `
          <div class="card" onclick="openPlayground('${c.id}')">
            <div class="card-preview">
              <iframe src="${componentPath}" scrolling="no"></iframe>
              <div class="card-actions">
                <button class="card-action-btn primary" onclick="event.stopPropagation(); openPlayground('${c.id}')">${t('btn-preview')}</button>
                <button class="card-action-btn" onclick="event.stopPropagation(); copyComponent('${c.id}')">${t('btn-copy')}</button>
              </div>
            </div>
            <div class="card-body">
              <div class="card-title">${getComponentName(c)}</div>
              <div class="card-meta">
                <span class="category">${getCategoryName(c)}</span>
                <span> · </span>
                <span class="version">v${c.version}</span>
              </div>
              <div class="card-tags">${tagsHtml}${moreTags}</div>
            </div>
          </div>
        `;
      }).join('');
      
      // 显示"查看更多"按钮（作为导航按钮，始终显示）
      if (moreBtn) {
        moreBtn.style.display = 'inline-flex';
      }
    }

    function openPlayground(id) {
      const target = `./playground.html?id=${id}`;
      window.location.href = target;
    }

    async function getComponentHTML(path) {
      try {
        const res = await fetch(path);
        let text = await res.text();
        
        // 移除 @cmp-manifest 注释块
        text = text.replace(/<!--\s*@cmp-manifest[\s\S]*?-->/g, '').trim();
        
        // 如果包含完整的 HTML 文档结构，提取 body 内容
        if (text.indexOf('<body>') !== -1) {
          const bodyMatch = text.match(/<body[^>]*>([\s\S]*)<\/body>/i);
          if (bodyMatch) {
            text = bodyMatch[1].trim();
          }
        }
        
        // 确保返回的代码有适当的缩进
        const lines = text.split('\n');
        const indented = lines.map((line, index) => {
          // 第一行不缩进，其他行缩进 2 个空格
          if (index === 0) return line.trim();
          return '  ' + line;
        }).join('\n');
        
        return indented;
      } catch (err) {
        return '  <!-- 组件内容 -->';
      }
    }

    async function copyComponent(id) {
      const component = registry.find(c => c.id === id);
      if (!component) return;
      
      try {
        // 获取组件路径
        const categoryPath = component.category.replace('/', '/');
        const componentPath = `./components/${categoryPath}/${component.id}.html`;
        
        // 获取组件的实际 HTML 内容
        const componentHtml = await getComponentHTML(componentPath);
        
        // 构建 CSS 变量（使用默认值）
        const cssVars = {};
        if (component.cssVars && component.props) {
          component.props.forEach(prop => {
            const cssVar = component.cssVars[prop.key];
            if (cssVar) {
              let val = prop.default;
              if (prop.type === 'number(px)') {
                val = val + 'px';
              } else if (prop.type === 'number(deg)') {
                val = val + 'deg';
              }
              cssVars[cssVar] = val;
            }
          });
        }
        
        // 生成 style 字符串
        const styleStr = Object.entries(cssVars)
          .map(([k, v]) => `${k}: ${v}`)
          .join('; ');
        
        // 生成完整的组件代码
        let code;
        if (styleStr) {
          code = `<div class="cmp" data-cmp-id="${component.id}" style="${styleStr}">
${componentHtml}
</div>`;
        } else {
          code = `<div class="cmp" data-cmp-id="${component.id}">
${componentHtml}
</div>`;
        }
        
        // 复制到剪贴板
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(code);
          alert(t('copy-success'));
        } else {
          fallbackCopy(code);
        }
      } catch (err) {
        // 如果获取组件内容失败，至少复制一个基本的占位符
        const fallbackCode = `<div class="cmp" data-cmp-id="${component.id}">
  <!-- 组件内容 -->
</div>`;
        fallbackCopy(fallbackCode);
      }
    }

    function fallbackCopy(code) {
      const textarea = document.createElement('textarea');
      textarea.value = code;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      alert(t('copy-success'));
    }

    window.copyComponent = copyComponent;

    function switchLang() {
      currentLang = currentLang === 'zh' ? 'en' : 'zh';
      localStorage.setItem(LANG_KEY, currentLang);
      applyStaticTexts();
      loadRegistry();
    }

    const langToggle = document.getElementById('langToggle');
    if (langToggle) {
      langToggle.addEventListener('click', switchLang);
    }

    applyStaticTexts();
    loadRegistry();
  </script>
